name: Assets e geração V06
on:
  push:
    branches: [main, 'codex/temas-v06*']
  pull_request:
    paths:
      - 'ambiente_fonte/.assistant/hub_readmes_visual_assets/**'
      - 'ambiente_fonte/.assistant/hub_padroes/identidade_visual/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/tema/**'
      - 'Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_readmes_visual_assets/**'
      - 'tools/readme_visuals/**'
      - 'tools/tests/test_temas_v06*.py'
      - 'docs/sprints/sistema_temas/V06/**'
      - '.github/workflows/temas-v06-ci.yml'
permissions:
  contents: write
jobs:
  assets-v06:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SOURCE_DATE_EPOCH: '1700000000'
      CHANGELOG_ENTRY_B64: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências Python de temas e regressões
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python -m pip install 'ipywidgets>=8,<9'
      - name: Dependências do compositor v2
        run: |
          npm install --global pnpm@10.34.5
          pnpm --dir tools/readme_visuals install --frozen-lockfile
      - name: V06 — assets, derivado controlado e determinismo
        run: python -B tools/tests/test_temas_v06.py -v
      - name: Regressões de temas V01–V06
        run: python -B -m unittest discover -s tools/tests -p 'test_temas*.py' -v
      - name: Compatibilidade visual V00
        run: python -B tools/tests/test_visual_legado_v00.py
      - name: Validação estrutural e documental
        run: python -B tools/validate_assistant.py --conferir-readme
      - name: Escopo
        run: echo 'V06 gera e verifica variantes candidatas locais a partir de ResolvedTheme; não aprova, não publica no Databricks e não homologa browser, acessibilidade ou UAT.'
      - name: Inserir fechamento V06 no changelog
        if: github.event_name == 'push' && success()
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## 2026-09-14 — V05: fechamento técnico do Visual Lab em candidata (Codex)'
          title = '## 2026-09-14 — V06: integração Git e fechamento técnico (ChatGPT)'
          if title in text:
              raise SystemExit('V06_CHANGELOG_ALREADY_PRESENT')
          if text.count(marker) != 1:
              raise SystemExit(f'V06_CHANGELOG_MARKER_COUNT={text.count(marker)}')
          entry = base64.b64decode(os.environ['CHANGELOG_ENTRY_B64']).decode('utf-8')
          path.write_text(text.replace(marker, entry + '\n' + marker, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs(v06): registrar fechamento no changelog"
          git push origin HEAD:codex/temas-v06-fechamento-documental-20260914
