name: Production readiness V14

# Receita manual de compatibilidade. Execução automática: ci.yml (DAG compartilhado).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness-v14:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SOURCE_DATE_EPOCH: '1700000000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar derivado local do SHA
        run: |
          python -B tools/render_simulado.py --write
          python -B tools/render_simulado.py --check
      - name: Dependências Python
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python -m pip install 'ipywidgets>=8,<9'
          python -m pip install -r ambiente_fonte/.assistant/hub_padroes/identidade_visual/databricks_app/requirements.txt

      - name: Dependências do compositor visual
        run: |
          npm install --global pnpm@10.34.5
          pnpm --dir tools/readme_visuals install --frozen-lockfile

      - name: V14 S0 — regressão histórica de freeze
        run: python -B tools/tests/test_temas_v14_s0.py -v

      - name: V14 S1 — ownership, autoridade e negativos
        run: |
          python -B tools/temas_v14_ownership.py --check
          python -B tools/tests/test_temas_v14_s1.py -v

      - name: Regressões canônicas de temas
        run: python -B -m unittest discover -s tools/tests -p 'test_temas*.py' -v

      - name: Compatibilidade visual V00
        run: python -B tools/tests/test_visual_legado_v00.py

      - name: Validação estrutural e documental
        run: python -B tools/validate_assistant.py --conferir-readme

      - name: Fronteira S1 read-only
        shell: bash
        run: |
          set -euo pipefail
          echo "V14_S0_NETWORK=0"
          echo "V14_S0_REMOTE_MUTATION=0"
          echo "V14_S0_DATABRICKS_MUTATION=0"
          echo "V14_S1_NETWORK=0"
          echo "V14_S1_REMOTE_MUTATION=0"
          echo "V14_S1_DATABRICKS_MUTATION=0"
          echo "V14_S1_PRODUCTION_READINESS_DECLARED=0"
          echo "V14_S1_GO_LIVE_DECISION=0"
          echo "V14_S2_NOT_STARTED=1"
