name: Validacao temporaria do ajuste de imagens
on:
  push:
    branches: ['chatgpt/revisao-readmes-2026-09-11']
    paths: ['.github/workflows/readme-image-snapshot.yml']
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e90af520fdb5c8db1d8bc22cebb3d426ea7568f5
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Aplicar somente o patch conferido localmente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, bz2, hashlib, json, os, pathlib, subprocess, urllib.request
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == 'e90af520fdb5c8db1d8bc22cebb3d426ea7568f5'
          url='https://api.github.com/repos/Guimarais-R-Rodrigo/Ambiente_Databricks/git/blobs/e366aa033d89b7d9554bfbf794b897c7c4b0c03b'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=60) as response: obj=json.load(response)
          patch=bz2.decompress(base64.b64decode(obj['content']))
          assert hashlib.sha256(patch).hexdigest() == 'fb957adbeda7454ba2e53b960238def34a5e040dc24fb648188514a5f00271d3'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'images.patch';path.write_bytes(patch)
          allowed={'CHANGELOG.md','README.md','Template_READMEs/sprints_preenchidos/PLANO.md','Template_READMEs/sprints_preenchidos/README.md','Template_READMEs/sprints_preenchidos/REVISAO.md','Template_READMEs/sprints_preenchidos/sprint-01-raiz/README.md','Template_READMEs/sprints_preenchidos/sprint-04-scripts/README.md','tools/review_readmes.py','tools/tests/test_readme_review.py'}
          stats=subprocess.check_output(['git','apply','--numstat',str(path)],text=True)
          assert {line.split('\t',2)[2] for line in stats.splitlines()} == allowed
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == 'c766a9820d12f2ae083eac52052c367dd1fc0961'
          PY
      - name: Dependencias de teste do runner
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Gate completo e guardas de posicionamento
        shell: bash
        run: |
          set -o pipefail
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/imagens-gate.log"
          git diff --cached --check
      - name: Preparar blobs validados sem criar commit ou mover branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          entries=[]
          for name in subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines():
              data=subprocess.check_output(['git','show',':'+name])
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/Guimarais-R-Rodrigo/Ambiente_Databricks/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response: obj=json.load(response)
              assert obj['sha'] == expected
              entries.append({'path':name,'mode':'100644','type':'blob','sha':obj['sha']})
          result={'tree':subprocess.check_output(['git','write-tree'],text=True).strip(),'files':entries,'gate':'passed','run_id':os.environ['GITHUB_RUN_ID']}
          pathlib.Path(os.environ['RUNNER_TEMP'],'imagens-blobs.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          print('Nenhum commit criado e nenhuma branch movida pelo runner.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-images-validation
          path: |
            ${{ runner.temp }}/imagens-gate.log
            ${{ runner.temp }}/imagens-blobs.json
          retention-days: 3
