name: Freeze R05 modelos tabulares v2
on:
  push:
    branches: [codex/readmes-r05]
    paths: [.github/workflows/readmes-r05-freeze-v2.yml]
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BASE_COMMIT: d9da056c95bf5c4209b2f208de1c9a987580efe7
      BASE_TREE: d461d1a2ef8523d380f82bac6bb112287e6cd870
      EXPECTED_PARENT: 1c8bab7476b4a365369614c9662b30ad4ade4180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Integrar prosa com matcher corrigido
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/readmes-r05-freeze.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY\n",start)
          source=textwrap.dedent(workflow[start:end])
          old=r"# MAGIC \\*target encoding\\* de vazar o alvo\\."
          new=r"# MAGIC o \\*target encoding\\* de vazar o alvo\\."
          assert source.count(old)==1,source.count(old)
          source=source.replace(old,new,1)
          exec(compile(source,'r05_integracao_extraida.py','exec'),{'__name__':'__main__'})
          PY
          cp ambiente_fonte/.assistant/MANUAL_TECNICO.md MANUAL_TECNICO.md
          python tools/render_simulado.py --write
          git rm .github/workflows/readmes-r05-freeze.yml .github/workflows/readmes-r05-freeze-v2.yml
          git add -A
          python tools/validate_assistant.py > "$RUNNER_TEMP/validator-pre.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'],'validator-pre.txt').read_text()
          keys=['skills','prompts','helpers citados','markdown / links','notebooks / links','readmes de objeto','pastas de objeto','forma da pasta','contrato de dados','contrato de entrada','saída colada','idioma da docstring','normas do molde','notebook exercita','python (AST)','instrucoes','repo (identidade)','repo (links)']
          actual={}
          for line in out.splitlines():
              for key in keys:
                  if line.startswith(key): actual[key]=line
          assert set(actual)==set(keys),set(keys)-set(actual)
          assert '38/75 operacionais' in actual['readmes de objeto'] and '37 pendentes' in actual['readmes de objeto'],actual['readmes de objeto']
          p=Path('README.md'); lines=p.read_text(encoding='utf-8').splitlines(); found=set()
          for i,line in enumerate(lines):
              for key,value in actual.items():
                  if line.startswith(key): lines[i]=value; found.add(key); break
          assert found==set(keys),set(keys)-found
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git add -A
          git diff --cached --check "$BASE_COMMIT"
          git write-tree | tee "$RUNNER_TEMP/tree-pre.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-dev.txt
            tools/requirements-temas-dev.txt
      - name: Gate vigente, V00-V03 e preservação
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-dev.txt -r tools/requirements-temas-dev.txt >/dev/null
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/gate.txt"
          for suite in test_inventario_visual test_visual_legado_v00 test_baseline_visual_runner test_temas_v01 test_temas_v01_integracao test_temas_v02 test_temas_v03; do python "tools/tests/$suite.py"; done
          python docs/sprints/readmes_objetos/evidencias_r05/verificar_preservacao.py 2>&1 | tee "$RUNNER_TEMP/preservacao.txt"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tree-pre.txt")"
          git diff --exit-code
      - name: Criar ambiente isolado dos modelos
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/r05-env"
          PY="$RUNNER_TEMP/r05-env/bin/python"
          "$PY" -m pip install --upgrade pip >/dev/null
          "$PY" -m pip install numpy==2.3.5 scikit-learn==1.7.2 lightgbm==4.6.0 catboost==1.2.8 optuna==4.5.0 >/dev/null
          "$PY" -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu >/dev/null
          "$PY" -m pip install pytorch-tabnet==4.1.0 >/dev/null
          "$PY" -m pip freeze > "$RUNNER_TEMP/r05-pacotes.txt"
      - name: Executar suíte R05 com bibliotecas reais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r05-work"
          (cd "$RUNNER_TEMP/r05-work" && "$RUNNER_TEMP/r05-env/bin/python" "$GITHUB_WORKSPACE/docs/sprints/readmes_objetos/evidencias_r05/verificar_r05.py" --require-models) 2>&1 | tee "$RUNNER_TEMP/r05.txt"
          ! grep -qi 'FAILED' "$RUNNER_TEMP/r05.txt"
          ! grep -qi 'skipped=' "$RUNNER_TEMP/r05.txt"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tree-pre.txt")"
      - name: Fechar relatório, rubrica e reconferir a mesma árvore
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          log=Path(os.environ['RUNNER_TEMP'],'r05.txt').read_text()
          m=re.search(r'Ran (\d+) tests',log); assert m,log[-2000:]
          cases=int(m.group(1))
          report=Path('docs/sprints/readmes_objetos/RELATORIO_R05.md'); s=report.read_text(encoding='utf-8')
          marker=f'Workflow de fechamento: **run {os.environ["GITHUB_RUN_ID"]}**. Resultado ainda não presumido; a árvore só é materializada após todos os gates, preservação e runtime dos seis objetos.'
          final=f'''Workflow de fechamento: **run {os.environ['GITHUB_RUN_ID']} — success até esta etapa**. Na árvore final: gate vigente aprovado; validador 0 falhas/0 avisos; V00/V01/V02/V03 aprovadas; preservação PASS; suíte R05 **{cases}/{cases} aprovada sem skips** com versões registradas em `r05-pacotes.txt`. Cobertura validada: **38/75 operacionais, 3/3 exemplares e 37 pendências**. A materialização ocorre somente após a reconferência abaixo.'''
          assert marker in s; report.write_text(s.replace(marker,final),encoding='utf-8')
          rubric=Path('docs/sprints/readmes_objetos/RUBRICA_R05.json'); data=json.loads(rubric.read_text(encoding='utf-8'))
          for key in ['contract_1_0_0','notebook_prose_only','implementation_unchanged','facade_unchanged','previous_readmes_preserved','migration_exactly_six_removed','repository_gate','v00','v01','v02','v03','model_runtime','manual_mirrors']:
              data['criteria'][key]='passed_self_review'
          data['remote_run_id']=int(os.environ['GITHUB_RUN_ID'])
          data['validated_coverage']='38/75 operacionais; 3/3 exemplares; 37 pendentes'
          rubric.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add -A
          git diff --cached --check "$BASE_COMMIT"
          python tools/ci_local.py --verbose > "$RUNNER_TEMP/gate-final.txt" 2>&1
          python docs/sprints/readmes_objetos/evidencias_r05/verificar_preservacao.py > "$RUNNER_TEMP/preservacao-final.txt"
          python tools/validate_assistant.py > "$RUNNER_TEMP/validator-final.txt"
          grep -q 'APROVADO: 0 falha(s), 0 aviso(s)' "$RUNNER_TEMP/validator-final.txt"
          grep -q '38/75 operacionais' "$RUNNER_TEMP/validator-final.txt"
          git diff --exit-code
          git write-tree | tee "$RUNNER_TEMP/final-tree.txt"
      - name: Materializar exatamente a árvore final testada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args])
          final=Path(os.environ['RUNNER_TEMP'],'final-tree.txt').read_text().strip(); assert git('write-tree').decode().strip()==final
          raw=git('diff','--cached','--no-renames','--name-status','-z',os.environ['BASE_COMMIT']).decode().split('\0'); entries=[]; i=0
          while i<len(raw) and raw[i]:
              st,p=raw[i:i+2]; i+=2; assert st in ('A','M'),(st,p)
              mode=git('ls-files','--stage','--',p).decode().split()[0]
              entries.append({'path':p,'mode':mode,'type':'blob','content':Path(p).read_text(encoding='utf-8')})
          req=urllib.request.Request(os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',data=json.dumps({'base_tree':os.environ['BASE_TREE'],'tree':entries}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=90) as response: tree=json.load(response)['sha']
          assert tree==final,(tree,final)
          result={'tree':tree,'base':os.environ['BASE_COMMIT'],'paths_vs_main':len(entries),'gate':'PASS','v00':'PASS','v01':'PASS','v02':'PASS','v03':'PASS','r05_runtime':'PASS','preservacao':'PASS','coverage':'38/75','pending':37,'run_id':os.environ['GITHUB_RUN_ID'],'workflow_in_final_tree':False,'main_changed':False,'databricks_published':False}
          Path(os.environ['RUNNER_TEMP'],'R05-FINAL.json').write_text(json.dumps(result,indent=2)+'\n'); print(json.dumps(result))
          PY
      - name: Guardar evidências mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r05-freeze-v2-evidencias
          retention-days: 7
          path: |
            ${{ runner.temp }}/validator-pre.txt
            ${{ runner.temp }}/validator-final.txt
            ${{ runner.temp }}/gate.txt
            ${{ runner.temp }}/gate-final.txt
            ${{ runner.temp }}/preservacao.txt
            ${{ runner.temp }}/preservacao-final.txt
            ${{ runner.temp }}/r05.txt
            ${{ runner.temp }}/r05-pacotes.txt
            ${{ runner.temp }}/final-tree.txt
            ${{ runner.temp }}/R05-FINAL.json
          if-no-files-found: warn
