name: Transporte exato V02
on:
  push:
    branches: [codex/temas-v02]
permissions:
  contents: write
jobs:
  transportar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_BASE: 1be947b0a62c3b0b85fa3cd5692f474b9066d85f
      EXPECTED_COMMIT: 921f898cbae859b8f6a91862a7b65291c9806906
      EXPECTED_TREE: 984c8c8942fe03f64a3b750576a7a412260a7f80
      EXPECTED_BUNDLE_SHA256: baf4cf410f34c8fb0cf0f8ec9a24fbb28704d2465bb51417737bf503339d18b6
      REVIEW_BRANCH: codex/temas-v02-review-20260912
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruir e verificar bundle local já testado
        shell: bash
        run: |
          set -euo pipefail
          parts=(.github/transport/v02/part01.b64 .github/transport/v02/part02.b64 .github/transport/v02/part03.b64 .github/transport/v02/part04.b64 .github/transport/v02/part05.b64 .github/transport/v02/part06.b64)
          cat "${parts[@]}" > /tmp/v02.bundle.b64
          base64 -d /tmp/v02.bundle.b64 > /tmp/v02.bundle
          actual_sha="$(sha256sum /tmp/v02.bundle | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_BUNDLE_SHA256"
          git bundle verify /tmp/v02.bundle
          git fetch /tmp/v02.bundle refs/heads/codex/temas-v02-implementacao:refs/remotes/v02/candidate
          test "$(git rev-parse refs/remotes/v02/candidate)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse refs/remotes/v02/candidate^{tree})" = "$EXPECTED_TREE"
          git merge-base --is-ancestor "$EXPECTED_BASE" refs/remotes/v02/candidate
      - name: Recusar main diferente da base reconciliada
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_BASE"
      - name: Registrar diff exato transportado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v02-transport
          git diff --name-status "$EXPECTED_BASE" refs/remotes/v02/candidate > /tmp/v02-transport/diff_name_status.txt
          git diff --stat "$EXPECTED_BASE" refs/remotes/v02/candidate > /tmp/v02-transport/diff_stat.txt
          printf '%s\n' "$EXPECTED_BASE" > /tmp/v02-transport/base.txt
          printf '%s\n' "$EXPECTED_COMMIT" > /tmp/v02-transport/commit.txt
          printf '%s\n' "$EXPECTED_TREE" > /tmp/v02-transport/tree.txt
          printf '%s\n' "$EXPECTED_BUNDLE_SHA256" > /tmp/v02-transport/bundle_sha256.txt
          git show -s --format=fuller "$EXPECTED_COMMIT" > /tmp/v02-transport/commit_metadata.txt
      - name: Publicar somente a branch limpa de revisão
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "refs/heads/$REVIEW_BRANCH" >/tmp/existing 2>/dev/null; then
            existing="$(awk '{print $1}' /tmp/existing)"
            test "$existing" = "$EXPECTED_COMMIT"
          else
            git push origin "refs/remotes/v02/candidate:refs/heads/$REVIEW_BRANCH"
          fi
          remote_review="$(git ls-remote origin "refs/heads/$REVIEW_BRANCH" | awk '{print $1}')"
          test "$remote_review" = "$EXPECTED_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v02-transporte-${{ github.run_id }}
          path: /tmp/v02-transport
          retention-days: 30
