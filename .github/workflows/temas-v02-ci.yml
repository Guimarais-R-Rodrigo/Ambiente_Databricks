name: Núcleo de temas V02
on:
  push:
    branches: [main, codex/temas-v02]
  pull_request:
permissions:
  contents: read
jobs:
  nucleo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências declaradas
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Preparar derivado local do SHA
        run: |
          python -B tools/validate_assistant.py --conferir-readme
          python -B tools/render_simulado.py --write
          python -B tools/render_simulado.py --check
      - name: Fonte única, API, documentação e testes V02
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/temas_v02_check.py
          python -B tools/temas_v01_contract.py
          python -B tools/tests/test_temas_v02.py
      - name: Exemplo sintético sem Spark ou dados externos
        run: python -B ambiente_databricks/.assistant/hub_snippets/visual/tema/exemplo_tema.py
