name: Alinhar documentação P2 V03
on:
  push:
    branches:
      - codex/temas-v03-review-20260912
permissions:
  contents: write
jobs:
  alinhar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências declaradas
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Aplicar correções e regenerar derivados
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/_v03_doc_p2.py
          cp ambiente_fonte/.assistant/MANUAL_TECNICO.md MANUAL_TECNICO.md
          python -B tools/render_simulado.py --write
          git rm .github/workflows/v03-doc-review-p2-transitorio.yml tools/_v03_doc_p2.py
          cmp ambiente_fonte/.assistant/MANUAL_TECNICO.md MANUAL_TECNICO.md
          cmp ambiente_fonte/.assistant/MANUAL_TECNICO.md Novo_Ambiente_Simulado/Users/usuario-free/.assistant/MANUAL_TECNICO.md
          cmp ambiente_fonte/.assistant/hub_snippets/visual/theme_plotly/README.md Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/visual/theme_plotly/README.md
          cmp ambiente_fonte/.assistant/hub_snippets/visual/tema/README.md Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/visual/tema/README.md
      - name: Exigir árvore final verde
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/validate_assistant.py --conferir-readme
          python -B tools/tests/test_temas_v03.py
          python -B tools/tests/test_visual_legado_v00.py
          python -B tools/ci_local.py --verbose
      - name: Conferir escopo e gravar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add CHANGELOG.md MANUAL_TECNICO.md ambiente_fonte/.assistant/MANUAL_TECNICO.md ambiente_fonte/.assistant/hub_snippets/visual/theme_plotly/README.md ambiente_fonte/.assistant/hub_snippets/visual/theme_plotly/exemplo_theme_plotly.py ambiente_fonte/.assistant/hub_snippets/visual/tema/README.md Novo_Ambiente_Simulado/Users/usuario-free/.assistant/MANUAL_TECNICO.md Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/visual/theme_plotly/README.md Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/visual/theme_plotly/exemplo_theme_plotly.py Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/visual/tema/README.md
          git diff --cached --name-only
          git commit -m "docs(temas): alinhar dependências e integração V03 após review"
          git push origin HEAD:codex/temas-v03-review-20260912
