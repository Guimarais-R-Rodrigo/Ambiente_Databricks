name: Bases da revisao R02
on:
  push:
    branches: [codex/readmes-r02]
    paths: [.github/workflows/readmes-r02-revisao-base.yml]
permissions:
  contents: read
jobs:
  bases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exportar historico para diagnostico, sem integrar branches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 0c76bce9f3fa0f52b4312b60c3059e0fd27a2733
          git branch revisao-r02-base 0c76bce9f3fa0f52b4312b60c3059e0fd27a2733
          git branch revisao-main-base 8744157fe9c3e0603f689fb2bcad52445e96cb41
          git bundle create "$RUNNER_TEMP/revisao-r02-bases.bundle" revisao-r02-base revisao-main-base
          git bundle verify "$RUNNER_TEMP/revisao-r02-bases.bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: revisao-r02-bases
          path: ${{ runner.temp }}/revisao-r02-bases.bundle
          retention-days: 1
