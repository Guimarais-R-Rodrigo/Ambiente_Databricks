name: Conferencia da R03-A aprovada para execucao
on:
  push:
    branches: [codex/readmes-r03a]
    paths: [.github/workflows/readmes-r03a-apply.yml]
permissions:
  contents: read
jobs:
  conferir:
    if: github.ref == 'refs/heads/codex/readmes-r03a'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      SPARK_LOCAL_IP: '127.0.0.1'
      BASE_COMMIT: 5493f7db68f397ad7040485cb09bad53eb79be74
      BASE_TREE: 2af48247d18986dbc951fd0f0a11ece93ab73927
      EXPECTED_PARENT: 5fa12a683f3a9a40d5df96c67960e9e468af6fe2
      EXPECTED_TREE: 47c5d9ca2ffbfef150321aa3796961d99e89acae
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Aplicar somente patch com hashes conferidos
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          parts=sorted(Path('.github/readmes-r03a-transport').glob('part-*.txt'))
          assert len(parts)==5, 'Transporte incompleto'
          packed=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='8461db5e8db88c375e8c7c73b5d88e5da46abf168cb831398d7c24a8a156a1f4', 'Hash XZ divergente'
          patch=lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest()=='75c14931aaafb8405fdb1affd0254e09475c974439116fb9171cda6dc19a07cd', 'Hash patch divergente'
          Path(os.environ['RUNNER_TEMP'],'R03A.patch').write_bytes(patch)
          print('Hashes do patch conferidos')
          PY
          git apply --check "$RUNNER_TEMP/R03A.patch"
          git apply --index "$RUNNER_TEMP/R03A.patch"
          git rm -r .github/readmes-r03a-transport .github/workflows/readmes-r03a-apply.yml .github/workflows/readmes-r03a-base.yml
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Executar oito etapas permanentes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-dev.txt
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/r03a-gate.txt"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Executar todos os testes do lote com Spark real isolado
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/r03a-venv"
          "$RUNNER_TEMP/r03a-venv/bin/python" -m pip install pyspark==4.0.1
          "$RUNNER_TEMP/r03a-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/r03a-pacotes.txt"
          mkdir -p "$RUNNER_TEMP/r03a-spark"
          (cd "$RUNNER_TEMP/r03a-spark" && "$RUNNER_TEMP/r03a-venv/bin/python" "$GITHUB_WORKSPACE/docs/sprints/readmes_objetos/evidencias_r03a/verificar_r03a.py" --require-spark) 2>&1 | tee "$RUNNER_TEMP/r03a-objetos.txt"
          python docs/sprints/readmes_objetos/evidencias_r03a/verificar_preservacao.py 2>&1 | tee "$RUNNER_TEMP/r03a-preservacao.json"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - name: Armazenar arvore testada sem alterar branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args])
          assert git('write-tree').decode().strip()==os.environ['EXPECTED_TREE']
          changes=git('diff','--cached','--name-status','-z',os.environ['BASE_COMMIT']).decode().split('\0')
          entries=[];i=0
          while i<len(changes) and changes[i]:
              status,path=changes[i:i+2];i+=2
              assert status in ('A','M'), (status,path)
              mode=git('ls-files','--stage','--',path).decode().split()[0]
              entries.append({'path':path,'mode':mode,'type':'blob','content':Path(path).read_bytes().decode('utf-8')})
          assert len(entries)==77, len(entries)
          request=urllib.request.Request(
              os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',
              data=json.dumps({'base_tree':os.environ['BASE_TREE'],'tree':entries}).encode(),method='POST',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=90) as response: tree=json.load(response)['sha']
          assert tree==os.environ['EXPECTED_TREE'], tree
          result={'tree':tree,'base':os.environ['BASE_COMMIT'],'paths':len(entries),'gate':'8_PASS',
              'objetos_require_spark':'PASS','preservacao':'PASS','run_id':os.environ['GITHUB_RUN_ID'],
              'refs_atualizadas_pelo_workflow':False,'databricks_publicado':False}
          Path(os.environ['RUNNER_TEMP'],'R03A-integracao.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Guardar evidencias mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03a-evidencias-integracao
          retention-days: 7
          path: |
            ${{ runner.temp }}/r03a-gate.txt
            ${{ runner.temp }}/r03a-objetos.txt
            ${{ runner.temp }}/r03a-pacotes.txt
            ${{ runner.temp }}/r03a-preservacao.json
            ${{ runner.temp }}/R03A-integracao.json
          if-no-files-found: warn
