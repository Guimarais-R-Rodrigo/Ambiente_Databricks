name: Composicao verificada READMEs e Concierge
on:
  push:
    branches: [codex/readmes-integracao-r02]
    paths: [.github/workflows/readmes-integracao-r02-apply.yml]
permissions:
  contents: read
jobs:
  conferir:
    if: github.ref == 'refs/heads/codex/readmes-integracao-r02'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MAIN_COMMIT: 8744157fe9c3e0603f689fb2bcad52445e96cb41
      MAIN_TREE: 0062a9e82690b96a1cf0a650d4a3f362b78f6b38
      R02_COMMIT: 5996574a337e7c878e19db9d8312c871cb4cd98f
      EXPECTED_TREE: 2af48247d18986dbc951fd0f0a11ece93ab73927
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduzir composicao local sem merge ou atualizacao de refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$MAIN_COMMIT"
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, sys
          from pathlib import Path
          root = Path.cwd()
          parts = sorted(Path('.github/readmes-integracao-r02-transport').glob('part-*.txt'))
          if len(parts) != 2:
              raise SystemExit('Transporte incompleto')
          packed = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          if hashlib.sha256(packed).hexdigest() != '160122e6ac237eb433ff0b8dc093a74f347758fa541495e0bcb1bd571df00070':
              raise SystemExit('Hash divergente')
          plan = json.loads(lzma.decompress(packed))
          assert plan['main'] == os.environ['MAIN_COMMIT']
          assert plan['r02'] == os.environ['R02_COMMIT']
          assert plan['expected_tree'] == os.environ['EXPECTED_TREE']
          assert len(plan['writes']) == 22
          refs = {'main': plan['main'], 'r02': plan['r02']}
          def git(*args):
              return subprocess.check_output(['git', *args])
          def safe(path):
              p = root / path
              if not p.resolve().is_relative_to(root) or Path(path).is_absolute() or '..' in Path(path).parts:
                  raise ValueError(path)
              return p
          result = subprocess.run(['git', '-c', 'merge.conflictStyle=diff3', 'merge-tree',
              '--write-tree', '--name-only', refs['main'], refs['r02']], capture_output=True, text=True)
          assert result.returncode == 1, result.stdout + result.stderr
          first = result.stdout.split('\n\n', 1)[0].splitlines()
          assert set(first[1:]) == {'CHANGELOG.md', 'CLAUDE.md', 'README.md', 'tools/ci_local.py'}, first
          subprocess.run(['git', 'read-tree', '--reset', '-u', first[0]], check=True)
          for path, rule in plan['writes'].items():
              if 'text' in rule:
                  text = rule['text']
              else:
                  raw = git('show', f"{refs[rule['base']]}:{rule['path']}")
                  assert hashlib.sha256(raw).hexdigest() == rule['sha256'], path
                  lines = raw.decode('utf-8').splitlines(keepends=True)
                  for start, end, text in reversed(rule['edits']):
                      lines[start:end] = [text]
                  text = ''.join(lines)
              p = safe(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')
          for path in plan['deletes']:
              safe(path).unlink()
          original = git('show', f"{plan['ancestor']}:CHANGELOG.md").decode('utf-8')
          header, past = original.split('## ', 1)
          past = '## ' + past
          main = git('show', f"{refs['main']}:CHANGELOG.md").decode('utf-8')
          readmes = git('show', f"{refs['r02']}:CHANGELOG.md").decode('utf-8')
          assert main.startswith(header) and readmes.startswith(header)
          assert main.endswith(past) and readmes.endswith(past)
          (root/'CHANGELOG.md').write_text(header + plan['changelog_entry'] +
              readmes[len(header):-len(past)] + main[len(header):-len(past)] + past, encoding='utf-8')
          (root/'MANUAL_TECNICO.md').write_bytes((root/'ambiente_fonte/.assistant/MANUAL_TECNICO.md').read_bytes())
          subprocess.run([sys.executable, 'tools/render_simulado.py', '--write'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          actual = git('write-tree').decode().strip()
          assert actual == plan['expected_tree'], (actual, plan['expected_tree'])
          print('TREE_MATCH', actual)
          PY
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Validar oito etapas e preservacao das duas iniciativas
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-dev.txt
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/r02i-gate.txt"
          python docs/sprints/readmes_objetos/evidencias_integracao_r02/verificar_preservacao.py 2>&1 | tee "$RUNNER_TEMP/r02i-preservacao.json"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - name: Armazenar arvore conferida sem atualizar branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert git('write-tree').decode().strip() == os.environ['EXPECTED_TREE']
          changes = git('diff', '--cached', '--name-status', '-z', os.environ['MAIN_COMMIT']).decode().split('\0')
          entries = []
          i = 0
          while i < len(changes) and changes[i]:
              status, path = changes[i:i+2]
              i += 2
              if status not in ('A', 'M'):
                  raise SystemExit('Alteracao fora do escopo: ' + status)
              mode = git('ls-files', '--stage', '--', path).decode().split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob',
                  'content': Path(path).read_bytes().decode('utf-8')})
          assert len(entries) == 135, len(entries)
          request = urllib.request.Request(
              os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/trees',
              data=json.dumps({'base_tree': os.environ['MAIN_TREE'], 'tree': entries}).encode('utf-8'),
              method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=90) as response:
              tree = json.load(response)['sha']
          assert tree == os.environ['EXPECTED_TREE'], tree
          report = {'tree': tree, 'main_base': os.environ['MAIN_COMMIT'],
              'readmes_base': os.environ['R02_COMMIT'], 'paths_vs_main': len(entries),
              'gate': '8_PASS', 'preservacao': 'PASS', 'run_id': os.environ['GITHUB_RUN_ID'],
              'refs_atualizadas_pelo_workflow': False, 'merge_realizado': False,
              'databricks_publicado': False}
          Path(os.environ['RUNNER_TEMP'], 'R02I-integracao.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False))
          PY
      - name: Guardar evidencias mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02i-evidencias-integracao
          retention-days: 7
          path: |
            ${{ runner.temp }}/r02i-gate.txt
            ${{ runner.temp }}/r02i-preservacao.json
            ${{ runner.temp }}/R02I-integracao.json
          if-no-files-found: warn
