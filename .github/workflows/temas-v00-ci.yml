name: Regressões da instrumentação V00
on:
  pull_request:
  push:
    branches: [main, codex/temas-v00]
permissions:
  contents: read
jobs:
  testar-v00:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Instalar dependências declaradas
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Gate da branch isolada sem depender da integração com main
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/temas-v00'
        run: python -B tools/ci_local.py --verbose
      - name: Guardas do inventário
        run: python -B tools/tests/test_inventario_visual.py
      - name: Contratos legados sintéticos
        run: python -B tools/tests/test_visual_legado_v00.py
      - name: Confiabilidade do relatório
        run: python -B tools/tests/test_baseline_visual_runner.py
