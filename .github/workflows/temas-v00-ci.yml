name: Regressões da instrumentação V00
# Receita manual de compatibilidade. Execução automática: ci.yml (DAG compartilhado).
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  testar-v00:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-dev.txt
            tools/requirements-temas-dev.txt
      - name: Instalar dependências declaradas
        run: python -m pip install -r tools/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar compositor para gate completo
        run: |
          npm install --global pnpm@10.34.5
          pnpm --dir tools/readme_visuals install --frozen-lockfile
      - name: Preparar derivado local do SHA
        run: |
          python -B tools/validate_assistant.py --conferir-readme
          python -B tools/render_simulado.py --write
          python -B tools/render_simulado.py --check
      - name: Gate local completo da receita manual
        run: python -B tools/ci_local.py --verbose
      - name: Guardas do inventário
        run: python -B tools/tests/test_inventario_visual.py
      - name: Contratos legados sintéticos
        run: python -B tools/tests/test_visual_legado_v00.py
      - name: Confiabilidade do relatório
        run: python -B tools/tests/test_baseline_visual_runner.py
