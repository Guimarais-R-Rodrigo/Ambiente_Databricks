name: Reconciliacao autorizada V00 (temporario)
on:
  push:
    branches: [codex/temas-v00]
    paths:
      - .github/workflows/temas-v00-integrar-temporario.yml
      - .github/temas_v00_integrar.py
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: temas-v00-reconciliacao
  cancel-in-progress: false
jobs:
  reconciliar:
    if: github.ref == 'refs/heads/codex/temas-v00'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      BASE_MAIN: 5493f7db68f397ad7040485cb09bad53eb79be74
      BASE_V00: 3f65e9414bc1e7bd52493b267ae4fe1cbd0f783d
      BASE_COMUM: 8744157fe9c3e0603f689fb2bcad52445e96cb41
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias declaradas
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Reconciliar, documentar e validar antes de qualquer push
        shell: bash
        run: |
          set -o pipefail
          python -B .github/temas_v00_integrar.py 2>&1 | tee "$RUNNER_TEMP/v00-console.log"
      - name: Preservar logs inclusive em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integracao-v00-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v00-integracao/
            ${{ runner.temp }}/v00-console.log
          if-no-files-found: error
      - name: Atualizar somente a branch candidata por fast-forward
        if: success() && env.INTEGRACAO_PRONTA == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          actual_main=$(git ls-remote origin refs/heads/main | cut -f1)
          actual_head=$(git ls-remote origin refs/heads/codex/temas-v00 | cut -f1)
          test "$actual_main" = "$BASE_MAIN"
          test "$actual_head" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/temas-v00
      - name: Registrar diagnostico da rodada no PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'v00-console.log'
          log = p.read_text(encoding='utf-8')[-16000:] if p.exists() else 'Executor nao iniciou; consultar etapas do run.'
          body = '### Reconciliacao V00 — run ' + os.environ['GITHUB_RUN_ID'] + '\n\nEstado do job: **' + os.environ['JOB_STATUS'] + '**. Este registro automatico nao e uma aprovacao independente nem merge da main.\n\n```text\n' + log.replace('```', "'''") + '\n```'
          req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/issues/8/comments', data=json.dumps({'body': body}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)
              print('Diagnostico registrado no comentario', result['id'])
          PY
