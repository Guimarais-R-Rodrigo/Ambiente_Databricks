name: Preparar changelog V02
on:
  push:
    branches:
      - codex/v02-changelog-prep-20260912
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Inserir registro canônico V02
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## 2026-09-12 — V02: alinhamento documental da candidata remota (Codex)'
          if marker not in text:
              anchor = '## 2026-09-12 — V02: conciliação com R03-A/R03-B integrada (Codex)'
              if anchor not in text:
                  raise SystemExit('âncora V02 não encontrada')
              entry = '''## 2026-09-12 — V02: alinhamento documental da candidata remota (Codex)

### Corrigido

- (Codex) Índices e checkpoint passaram a apresentar a V02 como etapa corrente no
  PR #14, preservando o guia de primeiro uso da V01 como referência histórica e
  mantendo separadas validação funcional, aceite, integração e publicação.
- (Codex) Saída reproduzível do README raiz sincronizada após os novos links
  documentais; o validador continua fail-closed e nenhuma guarda foi relaxada.

### Notas

- (Codex) Correção exclusivamente documental sobre o núcleo funcional já testado;
  sem mudança em API, schema, fixtures, assets, aparência ou consumidores legados.
- (Codex) Sem merge da V02, publicação Databricks, homologação de Spark/widgets/
  Apps/AI-BI ou início da V03. Auditoria independente e teste com iniciante seguem
  pendentes.

'''
              path.write_text(text.replace(anchor, entry + anchor, 1), encoding='utf-8')
          PY
      - name: Commitar somente o changelog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: registrar alinhamento documental V02 no changelog"
          git push origin HEAD:codex/v02-changelog-prep-20260912
