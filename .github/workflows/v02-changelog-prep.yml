name: Preparar changelog V02
on:
  push:
    branches:
      - codex/v02-changelog-prep-20260912
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENTRY_B64: 
      ANCHOR: '## 2026-09-12 — V02: conciliação com R03-A/R03-B integrada (Codex)'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Inserir registro canônico V02
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64,os; from pathlib import Path; p=Path('CHANGELOG.md'); t=p.read_text(encoding='utf-8'); m='## 2026-09-12 — V02: alinhamento documental da candidata remota (Codex)'; e=base64.b64decode(os.environ['ENTRY_B64']).decode('utf-8'); a=os.environ['ANCHOR']; (_ for _ in ()).throw(SystemExit('âncora V02 não encontrada')) if (m not in t and a not in t) else None; p.write_text(t if m in t else t.replace(a,e+a,1),encoding='utf-8')"
      - name: Commitar somente o changelog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: registrar alinhamento documental V02 no changelog"
          git push origin HEAD:codex/v02-changelog-prep-20260912
