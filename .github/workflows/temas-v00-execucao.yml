name: V00 — diagnóstico temporário sem Databricks
on:
  push:
    branches: [codex/temas-v00]
    paths:
      - .github/workflows/temas-v00-execucao.yml
      - .github/v00_patch_r2.py
permissions:
  contents: write
concurrency:
  group: temas-v00-diagnostico
  cancel-in-progress: false
jobs:
  diagnosticar:
    if: github.ref == 'refs/heads/codex/temas-v00'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/temas-v00
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: tools/readme_visuals/.node-version
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Dependências locais de testes
        run: |
          python -m pip install -r tools/requirements-dev.txt
          pnpm --dir tools/readme_visuals install --frozen-lockfile
      - name: Corrigir instrumentação e reconciliar contagens observadas
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'Codex'
          git config user.email 'codex@example.invalid'
          python -B .github/v00_patch_r2.py
          git add README.md CHANGELOG.md tools/executar_baseline_visual.py tools/tests/test_baseline_visual_runner.py docs/sprints/sistema_temas
          git commit -m 'fix: contagens verificadas e diagnóstico V00 mais preciso (Codex)'
          git worktree add --detach "$RUNNER_TEMP/baseline-temas-v00" 8744157fe9c3e0603f689fb2bcad52445e96cb41
      - name: Executar base e candidata com famílias visuais separadas
        id: diagnostico
        continue-on-error: true
        run: python -B tools/executar_baseline_visual.py --base-root "$RUNNER_TEMP/baseline-temas-v00" --output .artifacts/temas-v00
      - name: Registrar somente resultados produzidos e conferir README local
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,subprocess,sys,re
          src=Path('.artifacts/temas-v00'); dst=Path('docs/testes/sistema_temas/V00')
          for name in ['RESUMO.json','RELATORIO_TECNICO.md','MATRIZ_AUTOMATICA.md','manifesto_protecao.json']:
              p=src/name
              if p.exists(): shutil.copyfile(p,dst/name)
          if not (src/'RESUMO.json').exists():
              (dst/'RELATORIO_TECNICO.md').write_text('# Resultado técnico V00\n\nBLOQUEADO: segunda rodada sem resumo final. Os resultados anteriores não são uma aprovação desta revisão. Conferir workflow.\n',encoding='utf-8')
          subprocess.run(['git','add','docs/testes/sistema_temas/V00'],check=True)
          proc=subprocess.run([sys.executable,'-B','tools/validate_assistant.py'],capture_output=True,text=True,check=True)
          p=Path('README.md');s=p.read_text(encoding='utf-8')
          for name in ('identidade','links'):
              pattern=r'^repo \('+name+r'\)\s*:.*$'
              rows=re.findall(pattern,proc.stdout,re.MULTILINE)
              assert len(rows)==1 and len(re.findall(pattern,s,re.MULTILINE))==1
              s=re.sub(pattern,lambda _:rows[0],s,count=1,flags=re.MULTILINE)
          p.write_text(s,encoding='utf-8')
          PY
          git add README.md docs/testes/sistema_temas/V00
          if ! git diff --cached --quiet; then git commit -m 'test: segunda rodada V00 com evidências e falha histórica separada (Codex)'; fi
      - name: Gate atual na candidata registrada
        id: final_gate
        continue-on-error: true
        run: |
          mkdir -p .artifacts/temas-v00
          set -o pipefail
          python -B tools/ci_local.py --verbose 2>&1 | tee .artifacts/temas-v00/ci_final.log
      - name: Avançar somente branch isolada sem force
        if: always()
        run: |
          test "$(git ls-remote origin refs/heads/codex/temas-v00 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/temas-v00
      - name: Guardar evidências sem fontes gráficas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temas-v00-${{ github.run_id }}
          path: .artifacts/temas-v00/
          include-hidden-files: true
          retention-days: 14
      - name: Falha global continua falha
        if: always()
        env:
          DIAGNOSTICO: ${{ steps.diagnostico.outcome }}
          FINAL_GATE: ${{ steps.final_gate.outcome }}
        run: test "$DIAGNOSTICO" = success && test "$FINAL_GATE" = success
