name: Freeze R08 v4
on:
  push:
    branches:
      - codex/readmes-r08-build
    paths:
      - .github/workflows/readmes-r08-freeze-v4.yml
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: b73bbb91961f9ba5f9031d648c42ec0891b63347
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/requirements-dev.txt
            tools/requirements-temas-dev.txt
      - name: Preparar candidata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          python docs/sprints/readmes_objetos/evidencias_r08/aplicar_r08_v2.py
          cp ambiente_fonte/.assistant/MANUAL_TECNICO.md MANUAL_TECNICO.md
          python tools/render_simulado.py --write
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/sprints/readmes_objetos/evidencias_r08/aplicar_r08.py')
          s=p.read_text(encoding='utf-8')
          old='''    exemptions = data["exemptions"]
    removed = []
    for obj in OBJECTS:
        key = f"hub_snippets/ml/{obj}"
        assert key in exemptions, key
        meta = exemptions[key]
        assert meta["status"] == "pending" and meta["sprint"] == "R08" and meta["lote"] == "A", (key, meta)
        removed.append(key)
        del exemptions[key]
'''
          new='''    pending = data["pending"]
    removed = []
    for obj in OBJECTS:
        key = f"hub_snippets/ml/{obj}"
        assert key in pending, key
        meta = pending[key]
        assert meta["sprint"] == "R08" and meta["lote"] == "A", (key, meta)
        removed.append(key)
        del pending[key]
'''
          assert s.count(old)==1
          s=s.replace(old,new,1).replace('dispensas R08','pendências R08').replace('seis dispensas','seis pendências').replace('dispensas removidas','pendências removidas')
          p.write_text(s,encoding='utf-8')
          for name in ['CHANGELOG.md','docs/sprints/readmes_objetos/RELATORIO_R08.md','docs/sprints/readmes_objetos/MATRIZ_ALTERACOES_R08.md','docs/sprints/readmes_objetos/ACHADOS_R08.md']:
              q=Path(name)
              text=q.read_text(encoding='utf-8').replace('dispensas R08','pendências R08').replace('seis dispensas','seis pendências').replace('dispensas removidas','pendências removidas')
              q.write_text('\n'.join(line.rstrip() for line in text.splitlines())+'\n',encoding='utf-8')
          PY
          git rm .github/workflows/readmes-r08-freeze.yml
          git rm .github/workflows/readmes-r08-freeze-v2.yml
          git rm .github/workflows/readmes-r08-freeze-v3.yml
          git rm .github/workflows/readmes-r08-freeze-v4.yml
          git rm docs/sprints/readmes_objetos/evidencias_r08/aplicar_r08_v2.py
          git rm docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py
          git mv docs/sprints/readmes_objetos/evidencias_r08/verificar_r08_v2.py docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py
          git rm docs/sprints/readmes_objetos/evidencias_r08/verificar_preservacao.py
          git rm docs/sprints/readmes_objetos/evidencias_r08/verificar_preservacao_v2.py
          git mv docs/sprints/readmes_objetos/evidencias_r08/verificar_preservacao_v3.py docs/sprints/readmes_objetos/evidencias_r08/verificar_preservacao.py
          git add -A
          git diff --cached --check "$BASE"
          python tools/validate_assistant.py > "$RUNNER_TEMP/derived.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'],'derived.txt').read_text()
          keys=['skills','prompts','helpers citados','markdown / links','notebooks / links','readmes de objeto','pastas de objeto','forma da pasta','contrato de dados','contrato de entrada','saída colada','idioma da docstring','normas do molde','notebook exercita','python (AST)','instrucoes','repo (identidade)','repo (links)']
          actual={}
          for line in out.splitlines():
              for key in keys:
                  if line.startswith(key): actual[key]=line
          assert set(actual)==set(keys)
          assert '55/75 operacionais' in actual['readmes de objeto']
          assert '20 pendentes' in actual['readmes de objeto']
          p=Path('README.md')
          lines=p.read_text(encoding='utf-8').splitlines()
          found=set()
          for i,line in enumerate(lines):
              for key,value in actual.items():
                  if line.startswith(key):
                      lines[i]=value
                      found.add(key)
                      break
          assert found==set(keys)
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git add README.md
          python tools/validate_assistant.py --conferir-readme | tee "$RUNNER_TEMP/validator-pre.txt"
          grep -q 'APROVADO: 0 falha(s), 0 aviso(s)' "$RUNNER_TEMP/validator-pre.txt"
          git write-tree > "$RUNNER_TEMP/tree-pre.txt"
      - name: Gate e preservação
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-dev.txt -r tools/requirements-temas-dev.txt >/dev/null
          python docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py --group static | tee "$RUNNER_TEMP/static.txt"
          python tools/ci_local.py --verbose | tee "$RUNNER_TEMP/gate.txt"
          for suite in test_inventario_visual test_visual_legado_v00 test_baseline_visual_runner test_temas_v01 test_temas_v01_integracao test_temas_v02 test_temas_v03 test_temas_v04; do
            python "tools/tests/$suite.py"
          done
          python docs/sprints/readmes_objetos/evidencias_r08/verificar_preservacao.py --base "$BASE" | tee "$RUNNER_TEMP/preservacao.txt"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tree-pre.txt")"
      - name: Runtime core
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/core"
          P="$RUNNER_TEMP/core/bin/python"
          "$P" -m pip install --upgrade pip >/dev/null
          "$P" -m pip install 'numpy<2' pandas scikit-learn mlflow tabulate scipy >/dev/null
          "$P" -m pip freeze > "$RUNNER_TEMP/core-pacotes.txt"
          "$P" docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py --group core | tee "$RUNNER_TEMP/core.txt"
      - name: Runtime PyTorch
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/torch"
          P="$RUNNER_TEMP/torch/bin/python"
          "$P" -m pip install --upgrade pip >/dev/null
          "$P" -m pip install 'numpy<2' >/dev/null
          "$P" -m pip install torch --index-url https://download.pytorch.org/whl/cpu >/dev/null
          "$P" -m pip freeze > "$RUNNER_TEMP/torch-pacotes.txt"
          "$P" docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py --group torch | tee "$RUNNER_TEMP/torch.txt"
      - name: Runtime SHAP
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/shap"
          P="$RUNNER_TEMP/shap/bin/python"
          "$P" -m pip install --upgrade pip >/dev/null
          "$P" -m pip install 'numpy==1.26.4' 'scikit-learn==1.4.2' 'shap==0.44.1' pandas matplotlib >/dev/null
          "$P" -m pip freeze > "$RUNNER_TEMP/shap-pacotes.txt"
          "$P" docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py --group shap | tee "$RUNNER_TEMP/shap.txt"
      - name: Runtime UMAP
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/umap"
          P="$RUNNER_TEMP/umap/bin/python"
          "$P" -m pip install --upgrade pip >/dev/null
          "$P" -m pip install 'numpy==1.26.4' 'umap-learn==0.5.5' pandas plotly >/dev/null
          "$P" -m pip freeze > "$RUNNER_TEMP/umap-pacotes.txt"
          "$P" docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py --group umap | tee "$RUNNER_TEMP/umap.txt"
      - name: Fechar evidências
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          counts={}
          for name in ['static.txt','core.txt','torch.txt','shap.txt','umap.txt']:
              text=Path(os.environ['RUNNER_TEMP'],name).read_text()
              match=re.search(r'Ran (\d+) tests',text)
              assert match,name
              assert 'FAILED' not in text
              counts[name]=int(match.group(1))
          total=sum(counts.values())
          report=Path('docs/sprints/readmes_objetos/RELATORIO_R08.md')
          text=report.read_text(encoding='utf-8')
          text=text.replace('STATUS_R08: CANDIDATA — aguarda fechamento automatizado e revisão/aceite humano antes de qualquer merge.', f'STATUS_R08: PASS técnico — {total}/{total} casos aprovados no run {os.environ["GITHUB_RUN_ID"]}; aguarda aceite editorial humano.')
          report.write_text(text,encoding='utf-8')
          rubric=Path('docs/sprints/readmes_objetos/RUBRICA_R08.json')
          data=json.loads(rubric.read_text(encoding='utf-8'))
          data['run_id']=int(os.environ['GITHUB_RUN_ID'])
          data['runtime_case_counts']=counts
          data['runtime_total_cases']=total
          for key in data['criteria']:
              data['criteria'][key]='passed_self_review'
          rubric.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add -A
          git diff --cached --check "$BASE"
          python tools/ci_local.py --verbose > "$RUNNER_TEMP/gate-final.txt"
          python tools/validate_assistant.py --conferir-readme > "$RUNNER_TEMP/validator-final.txt"
          grep -q 'APROVADO: 0 falha(s), 0 aviso(s)' "$RUNNER_TEMP/validator-final.txt"
          python docs/sprints/readmes_objetos/evidencias_r08/verificar_preservacao.py --base "$BASE" > "$RUNNER_TEMP/preservacao-final.txt"
      - name: Materializar candidata final
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          git config user.name "ChatGPT R08 runner"
          git config user.email "runner@users.noreply.github.com"
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          root=Path.cwd()
          def git(*args):
              return subprocess.check_output(['git',*args],cwd=root,text=True).strip()
          tree=git('write-tree')
          commit=subprocess.check_output(
              ['git','commit-tree',tree,'-p',os.environ['BASE']],
              cwd=root,
              input='R08 — READMEs de clusters, anomalias e explicabilidade validados (ChatGPT)\n',
              text=True,
          ).strip()
          subprocess.check_call(['git','push','origin',f'{commit}:refs/heads/codex/readmes-r08-final'],cwd=root)
          counts={}
          for name in ['static.txt','core.txt','torch.txt','shap.txt','umap.txt']:
              text=Path(os.environ['RUNNER_TEMP'],name).read_text()
              counts[name]=int(re.search(r'Ran (\d+) tests',text).group(1))
          result={'base':os.environ['BASE'],'tree':tree,'commit':commit,'coverage':'55/75','pending':20,'tests':sum(counts.values()),'run_id':int(os.environ['GITHUB_RUN_ID']),'databricks_published':False,'independent_audit':False}
          Path(os.environ['RUNNER_TEMP'],'R08-FINAL.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r08-freeze-v4-evidencias
          retention-days: 7
          path: |
            ${{ runner.temp }}/validator-pre.txt
            ${{ runner.temp }}/validator-final.txt
            ${{ runner.temp }}/gate.txt
            ${{ runner.temp }}/gate-final.txt
            ${{ runner.temp }}/preservacao.txt
            ${{ runner.temp }}/preservacao-final.txt
            ${{ runner.temp }}/static.txt
            ${{ runner.temp }}/core.txt
            ${{ runner.temp }}/torch.txt
            ${{ runner.temp }}/shap.txt
            ${{ runner.temp }}/umap.txt
            ${{ runner.temp }}/*-pacotes.txt
            ${{ runner.temp }}/R08-FINAL.json
          if-no-files-found: warn
