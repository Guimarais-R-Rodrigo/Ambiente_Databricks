name: Componentes HTML e tabelas V04
on:
  push:
    branches: [main, 'codex/temas-v04*']
  pull_request:
    paths:
      - 'ambiente_fonte/.assistant/hub_snippets/constants/styles/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/badge/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/divider/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/kpi_card/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/section_header/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/index_generator/**'
      - 'ambiente_fonte/.assistant/hub_snippets/display/dataframe_styled/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/tema/**'
      - 'ambiente_fonte/.assistant/hub_padroes/identidade_visual/**'
      - 'tools/tests/test_temas_v04.py'
      - 'tools/ci_local.py'
      - 'docs/sprints/sistema_temas/V04/**'
      - '.github/workflows/temas-v04-ci.yml'
permissions:
  contents: read
jobs:
  html-v04:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências declaradas
        run: python -m pip install -r tools/requirements-dev.txt
      - name: V04 específica
        run: python -B tools/tests/test_temas_v04.py -v
      - name: Regressões de temas V01–V04
        run: python -B -m unittest discover -s tools/tests -p 'test_temas*.py' -v
      - name: Compatibilidade visual V00
        run: python -B tools/tests/test_visual_legado_v00.py
      - name: Validação estrutural e documental
        run: python -B tools/validate_assistant.py --conferir-readme
      - name: Escopo
        run: echo 'V04 valida componentes HTML/tabela offline; não publica nem homologa Databricks, acessibilidade ou UX visual.'
