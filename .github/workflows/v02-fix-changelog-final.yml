name: Corrigir changelog final V02
on:
  push:
    branches:
      - codex/v02-pos-merge-docs-final-20260912
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Restaurar identificadores de integração
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('CHANGELOG.md'); t=p.read_text(encoding='utf-8'); a='PR #14 integrado na  no commit ;'; b='PR #14 integrado na main no commit d4cabdca4ac68c0a2edbd7f9f621f68962c8f6b8;'; c='passaram novamente após o merge na .'; d='passaram novamente após o merge na main.'; assert t.count(a)==1 and t.count(c)==1; p.write_text(t.replace(a,b).replace(c,d),encoding='utf-8')"
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: restaurar identificadores do merge V02 no changelog"
          git push origin HEAD:codex/v02-pos-merge-docs-final-20260912
