name: SE02 Rematerialize Docs

on:
  push:
    branches:
      - sef/SE02-preflight

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sef/SE02-preflight
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Renderizar canonicamente
        run: python tools/render_simulado.py --write

      - name: Restringir diff ao derivado documental esperado
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys

          expected = {
              "Novo_Ambiente_Simulado/Users/usuario-free/.assistant/MANUAL_TECNICO.md",
              "Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_scripts/README.md",
              "Novo_Ambiente_Simulado/Users/usuario-free/.assistant/skills/README.md",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != expected:
              print("expected=", sorted(expected))
              print("changed=", sorted(changed))
              sys.exit(1)
          print("diff documental derivado conferido")
          PY

      - name: Commitar derivado e remover workflow transitório
        shell: bash
        run: |
          git config user.name "SE02 Renderer"
          git config user.email "actions@users.noreply.github.com"
          git add Novo_Ambiente_Simulado/Users/usuario-free/.assistant/MANUAL_TECNICO.md
          git add Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_scripts/README.md
          git add Novo_Ambiente_Simulado/Users/usuario-free/.assistant/skills/README.md
          git rm .github/workflows/se02-rematerialize-docs.yml
          git commit -m "chore(SE02): rematerializar documentação do simulado"
          git push origin HEAD:sef/SE02-preflight
