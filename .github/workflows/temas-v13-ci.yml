name: Contrato operacional V13

# Receita manual de compatibilidade. Execução automática: ci.yml (DAG compartilhado).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrato-operacional-v13:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SOURCE_DATE_EPOCH: '1700000000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependências Python
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python -m pip install 'ipywidgets>=8,<9'
          python -m pip install -r ambiente_fonte/.assistant/hub_padroes/identidade_visual/databricks_app/requirements.txt

      - name: Dependências do compositor visual
        run: |
          npm install --global pnpm@10.34.5
          pnpm --dir tools/readme_visuals install --frozen-lockfile

      - name: Preparar derivado local do SHA
        run: |
          python -B tools/validate_assistant.py --conferir-readme
          python -B tools/render_simulado.py --write
          python -B tools/render_simulado.py --check
      - name: V13 S1 — contrato e mutantes negativos
        run: python -B tools/tests/test_temas_v13_s1.py -v

      - name: V13 S1 — validador operacional read-only
        run: python -B tools/temas_v13_operacional.py

      - name: V13 S2 — preflight e mutantes negativos
        run: python -B tools/tests/test_temas_v13_s2.py -v

      - name: V13 S3 — release, staging e rollback dry-run
        run: python -B tools/tests/test_temas_v13_s3.py -v

      - name: V13 S4 — observabilidade, diagnóstico e sanitização
        run: python -B tools/tests/test_temas_v13_s4.py -v

      - name: V13 S5 — compatibilidade e acessibilidade operacional
        run: python -B tools/tests/test_temas_v13_s5.py -v

      - name: V13 S6 — ensaios operacionais locais/simulados
        run: python -B tools/tests/test_temas_v13_s6.py -v

      - name: V13 S7 — handoff operacional e gate humano
        run: python -B tools/tests/test_temas_v13_s7.py -v

      - name: Regressões de temas V01–V13
        run: python -B -m unittest discover -s tools/tests -p 'test_temas*.py' -v

      - name: Compatibilidade visual V00
        run: python -B tools/tests/test_visual_legado_v00.py

      - name: Validação estrutural e documental
        run: python -B tools/validate_assistant.py --conferir-readme

      - name: Fronteira S1 preservada
        shell: bash
        run: |
          set -euo pipefail
          echo "V13_S1_REMOTE_MUTATION=0"

      - name: Fronteira S2 preservada
        shell: bash
        run: |
          set -euo pipefail
          echo "V13_S2_NETWORK=0"
          echo "V13_S2_REMOTE_MUTATION=0"

      - name: Fronteira S3 preservada
        shell: bash
        run: |
          set -euo pipefail
          echo "V13_S3_NETWORK=0"
          echo "V13_S3_REMOTE_MUTATION=0"
          echo "V13_S3_LOCAL_DRY_RUN_ONLY=1"
          # Historical S3 checkpoint assertion: V13_S4_NOT_STARTED=1

      - name: Fronteira S4 preservada
        shell: bash
        run: |
          set -euo pipefail
          echo "V13_S4_NETWORK=0"
          echo "V13_S4_REMOTE_MUTATION=0"
          echo "V13_S4_DIAGNOSIS_READ_ONLY=1"
          # Historical S4 checkpoint assertion: V13_S5_NOT_STARTED=1

      - name: Fronteira S5 preservada
        shell: bash
        run: |
          set -euo pipefail
          echo "V13_S5_NETWORK=0"
          echo "V13_S5_REMOTE_MUTATION=0"
          echo "V13_S5_CONTRAST_PREFLIGHT_LOCAL=1"
          # Historical S5 checkpoint assertion: V13_S6_NOT_STARTED=1

      - name: Fronteira S6 preservada
        shell: bash
        run: |
          set -euo pipefail
          echo "V13_S6_NETWORK=0"
          echo "V13_S6_REMOTE_MUTATION=0"
          echo "V13_S6_IMPLICIT_PUBLICATION=0"
          echo "V13_S6_LOCAL_OR_SIMULATED_REHEARSALS=5"
          echo "V13_S6_REAL_ENVIRONMENT_CASES_BLOCKED=3"
          # Historical S6 checkpoint assertion: V13_S7_NOT_STARTED=1

      - name: Fronteira S7
        shell: bash
        run: |
          set -euo pipefail
          echo "V13_S7_NETWORK=0"
          echo "V13_S7_REMOTE_MUTATION=0"
          echo "V13_S7_DATABRICKS_MUTATION=0"
          echo "V13_S7_HUMAN_VALIDATION=PASS"
          echo "V13_S7_HUMAN_EVIDENCE=VERSIONED_HUMAN_SESSION"
          echo "V13_V14_NOT_STARTED=1"
