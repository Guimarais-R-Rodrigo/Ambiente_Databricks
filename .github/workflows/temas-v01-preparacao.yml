name: V01 preparacao temporaria
on:
  push:
    branches: [codex/temas-v01]
    paths: [.github/workflows/temas-v01-preparacao.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b88a9ccdde6e61892bc25eb7cf4f4b2577badb23
          fetch-depth: 1
          persist-credentials: false
      - name: Exportar checkout raso sem credenciais
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b88a9ccdde6e61892bc25eb7cf4f4b2577badb23
          test -z "$(git status --porcelain)"
          test ! -d Ambiente_Antigo
          if git config --local --get-regexp 'http.*extraheader|credential' ; then exit 1; fi
          mkdir -p "$RUNNER_TEMP/v01-base"
          git rev-parse HEAD > "$RUNNER_TEMP/v01-base/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/v01-base/tree.txt"
          tar -czf "$RUNNER_TEMP/v01-base/checkout.tar.gz" --exclude='./.git/hooks' .
          sha256sum "$RUNNER_TEMP/v01-base/checkout.tar.gz" > "$RUNNER_TEMP/v01-base/sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: v01-base-${{ github.run_id }}
          path: ${{ runner.temp }}/v01-base/
          retention-days: 7
