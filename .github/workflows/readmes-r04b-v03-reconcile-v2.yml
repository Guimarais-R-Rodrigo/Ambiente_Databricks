name: Reconciliacao R04-B V03 v2
on:
  push:
    branches: [codex/readmes-r04b-v03-reconcile-v2]
    paths: [.github/workflows/readmes-r04b-v03-reconcile-v2.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      SPARK_LOCAL_IP: '127.0.0.1'
      OLD_BASE: a8f314a31106aceb52db2661544146cc2bddcc99
      MAIN_COMMIT: b83a7cde84d7a44fc8a1fed996fda4f8b5b1eec2
      R04B_COMMIT: a0373e23794a67fdbff97e31711d75a83326184f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compor documentação R04-B sobre V03
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$MAIN_COMMIT"
          echo "MAIN_TREE=$(git show -s --format=%T "$MAIN_COMMIT")" >> "$GITHUB_ENV"
          git read-tree --reset -u "$MAIN_COMMIT"
          python - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          OLD=os.environ['OLD_BASE']; MAIN=os.environ['MAIN_COMMIT']; R04B=os.environ['R04B_COMMIT']; root=Path('.')
          def show(ref,p): return subprocess.check_output(['git','show',f'{ref}:{p}']).decode()
          def paths(a,b): return subprocess.check_output(['git','diff','--name-only','--no-renames',a,b],text=True).splitlines()
          rp=paths(OLD,R04B); vp=set(paths(OLD,MAIN)); assert len(rp)==42
          shared=set(rp)&vp
          exp={'CHANGELOG.md','CLAUDE.md','MANUAL_TECNICO.md','README.md','ambiente_fonte/.assistant/MANUAL_TECNICO.md','docs/sprints/README.md','Novo_Ambiente_Simulado/Users/usuario-free/.assistant/MANUAL_TECNICO.md'}
          assert shared==exp,(shared,exp)
          skip=exp-{'Novo_Ambiente_Simulado/Users/usuario-free/.assistant/MANUAL_TECNICO.md'}
          for p in rp:
              if p.startswith('Novo_Ambiente_Simulado/') or p in skip: continue
              subprocess.run(['git','checkout',R04B,'--',p],check=True)
          cur=show(MAIN,'CHANGELOG.md'); old=show(R04B,'CHANGELOG.md')
          entry=re.search(r'(?ms)^## 2026-09-12 — R04-B:.*?(?=^## 2026-)',old).group(0)
          assert '## 2026-09-12 — R04-B: READMEs dos seis Hub Scripts' not in cur
          pos=cur.index('## 2026-'); (root/'CHANGELOG.md').write_text(cur[:pos]+entry+cur[pos:])
          for p,h in [('CLAUDE.md','### Estado da migração de READMEs — R04-B'),('docs/sprints/README.md','### READMEs de objeto — R04-B')]:
              cur=show(MAIN,p); old=show(R04B,p); assert h not in cur and h in old
              (root/p).write_text(cur.rstrip()+'\n\n'+old[old.index(h):].strip()+'\n')
          p='ambiente_fonte/.assistant/MANUAL_TECNICO.md'; cur=show(MAIN,p); old=show(R04B,p)
          block=re.search(r'(?ms)^### Guias locais R04-B — scripts operacionais\n.*?(?=^## 30\.)',old).group(0)
          a=re.search(r'(?m)^## 30\.',cur); assert a and '### Guias locais R04-B — scripts operacionais' not in cur
          (root/p).write_text(cur[:a.start()]+block+cur[a.start():])
          cur=show(MAIN,'README.md'); old=show(R04B,'README.md'); h='### Continuidade R04-B'; assert h not in cur and h in old
          (root/'README.md').write_text(cur.rstrip()+'\n\n'+old[old.index(h):].strip()+'\n')
          rid=os.environ['GITHUB_RUN_ID']
          recon=f'''# Conciliação R04-B × V03\n\n**Data:** 2026-09-12\n**Base comum:** `{OLD}`\n**Main V03:** `{MAIN}`\n**R04-B validada:** `{R04B}`\n**Workflow desta conferência:** `{rid}`\n\nA V03 avançou em paralelo depois do freeze da R04-B. A composição preserva os arquivos exclusivos de cada frente byte a byte; documentos compartilhados são reconciliados semanticamente e o simulado é regenerado pelo renderer. Nenhuma implementação dos seis Hub Scripts é alterada. A árvore só é materializada se gate vigente, V00/V01/V02/V03, preservação e 14/14 casos R04-B com Spark real passarem.\n\n## Documentos compartilhados reconciliados\n\n- `CHANGELOG.md`: histórico V03 preservado e entrada R04-B acrescentada.\n- `CLAUDE.md` e `docs/sprints/README.md`: V03 preservada e checkpoint R04-B acrescentado.\n- `README.md`: continuidade V03 preservada, continuidade R04-B acrescentada e contagens recalculadas.\n- `ambiente_fonte/.assistant/MANUAL_TECNICO.md`: conteúdo V03 preservado e seção R04-B inserida; raiz e simulado são derivados.\n\nSem publicação Databricks, auditoria independente ou início da R05 nesta conciliação.\n'''
          (root/'docs/sprints/readmes_objetos/CONCILIACAO_R04B_V03.md').write_text(recon)
          p=root/'docs/sprints/readmes_objetos/README.md'; s=p.read_text(); assert '### Conciliação R04-B × V03' not in s
          p.write_text(s.rstrip()+'\n\n### Conciliação R04-B × V03\n\nA R04-B foi recomposta sobre a V03 já presente na `main`. Consulte [CONCILIACAO_R04B_V03.md](CONCILIACAO_R04B_V03.md). A cobertura permanece 32/75; a próxima parada continua sendo o merge da R04-B antes da R05.\n')
          p=root/'docs/sprints/readmes_objetos/RELATORIO_R04B.md'; s=p.read_text(); assert '## Addendum de integração com V03' not in s
          p.write_text(s.rstrip()+f'\n\n## Addendum de integração com V03\n\nApós o freeze original, a `main` avançou para `{MAIN}` com a V03. O run `{rid}` recompõe a entrega sobre essa base e só materializa a árvore se todas as guardas passarem. Registro detalhado: `CONCILIACAO_R04B_V03.md`.\n')
          PY
          cp ambiente_fonte/.assistant/MANUAL_TECNICO.md MANUAL_TECNICO.md
          python tools/render_simulado.py --write
          git add -A
          python tools/validate_assistant.py > "$RUNNER_TEMP/validator.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'],'validator.txt').read_text()
          keys=['skills','prompts','helpers citados','markdown / links','notebooks / links','readmes de objeto','pastas de objeto','forma da pasta','contrato de dados','contrato de entrada','saída colada','idioma da docstring','normas do molde','notebook exercita','python (AST)','instrucoes','repo (identidade)','repo (links)']
          actual={}
          for line in out.splitlines():
              for k in keys:
                  if line.startswith(k): actual[k]=line
          assert set(actual)==set(keys)
          assert '32/75 operacionais' in actual['readmes de objeto'] and '43 pendentes' in actual['readmes de objeto']
          p=Path('README.md'); lines=p.read_text().splitlines(); seen=set()
          for i,line in enumerate(lines):
              for k,v in actual.items():
                  if line.startswith(k): lines[i]=v; seen.add(k); break
          assert seen==set(keys)
          p.write_text('\n'.join(lines)+'\n')
          PY
          git add -A
          git diff --cached --check "$MAIN_COMMIT"
          git write-tree | tee "$RUNNER_TEMP/tree.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-dev.txt
            tools/requirements-temas-dev.txt
      - name: Gate e regressões até V03
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-dev.txt -r tools/requirements-temas-dev.txt >/dev/null
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/gate.txt"
          for s in test_inventario_visual test_visual_legado_v00 test_baseline_visual_runner test_temas_v01 test_temas_v01_integracao test_temas_v02 test_temas_v03; do python "tools/tests/$s.py"; done
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tree.txt")"
          git diff --exit-code
      - name: Preservação cruzada
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          OLD=os.environ['OLD_BASE']; MAIN=os.environ['MAIN_COMMIT']; R04B=os.environ['R04B_COMMIT']; root=Path('.')
          def out(*a): return subprocess.check_output(['git',*a])
          def show(ref,p): return out('show',f'{ref}:{p}')
          def changed(a,b): return set(out('diff','--name-only','--no-renames',a,b).decode().splitlines())
          rp=changed(OLD,R04B); vp=changed(OLD,MAIN); shared=rp&vp
          exceptions=shared|{'docs/sprints/readmes_objetos/README.md','docs/sprints/readmes_objetos/RELATORIO_R04B.md'}
          for p in sorted(rp-shared):
              if p.startswith('Novo_Ambiente_Simulado/') or p=='MANUAL_TECNICO.md' or p in exceptions: continue
              assert (root/p).read_bytes()==show(R04B,p),('r04b',p)
          for p in sorted(vp-shared):
              if p.startswith('Novo_Ambiente_Simulado/') or p=='MANUAL_TECNICO.md': continue
              assert (root/p).read_bytes()==show(MAIN,p),('v03',p)
          objs=['data_quality_check','doc_coverage','drift_detector','naming_checker','rfv_calculator','schema_to_yaml']
          for obj in objs:
              base=f'ambiente_fonte/.assistant/hub_scripts/{obj}'
              for n in [f'{obj}.py','__init__.py']: assert (root/base/n).read_bytes()==show(MAIN,f'{base}/{n}')
              assert (root/base/'README.md').read_bytes()==show(R04B,f'{base}/README.md')
          ctrl=json.loads((root/'docs/sprints/readmes_objetos/CONTROLE_MIGRACAO.json').read_text()); assert len(ctrl['pending'])==43
          src=root/'ambiente_fonte'; dst=root/'Novo_Ambiente_Simulado/Users/usuario-free'; mirrored=[]
          for p in src.rglob('*'):
              if not p.is_file() or '__pycache__' in p.parts or p==src/'README.md': continue
              q=dst/p.relative_to(src); assert q.is_file() and q.read_bytes()==p.read_bytes(),str(p); mirrored.append(str(p.relative_to(src)))
          got=[str(p.relative_to(dst)) for p in dst.rglob('*') if p.is_file()]; assert set(got)==set(mirrored)
          assert (root/'MANUAL_TECNICO.md').read_bytes()==(src/'.assistant/MANUAL_TECNICO.md').read_bytes()
          print(json.dumps({'status':'PASS','shared':sorted(shared),'pending':43,'mirrored':len(mirrored)}))
          PY
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tree.txt")"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: R04-B com Spark real
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/r04b"
          "$RUNNER_TEMP/r04b/bin/python" -m pip install pyspark==4.0.1 PyYAML==6.0.2 >/dev/null
          mkdir -p "$RUNNER_TEMP/spark"
          (cd "$RUNNER_TEMP/spark" && "$RUNNER_TEMP/r04b/bin/python" "$GITHUB_WORKSPACE/docs/sprints/readmes_objetos/evidencias_r04b/verificar_r04b.py" --require-spark) 2>&1 | tee "$RUNNER_TEMP/r04b.txt"
          grep -q 'Ran 14 tests' "$RUNNER_TEMP/r04b.txt"
          ! grep -qi 'FAILED' "$RUNNER_TEMP/r04b.txt"
          ! grep -qi 'skipped=' "$RUNNER_TEMP/r04b.txt"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tree.txt")"
      - name: Materializar árvore testada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          def git(*a): return subprocess.check_output(['git',*a])
          final=Path(os.environ['RUNNER_TEMP'],'tree.txt').read_text().strip(); assert git('write-tree').decode().strip()==final
          raw=git('diff','--cached','--no-renames','--name-status','-z',os.environ['MAIN_COMMIT']).decode().split('\0'); entries=[]; i=0
          while i<len(raw) and raw[i]:
              st,p=raw[i:i+2]; i+=2; assert st in ('A','M'),(st,p)
              mode=git('ls-files','--stage','--',p).decode().split()[0]
              entries.append({'path':p,'mode':mode,'type':'blob','content':Path(p).read_text()})
          base_tree=git('show','-s','--format=%T',os.environ['MAIN_COMMIT']).decode().strip()
          req=urllib.request.Request(os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',data=json.dumps({'base_tree':base_tree,'tree':entries}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=90) as r: tree=json.load(r)['sha']
          assert tree==final,(tree,final)
          result={'tree':tree,'base':os.environ['MAIN_COMMIT'],'r04b':os.environ['R04B_COMMIT'],'paths_vs_main':len(entries),'gate':'PASS','v03':'PASS','r04b_suite':'14_PASS','preservacao':'PASS','coverage':'32/75','pending':43,'run_id':os.environ['GITHUB_RUN_ID'],'refs_updated':False}
          Path(os.environ['RUNNER_TEMP'],'R04B-V03-FINAL.json').write_text(json.dumps(result,indent=2)+'\n'); print(json.dumps(result))
          PY
      - name: Evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04b-v03-v2-evidencias
          retention-days: 7
          path: |
            ${{ runner.temp }}/validator.txt
            ${{ runner.temp }}/gate.txt
            ${{ runner.temp }}/r04b.txt
            ${{ runner.temp }}/tree.txt
            ${{ runner.temp }}/R04B-V03-FINAL.json
          if-no-files-found: warn
