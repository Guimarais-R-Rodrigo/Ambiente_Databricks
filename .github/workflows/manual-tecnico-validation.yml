name: Validacao isolada do Manual Tecnico
on:
  push:
    branches: ['chatgpt/transporte-manual-2026-09-11']
    paths: ['.github/workflows/manual-tecnico-validation.yml']
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SPARK_LOCAL_IP: '127.0.0.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5fdc61181c14124d653cf9e6222d9a402745949
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Reconstruir somente a arvore conferida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = 'c5fdc61181c14124d653cf9e6222d9a402745949'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == base
          chunks = ['325b3b4c4429da08e182d08d9be26ec90d62de99','95a201a20534b9cb21c1e63b05cf77a717e8937d','735519c2c788bddc1e7c5e60e7bbabd243f37510','a2345309530c2ab52dec98a2689aea1a07ef9f88','3b4bd5f7a84cd30519f6a95f23196f376d2be54c','1f37feaa3fe3db1c6a7c2d829593b196fed64955']
          data = []
          for sha in chunks:
              req=urllib.request.Request(f'https://api.github.com/repos/Guimarais-R-Rodrigo/Ambiente_Databricks/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as response: obj=json.load(response)
              raw=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == sha
              data.append(raw)
          payload=lzma.decompress(b''.join(data))
          assert hashlib.sha256(payload).hexdigest() == 'bd56080b95ce54ae81387e1bbb05b48eb1eea604714db51abbc0fcf27440097b'
          bundle=json.loads(payload)
          patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'manual.patch'
          patch.write_text(bundle['patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check','--index','--unidiff-zero',str(patch)],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(patch)],check=True)
          for name in ['MANUAL_TECNICO.md','ambiente_fonte/.assistant/MANUAL_TECNICO.md','Novo_Ambiente_Simulado/Users/usuario-free/.assistant/MANUAL_TECNICO.md']:
              p=pathlib.Path(name)
              assert not p.exists()
              p.write_bytes(bundle['manual'].encode('utf-8'))
              subprocess.run(['git','add','--',name],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree == '5d04e45d26edbfe7e2336aff41f8a8d5652885d1', tree
          assert len(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()) == 94
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('Arvore de 94 arquivos identica a validada localmente:',tree)
          PY
      - name: Dependencias apenas do runner
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Gate completo do repositorio
        shell: bash
        run: |
          set -o pipefail
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/manual-gate.log"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Spark apenas local no runner
        run: python -m pip install 'pyspark==4.0.1'
      - name: Executar exemplo sintetico extraido do manual
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/manual-spark.log"
          import pathlib, re, sys
          from pyspark.sql import SparkSession
          root=pathlib.Path('ambiente_fonte/.assistant').resolve()
          sys.path.insert(0,str(root))
          text=(root/'MANUAL_TECNICO.md').read_text(encoding='utf-8')
          labels=['qualidade_preparo','qualidade_chamada','qualidade_conferencia','politica_consumidor']
          blocks={}
          for code in re.findall(r'```python\n(.*?)```',text,re.S):
              tag=re.search(r'^# EXEMPLO: (\w+)$',code,re.M)
              if tag: blocks[tag[1]]=code
          spark=SparkSession.builder.master('local[2]').appName('manual-tecnico-sintetico').config('spark.sql.shuffle.partitions','2').getOrCreate()
          ns={}
          try:
              for label in labels:
                  exec(compile(blocks[label],'MANUAL_TECNICO.md:'+label,'exec'),ns)
                  print('APROVADO:',label)
              print('Exemplo DQ: quatro blocos do manual aprovados com dados sinteticos; nao e Databricks.')
          finally:
              spark.stop()
          PY
      - name: Preparar objetos Git sem commit ou atualizacao de branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repository='Guimarais-R-Rodrigo/Ambiente_Databricks'
          def api(route,payload):
              req=urllib.request.Request(f'https://api.github.com/repos/{repository}/git/{route}',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree == '5d04e45d26edbfe7e2336aff41f8a8d5652885d1'
          entries=[]; uploaded=set()
          names=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          for name in filter(None,names):
              index=subprocess.check_output(['git','ls-files','--stage','--',name],text=True).strip()
              if not index:
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':None})
                  continue
              mode,sha,stage=index.split('\t',1)[0].split()
              assert stage == '0'
              if sha not in uploaded:
                  data=subprocess.check_output(['git','show',':'+name])
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == sha
                  result=api('blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
                  assert result['sha'] == sha
                  uploaded.add(sha)
              entries.append({'path':name,'mode':mode,'type':'blob','sha':sha})
          manifest={'base':'c5fdc61181c14124d653cf9e6222d9a402745949','base_tree':'039dce3b15fa33e66cebbf5d136a01da8b621473','tree':tree,'files':entries,'gate':'passed','spark_example':'passed','run_id':os.environ['GITHUB_RUN_ID']}
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'manual-tree.json'
          output.write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          remote=api('trees',{'base_tree':manifest['base_tree'],'tree':entries})
          assert remote['sha'] == tree
          print('VALIDATED_TREE='+tree)
          print('Nenhum commit criado; nenhuma branch movida pelo runner.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-tecnico-validation
          path: |
            ${{ runner.temp }}/manual-gate.log
            ${{ runner.temp }}/manual-spark.log
            ${{ runner.temp }}/manual-tree.json
          retention-days: 3
