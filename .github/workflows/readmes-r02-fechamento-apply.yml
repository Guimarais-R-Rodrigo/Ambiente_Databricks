name: Conferencia do fechamento R02
on:
  push:
    branches: [codex/readmes-r02]
    paths: [.github/workflows/readmes-r02-fechamento-apply.yml]
permissions:
  contents: read
jobs:
  conferir:
    if: github.ref == 'refs/heads/codex/readmes-r02'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      BASE_COMMIT: 0c76bce9f3fa0f52b4312b60c3059e0fd27a2733
      BASE_TREE: a01f5ad520affd2fe8901ec31092576a107a5458
      EXPECTED_PARENT: 9a398911bb0812f56224fd7b43a552488d19e94f
      EXPECTED_TREE: 9daeb7c0de86a0c8655119b58d7e5e471b9c1f6c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruir somente o patch conferido
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          parts = sorted(Path('.github/readmes-r02-fechamento-transport').glob('part-*.txt'))
          if len(parts) != 3:
              raise SystemExit('Transporte incompleto')
          packed = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          if hashlib.sha256(packed).hexdigest() != '4a9d9d3532973b2d444277a338cb85dd146ecbcbd8e9dcaa2312f97bbfe8ffaf':
              raise SystemExit('Hash XZ divergente')
          patch = lzma.decompress(packed)
          if hashlib.sha256(patch).hexdigest() != 'c7d8ddd93f5faa5d506b1d9459175abf37508e811d110a5bacb1a67e2e5af190':
              raise SystemExit('Hash patch divergente')
          Path(os.environ['RUNNER_TEMP'], 'REVISAO_R02.patch').write_bytes(patch)
          print('Hashes do lote conferidos.')
          PY
          git apply --check "$RUNNER_TEMP/REVISAO_R02.patch"
          git apply --index "$RUNNER_TEMP/REVISAO_R02.patch"
          git rm -r .github/readmes-r02-fechamento-transport .github/workflows/readmes-r02-fechamento-apply.yml .github/workflows/readmes-r02-revisao-base.yml
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Executar gate existente e preservacao
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-dev.txt
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/fechamento-r02-gate.txt"
          python docs/sprints/readmes_objetos/evidencias_fechamento_r02/verificar_preservacao.py "$GITHUB_WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/fechamento-r02-preservacao.txt"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - name: Reproduzir os tres casos novos em ambiente isolado
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/fechamento-r02-venv"
          "$RUNNER_TEMP/fechamento-r02-venv/bin/python" -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 xgboost==3.1.3
          "$RUNNER_TEMP/fechamento-r02-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/fechamento-r02-pacotes.txt"
          "$RUNNER_TEMP/fechamento-r02-venv/bin/python" docs/sprints/readmes_objetos/evidencias_fechamento_r02/verificar_fechamento.py "$GITHUB_WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/fechamento-r02-rotulos.txt"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - name: Armazenar arvore testada sem merge ou atualizacao de refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args])
          if git('write-tree').decode().strip() != os.environ['EXPECTED_TREE']:
              raise SystemExit('Arvore mudou apos os testes')
          changes = git('diff', '--cached', '--name-status', '-z', os.environ['BASE_COMMIT']).decode().split('\0')
          entries = []
          i = 0
          while i < len(changes) and changes[i]:
              status, path = changes[i:i+2]
              i += 2
              if status not in ('A', 'M'):
                  raise SystemExit('Alteracao fora do lote: '+status)
              mode = git('ls-files', '--stage', '--', path).decode().split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'content': Path(path).read_bytes().decode('utf-8')})
          if len(entries) != 34:
              raise SystemExit('Escopo divergente: '+str(len(entries)))
          request = urllib.request.Request(
              os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',
              data=json.dumps({'base_tree': os.environ['BASE_TREE'], 'tree': entries}).encode(),
              method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json', 'Content-Type':'application/json',
                  'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request, timeout=90) as response:
              tree = json.load(response)['sha']
          if tree != os.environ['EXPECTED_TREE']:
              raise SystemExit('Arvore remota divergente: '+tree)
          result = {'tree': tree, 'base': os.environ['BASE_COMMIT'], 'paths': len(entries),
              'gate': 'PASS', 'preservacao': 'PASS', 'rotulos_novos': '3_PASS',
              'run_id': os.environ['GITHUB_RUN_ID'], 'refs_atualizadas_pelo_workflow': False,
              'merge_realizado': False, 'databricks_publicado': False}
          Path(os.environ['RUNNER_TEMP'], 'FECHAMENTO_R02.json').write_text(json.dumps(result, indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Guardar evidencias mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fechamento-r02-evidencias
          retention-days: 7
          path: |
            ${{ runner.temp }}/fechamento-r02-gate.txt
            ${{ runner.temp }}/fechamento-r02-preservacao.txt
            ${{ runner.temp }}/fechamento-r02-rotulos.txt
            ${{ runner.temp }}/fechamento-r02-pacotes.txt
            ${{ runner.temp }}/FECHAMENTO_R02.json
          if-no-files-found: warn
