name: Visual Lab notebook V05
on:
  push:
    branches: [main, 'codex/temas-v05*']
  pull_request:
    paths:
      - 'ambiente_fonte/.assistant/hub_snippets/visual/theme_lab/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/tema/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/theme_plotly/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/kpi_card/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/section_header/**'
      - 'ambiente_fonte/.assistant/hub_snippets/display/dataframe_styled/**'
      - 'ambiente_fonte/.assistant/hub_padroes/identidade_visual/**'
      - 'tools/tests/test_temas_v05*.py'
      - 'tools/ci_local.py'
      - 'docs/sprints/sistema_temas/V05/**'
      - '.github/workflows/temas-v05-ci.yml'
permissions:
  contents: read
jobs:
  visual-lab-v05:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências declaradas e UI de teste
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python -m pip install 'ipywidgets>=8,<9'
      - name: V05 específica e sessões sem SKIP de ipywidgets
        run: |
          python -B tools/tests/test_temas_v05.py --require-ipywidgets -v
          python -B tools/tests/test_temas_v05_sessions.py -v
      - name: Regressões de temas V01–V05
        run: python -B -m unittest discover -s tools/tests -p 'test_temas*.py' -v
      - name: Compatibilidade visual V00
        run: python -B tools/tests/test_visual_legado_v00.py
      - name: Validação estrutural e documental
        run: python -B tools/validate_assistant.py --conferir-readme
      - name: Escopo
        run: echo 'V05 valida Visual Lab offline, construção ipywidgets, presets e sessões locais rastreáveis; não homologa browser/runtime Databricks, acessibilidade, publicação, ACL real ou UAT.'
