name: Visual Lab notebook V05
# Receita manual de compatibilidade. Execução automática: ci.yml (DAG compartilhado).
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  visual-lab-v05:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências declaradas e UI de teste
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python -m pip install 'ipywidgets>=8,<9'
      - name: Dependências do compositor V06 para regressão cumulativa
        run: |
          npm install --global pnpm@10.34.5
          pnpm --dir tools/readme_visuals install --frozen-lockfile
      - name: Preparar derivado local do SHA
        run: |
          python -B tools/validate_assistant.py --conferir-readme
          python -B tools/render_simulado.py --write
          python -B tools/render_simulado.py --check
      - name: V05 específica e sessões sem SKIP de ipywidgets
        run: |
          python -B tools/tests/test_temas_v05.py --require-ipywidgets -v
          python -B tools/tests/test_temas_v05_sessions.py -v
      - name: Regressões de temas V01–V06
        run: python -B -m unittest discover -s tools/tests -p 'test_temas*.py' -v
      - name: Compatibilidade visual V00
        run: python -B tools/tests/test_visual_legado_v00.py
      - name: Validação estrutural e documental
        run: python -B tools/validate_assistant.py --conferir-readme
      - name: Escopo
        run: echo 'V05 mantém regressão cumulativa V01–V06; o preparo Node existe apenas para os testes V06 e não homologa browser/runtime Databricks, acessibilidade, publicação, ACL real ou UAT.'
