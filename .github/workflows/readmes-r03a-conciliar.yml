name: Conciliacao R03-A com V00 preservada
on:
  push:
    branches: [codex/readmes-r03a]
    paths: [.github/workflows/readmes-r03a-conciliar.yml]
permissions:
  contents: read
jobs:
  conferir:
    if: github.ref == 'refs/heads/codex/readmes-r03a'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      SPARK_LOCAL_IP: '127.0.0.1'
      READMES_COMMIT: 7bb2db65718d6350e4ad753c1744fa48a7fb55ea
      MAIN_COMMIT: b88a9ccdde6e61892bc25eb7cf4f4b2577badb23
      MAIN_TREE: e339983237bd21b2127248f38705c685b03da0f0
      EXPECTED_PARENT: 825dcc341763b50a62b4a75fd42852a3d7d8dade
      EXPECTED_TREE: d9576b20a2f63850a68d51c77fcfebadd13a769d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduzir resolucao local dos dois conflitos
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          import base64,hashlib,lzma,os,subprocess
          from pathlib import Path
          packed=base64.b64decode(Path('.github/readmes-r03a-conciliacao.txt').read_text().strip(),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='565a37f31e4c7becf79bf65a09ebd8957ca2ef69dda04eaf76eb78a48cbdfc9f'
          patch=lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest()=='45fd84c73868262e2bcffa9cd6ed8d8f4f163a4ba7adbe838cd0c57ed2a114b1'
          Path(os.environ['RUNNER_TEMP'],'conciliacao.patch').write_bytes(patch)
          proc=subprocess.run(['git','-c','merge.conflictStyle=merge','merge-tree','--write-tree','--name-only',os.environ['READMES_COMMIT'],os.environ['MAIN_COMMIT']],capture_output=True,text=True)
          assert proc.returncode==1,proc.stdout+proc.stderr
          first=proc.stdout.split('\n\n',1)[0].splitlines()
          assert set(first[1:])=={'CHANGELOG.md','README.md'},first
          assert first[0]=='753ba5c76637d4f6729f1646b2661c8cb9965ab7',first[0]
          subprocess.run(['git','read-tree','--reset','-u',first[0]],check=True)
          PY
          git apply --check "$RUNNER_TEMP/conciliacao.patch"
          git apply --index "$RUNNER_TEMP/conciliacao.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Reexecutar gate e suites V00 sem enfraquecer controles
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-dev.txt
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/conciliacao-gate.txt"
          for suite in test_inventario_visual test_visual_legado_v00 test_baseline_visual_runner; do
            python "tools/tests/$suite.py" 2>&1 | tee "$RUNNER_TEMP/$suite.txt"
          done
          python docs/sprints/readmes_objetos/evidencias_r03a/verificar_preservacao.py 2>&1 | tee "$RUNNER_TEMP/conciliacao-preservacao.json"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reexecutar 26 casos do lote incluindo Spark
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/r03a-spark-env"
          "$RUNNER_TEMP/r03a-spark-env/bin/python" -m pip install pyspark==4.0.1
          mkdir -p "$RUNNER_TEMP/spark-work"
          (cd "$RUNNER_TEMP/spark-work" && "$RUNNER_TEMP/r03a-spark-env/bin/python" "$GITHUB_WORKSPACE/docs/sprints/readmes_objetos/evidencias_r03a/verificar_r03a.py" --require-spark) 2>&1 | tee "$RUNNER_TEMP/conciliacao-26casos.txt"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - name: Armazenar commit de conciliacao sem atualizar refs nem main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args])
          assert git('write-tree').decode().strip()==os.environ['EXPECTED_TREE']
          data=git('diff','--cached','--name-status','-z',os.environ['MAIN_COMMIT']).decode().split('\0')
          entries=[];i=0
          while i<len(data) and data[i]:
              status,path=data[i:i+2];i+=2
              assert status in ('A','M'),(status,path)
              entries.append({'path':path,'mode':git('ls-files','--stage','--',path).decode().split()[0],
                  'type':'blob','content':Path(path).read_bytes().decode('utf-8')})
          assert len(entries)==78,len(entries)
          def post(route,payload):
              request=urllib.request.Request(os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+route,
                  data=json.dumps(payload).encode(),method='POST',headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=90) as response:return json.load(response)
          tree=post('/git/trees',{'base_tree':os.environ['MAIN_TREE'],'tree':entries})['sha']
          assert tree==os.environ['EXPECTED_TREE'],tree
          head=git('rev-parse','HEAD').decode().strip()
          parents=[head,os.environ['MAIN_COMMIT']]
          commit=post('/git/commits',{'tree':tree,'parents':parents,'message':
              'docs(r03a): concilia V00 preservando lote e contrato aprovado (ChatGPT)\n\nIncorpora main b88a9cc na branch de trabalho, sem alterar main.\nResolve CHANGELOG e contagens, preserva 20 arquivos V00 e sete guias.\nOito etapas aprovadas; 195 casos aprovados e sete pulados.\n48 casos V00 e 26 do lote com Spark aprovados; preservacao PASS.\n78 caminhos contra main; arvore d9576b2 conferida local/remota.\nSem publicacao Databricks, aceite novo presumido ou R03-B.\nTransportes fora da arvore final, historico preservado.'})
          assert commit['tree']['sha']==tree
          assert [p['sha'] for p in commit['parents']]==parents
          result={'commit':commit['sha'],'tree':tree,'parents':parents,'paths_vs_main':78,
              'gate':'8_PASS','v00':'48_PASS','r03a_spark':'26_PASS','preservacao':'PASS',
              'run_id':os.environ['GITHUB_RUN_ID'],'refs_atualizadas_pelo_workflow':False,'main_alterada':False}
          Path(os.environ['RUNNER_TEMP'],'CONCILIACAO_R03A.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Guardar evidencias mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03a-v00-conciliacao-evidencias
          retention-days: 7
          path: |
            ${{ runner.temp }}/conciliacao-gate.txt
            ${{ runner.temp }}/test_inventario_visual.txt
            ${{ runner.temp }}/test_visual_legado_v00.txt
            ${{ runner.temp }}/test_baseline_visual_runner.txt
            ${{ runner.temp }}/conciliacao-preservacao.json
            ${{ runner.temp }}/conciliacao-26casos.txt
            ${{ runner.temp }}/CONCILIACAO_R03A.json
          if-no-files-found: warn
