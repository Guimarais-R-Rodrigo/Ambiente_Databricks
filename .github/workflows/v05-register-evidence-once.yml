name: V05 registrar evidencias finais one-shot

on:
  push:
    branches:
      - codex/temas-v05-fechamento-r13-20260913
    paths:
      - .github/workflows/v05-register-evidence-once.yml

permissions:
  contents: write

jobs:
  registrar-evidencias:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Registrar checks e estado final
        run: python tools/v05_register_final_evidence_once.py

      - name: Commitar somente evidencias
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md docs/sprints/sistema_temas/V05/CHECKPOINT_V05.md docs/sprints/sistema_temas/V05/TESTES.md
          git diff --cached --check
          git commit -m "docs(temas): registrar evidências finais da PR V05"
          git push origin HEAD:${GITHUB_REF_NAME}
