name: Conferencia delimitada R03-B
on:
  push:
    branches: [codex/readmes-r03b]
    paths: [.github/workflows/readmes-r03b-apply.yml]
permissions:
  contents: read
jobs:
  conferir:
    if: github.ref == 'refs/heads/codex/readmes-r03b'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      SPARK_LOCAL_IP: '127.0.0.1'
      BASE_COMMIT: c60f1e54743dc23ed60b32ad2260b9aa6a77af0a
      BASE_TREE: d9576b20a2f63850a68d51c77fcfebadd13a769d
      EXPECTED_PARENT: 65efbe216d06bb71aae5a646b70eace0c658d343
      EXPECTED_TREE: 220f07aaac835cb671c4846d187e8c0988599d85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruir apenas os arquivos revisados e seus derivados
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess,sys
          from pathlib import Path
          root=Path.cwd()
          parts=sorted(Path('.github/readmes-r03b-transport').glob('part-*.txt'))
          assert len(parts)==4, 'Transporte incompleto'
          packed=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='af2921a24ad829f3cc66960ce16cc370e457499f62ecf86c390c066bc358da9e'
          plan=json.loads(lzma.decompress(packed))
          assert plan['base']==os.environ['BASE_COMMIT']
          assert plan['expected_tree']==os.environ['EXPECTED_TREE']
          assert len(plan['writes'])==28
          subprocess.run(['git','read-tree','--reset','-u',plan['base']],check=True)
          for path,rule in plan['writes'].items():
              p=root/path
              assert not Path(path).is_absolute() and '..' not in Path(path).parts
              assert p.resolve().is_relative_to(root)
              if 'text' in rule:
                  assert not p.exists(), path
                  text=rule['text']
              else:
                  raw=p.read_bytes()
                  assert hashlib.sha256(raw).hexdigest()==rule['sha256'], path
                  lines=raw.decode('utf-8').splitlines(keepends=True)
                  for start,end,replacement in reversed(rule['edits']):
                      lines[start:end]=[replacement]
                  text=''.join(lines)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(text,encoding='utf-8')
          (root/'MANUAL_TECNICO.md').write_bytes((root/'ambiente_fonte/.assistant/MANUAL_TECNICO.md').read_bytes())
          subprocess.run([sys.executable,'tools/render_simulado.py','--write'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==os.environ['EXPECTED_TREE'], tree
          print('Arvore identica ao lote testado localmente:',tree)
          PY
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Executar oito etapas e regressões V00 existentes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-dev.txt
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/r03b-gate.txt"
          for suite in test_inventario_visual test_visual_legado_v00 test_baseline_visual_runner; do
            python "tools/tests/$suite.py" 2>&1 | tee "$RUNNER_TEMP/$suite.txt"
          done
          python docs/sprints/readmes_objetos/evidencias_r03b/verificar_preservacao.py 2>&1 | tee "$RUNNER_TEMP/r03b-preservacao.json"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Executar 45 casos incluindo os seis blocos dos READMEs e Spark real
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/r03b-env"
          "$RUNNER_TEMP/r03b-env/bin/python" -m pip install numpy==2.3.5 pandas==2.2.3 plotly==6.5.2 jinja2==3.1.6 scipy==1.17.0 pyspark==4.0.1
          "$RUNNER_TEMP/r03b-env/bin/python" -m pip freeze > "$RUNNER_TEMP/r03b-pacotes.txt"
          mkdir -p "$RUNNER_TEMP/r03b-spark"
          (cd "$RUNNER_TEMP/r03b-spark" && "$RUNNER_TEMP/r03b-env/bin/python" "$GITHUB_WORKSPACE/docs/sprints/readmes_objetos/evidencias_r03b/verificar_r03b.py" --require-spark) 2>&1 | tee "$RUNNER_TEMP/r03b-45casos.txt"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - name: Armazenar arvore conferida sem atualizar branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args])
          assert git('write-tree').decode().strip()==os.environ['EXPECTED_TREE']
          parts=git('diff','--cached','--name-status','-z',os.environ['BASE_COMMIT']).decode().split('\0')
          entries=[];i=0
          while i<len(parts) and parts[i]:
              status,path=parts[i:i+2];i+=2
              assert status in ('A','M'), (status,path)
              entries.append({'path':path,'mode':git('ls-files','--stage','--',path).decode().split()[0],
                  'type':'blob','content':Path(path).read_bytes().decode('utf-8')})
          assert len(entries)==43, len(entries)
          request=urllib.request.Request(
              os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',
              data=json.dumps({'base_tree':os.environ['BASE_TREE'],'tree':entries}).encode(),method='POST',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=90) as response:tree=json.load(response)['sha']
          assert tree==os.environ['EXPECTED_TREE'],tree
          result={'tree':tree,'base':os.environ['BASE_COMMIT'],'paths':len(entries),'gate':'8_PASS',
              'v00':'48_PASS','suplemento_spark':'45_PASS','preservacao':'PASS','run_id':os.environ['GITHUB_RUN_ID'],
              'refs_atualizadas_pelo_workflow':False,'main_alterada':False,'databricks_publicado':False}
          Path(os.environ['RUNNER_TEMP'],'R03B-integracao.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Guardar evidencias mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03b-evidencias-integracao
          retention-days: 7
          path: |
            ${{ runner.temp }}/r03b-gate.txt
            ${{ runner.temp }}/test_inventario_visual.txt
            ${{ runner.temp }}/test_visual_legado_v00.txt
            ${{ runner.temp }}/test_baseline_visual_runner.txt
            ${{ runner.temp }}/r03b-preservacao.json
            ${{ runner.temp }}/r03b-45casos.txt
            ${{ runner.temp }}/r03b-pacotes.txt
            ${{ runner.temp }}/R03B-integracao.json
          if-no-files-found: warn
