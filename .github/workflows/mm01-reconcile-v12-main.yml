name: MM01 - reconciliar main pos-V12

on:
  push:
    branches:
      - micromodelos/mm01-contrato-canonico
    paths:
      - .github/workflows/mm01-reconcile-v12-main.yml

permissions:
  contents: write

jobs:
  reconciliar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar branch MM01
        uses: actions/checkout@v4
        with:
          ref: micromodelos/mm01-contrato-canonico
          fetch-depth: 0

      - name: Registrar invariantes e configurar Git
        shell: bash
        run: |
          echo "MATRIX_SHA=$(sha256sum docs/sprints/micromodelos/MM01/MATRIZ_ACEITE_FINAL.md | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "AUDIT8_SHA=$(sha256sum docs/auditoria/2026-09-14_micromodelos-mm01/10_resultado_a1_reauditoria_7.md | awk '{print $1}')" >> "$GITHUB_ENV"
          git config user.name "Rodrigo"
          git config user.email "guimarais.r.rodrigo@gmail.com"
          git fetch origin main

      - name: Mesclar main vigente
        shell: bash
        run: |
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          if [ "$rc" -ne 0 ]; then
            test "$conflicts" = "README.md"
            git checkout --theirs README.md
            git add README.md
          else
            test -z "$conflicts"
          fi
          test -f .git/MERGE_HEAD

      - name: Remover workflow transitório da árvore final
        run: git rm .github/workflows/mm01-reconcile-v12-main.yml

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r tools/requirements-dev.txt

      - name: Executar suíte MM01
        run: python -B -m unittest tools/tests/test_micromodelo_mm01.py -v

      - name: Validar CLI snapshot
        shell: bash
        run: |
          output="$(python -B tools/micromodelo_mm01_contract.py docs/sprints/micromodelos/MM01/micromodelo.template.yaml --schema docs/sprints/micromodelos/MM01/micromodelo.schema.json)"
          printf '%s\n' "$output"
          grep -q 'SNAPSHOT_VALIDO' <<<"$output"
          grep -q 'HISTORICO_NAO_CERTIFICADO' <<<"$output"

      - name: Medir e sincronizar identidade do README
        shell: bash
        run: |
          python -B tools/validate_assistant.py --root ambiente_fonte | tee /tmp/validate-before.txt
          identity="$(sed -n 's/^repo (identidade)  : \([0-9][0-9]*\) arquivos.*/\1/p' /tmp/validate-before.txt)"
          test -n "$identity"
          python - "$identity" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          identity = sys.argv[1]
          text, count = re.subn(
              r'repo \(identidade\)  : \d+ arquivos varridos no repositório editável/derivado',
              f'repo (identidade)  : {identity} arquivos varridos no repositório editável/derivado',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'métrica README: esperado 1 match, obtido {count}')
          path.write_text(text, encoding='utf-8')
          PY
          python -B tools/validate_assistant.py --root ambiente_fonte --conferir-readme

      - name: Conferir invariantes pós-merge
        shell: bash
        run: |
          git diff --check
          test "$(sha256sum docs/sprints/micromodelos/MM01/MATRIZ_ACEITE_FINAL.md | awk '{print $1}')" = "$MATRIX_SHA"
          test "$(sha256sum docs/auditoria/2026-09-14_micromodelos-mm01/10_resultado_a1_reauditoria_7.md | awk '{print $1}')" = "$AUDIT8_SHA"
          test ! -e .github/workflows/mm01-reconcile-v12-main.yml
          test "$(grep -c '^    def test_' tools/tests/test_micromodelo_mm01.py)" -eq 47
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git diff --name-only HEAD -- CHANGELOG.md | wc -l)" -eq 0
          test "$(git diff --name-only HEAD -- ambiente_fonte/.assistant | wc -l)" -eq 0
          git merge-base --is-ancestor origin/main HEAD || test -f .git/MERGE_HEAD

      - name: Publicar merge real de reconciliação
        shell: bash
        run: |
          git add -A
          git commit -m "chore(mm01): reconciliar main apos V12"
          git push origin HEAD:micromodelos/mm01-contrato-canonico
