name: Corrigir achados P2 V03
on:
  push:
    branches:
      - codex/temas-v03-review-20260912
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PATCH_B64: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências declaradas
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Aplicar correções P2 e regenerar espelho
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'Code review P2: o adaptador Plotly passa a consumir' CHANGELOG.md; then
            echo 'Correções já aplicadas; não repetir patch.'
          else
            python -c "import base64,os; exec(base64.b64decode(os.environ['PATCH_B64']).decode('utf-8'))"
          fi
          python -B tools/render_simulado.py --write
          cmp ambiente_fonte/.assistant/hub_snippets/visual/theme_plotly/theme_plotly.py Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/visual/theme_plotly/theme_plotly.py
          cmp ambiente_fonte/.assistant/hub_snippets/visual/theme_plotly/README.md Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/visual/theme_plotly/README.md
      - name: Exigir regressões antes de gravar
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/tests/test_temas_v03.py
          python -B tools/tests/test_visual_legado_v00.py
          python -B tools/validate_assistant.py --conferir-readme
          python -B tools/ci_local.py --verbose
      - name: Commitar somente correções permanentes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add CHANGELOG.md ambiente_fonte/.assistant/hub_snippets/visual/theme_plotly Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/visual/theme_plotly tools/tests/test_temas_v03.py
          if git diff --cached --quiet; then
            echo 'Sem correções permanentes adicionais.'
            exit 0
          fi
          git commit -m "fix(temas): fechar achados P2 do code review V03"
          git push origin HEAD:codex/temas-v03-review-20260912
