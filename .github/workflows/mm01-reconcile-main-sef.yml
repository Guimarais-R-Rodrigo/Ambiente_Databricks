name: MM01 - reconciliar main apos SEF

on:
  push:
    branches:
      - micromodelos/mm01-contrato-canonico
    paths:
      - .github/workflows/mm01-reconcile-main-sef.yml

permissions:
  contents: write

jobs:
  reconciliar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar branch MM01
        uses: actions/checkout@v4
        with:
          ref: micromodelos/mm01-contrato-canonico
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Confirmar main esperada
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "28669f99db27cf23df73549297bbf57eda033f58"

      - name: Mesclar main e resolver conflito controlado do README
        shell: bash
        run: |
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Esperava conflito controlado em README.md, mas merge foi limpo."
            exit 1
          fi
          conflicts="$(git diff --name-only --diff-filter=U)"
          test "$conflicts" = "README.md"
          git checkout --ours README.md
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          p.write_text(text.rstrip('\n') + '\n', encoding='utf-8')
          PY
          git add README.md
          test "$(git ls-files -u | wc -l)" -eq 0
          test "$(git rev-parse :docs/sprints/skill_enforcement/PLANO_MESTRE.md)" = "$(git rev-parse origin/main:docs/sprints/skill_enforcement/PLANO_MESTRE.md)"

      - name: Remover executor transitório
        run: git rm .github/workflows/mm01-reconcile-main-sef.yml

      - name: Instalar dependencias
        run: python -m pip install -r tools/requirements-dev.txt

      - name: Executar suite MM01
        run: python -B -m unittest tools/tests/test_micromodelo_mm01.py -v

      - name: Medir identidade final e reconciliar README
        shell: bash
        run: |
          python -B tools/validate_assistant.py --root ambiente_fonte | tee /tmp/validate-mm01.txt
          count="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/validate-mm01.txt').read_text(encoding='utf-8')
          m = re.search(r'repo \(identidade\)\s*:\s*(\d+) arquivos', text)
          if not m:
              raise SystemExit('métrica repo (identidade) não encontrada')
          print(m.group(1))
          PY
          )"
          python - "$count" <<'PY'
          import re
          import sys
          from pathlib import Path
          count = sys.argv[1]
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          new, n = re.subn(
              r'repo \(identidade\)\s*:\s*\d+ arquivos varridos no repositório editável/derivado',
              f'repo (identidade)  : {count} arquivos varridos no repositório editável/derivado',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'linha de identidade não reconciliada: {n}')
          p.write_text(new.rstrip('\n') + '\n', encoding='utf-8')
          PY
          git add README.md
          echo "Identidade final medida: ${count}"
          python -B tools/validate_assistant.py --root ambiente_fonte --conferir-readme

      - name: Conferir integridade da reconciliacao
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only HEAD -- CHANGELOG.md | wc -l)" -eq 0
          test "$(git diff --name-only HEAD -- ambiente_fonte/.assistant | wc -l)" -eq 0
          test "$(git ls-files -u | wc -l)" -eq 0
          test ! -e .github/workflows/mm01-reconcile-main-sef.yml
          git fetch origin main
          test "$(git rev-parse origin/main)" = "28669f99db27cf23df73549297bbf57eda033f58"

      - name: Publicar merge de reconciliacao
        shell: bash
        run: |
          git config user.name "Rodrigo"
          git config user.email "guimarais.r.rodrigo@gmail.com"
          git add -A
          git commit -m "chore(mm01): reconciliar main apos plano SEF"
          test "$(git show -s --format=%P HEAD | wc -w)" -eq 2
          git push origin HEAD:micromodelos/mm01-contrato-canonico
