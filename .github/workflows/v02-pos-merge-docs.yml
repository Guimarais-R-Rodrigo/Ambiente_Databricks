name: Fechar documentação pós-merge V02
on:
  push:
    branches:
      - codex/v02-pos-merge-20260912
permissions:
  contents: write
jobs:
  reconciliar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar Manual e changelog
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('ambiente_fonte/.assistant/MANUAL_TECNICO.md'); t=p.read_text(encoding='utf-8'); old='uma cópia editável, sem contaminar a configuração original. A V02 é candidata;\nintegração Git, execução local e homologação no workspace são estados diferentes.'; new='uma cópia editável, sem contaminar a configuração original. A V02 foi aceita e\nintegrada no Git pelo PR #14; execução local, publicação e homologação no workspace\ncontinuam sendo estados diferentes.'; assert old in t; p.write_text(t.replace(old,new,1),encoding='utf-8')"
          python -c "from pathlib import Path; p=Path('CHANGELOG.md'); t=p.read_text(encoding='utf-8'); m='## 2026-09-12 — V02: aceite e integração Git concluídos (Codex)'; a='## 2026-09-12 — V02: alinhamento documental da candidata remota (Codex)'; e='''## 2026-09-12 — V02: aceite e integração Git concluídos (Codex)\n\n### Atualizado\n\n- (Codex) Aceite explícito de Rodrigo registrado e PR #14 integrado na `main` no commit `d4cabdca4ac68c0a2edbd7f9f621f68962c8f6b8`; checkpoint, índices, contexto canônico e Manual passam a refletir o estado efetivo.\n- (Codex) Manual fonte atualizado e cópias derivadas regeneradas pelo renderer, sem edição manual do espelho.\n\n### Notas\n\n- (Codex) A árvore do merge é idêntica à candidata final validada; CI geral, V00, V01 e V02 passaram novamente após o merge na `main`.\n- (Codex) Sem publicação Databricks, mudança visual, homologação de Spark/widgets/Apps/AI-BI ou início da V03. Auditoria independente e teste com iniciante permanecem pendentes.\n\n'''; assert (m in t) or (a in t); p.write_text(t if m in t else t.replace(a,e+a,1),encoding='utf-8')"
      - name: Regenerar derivados
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/render_simulado.py
      - name: Commitar somente reconciliação documental
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add CHANGELOG.md CLAUDE.md docs/sprints/README.md docs/sprints/sistema_temas/README.md docs/sprints/sistema_temas/V02/README.md docs/sprints/sistema_temas/V02/CHECKPOINT_V02.md ambiente_fonte/.assistant/MANUAL_TECNICO.md MANUAL_TECNICO.md Novo_Ambiente_Simulado/Users/usuario-free/.assistant/MANUAL_TECNICO.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(temas): registrar aceite e integração V02 (Codex)"
          git push origin HEAD:codex/v02-pos-merge-20260912
