name: Diagnóstico V04 x main R06
on:
  push:
    branches:
      - codex/temas-v04-html-20260912
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Diagnosticar merge sem gravar
        shell: bash
        env:
          MAIN_ESPERADA: 289731c79e8ed43d82b39d61cdc41ba2e69ea717
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN_ESPERADA"
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          echo "merge_rc=$rc"
          echo "CONFLITOS:"
          git diff --name-only --diff-filter=U
          echo "MUDANCAS RESULTANTES:"
          git status --short
          git merge --abort || true
          exit $rc
