name: Reconciliar V04 com R05/R06
on:
  push:
    branches:
      - codex/temas-v04-html-20260912
permissions:
  contents: write
jobs:
  reconciliar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      MAIN_ESPERADA: 289731c79e8ed43d82b39d61cdc41ba2e69ea717
      BASE_ANTERIOR: d9da056c95bf5c4209b2f208de1c9a987580efe7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências declaradas
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Mesclar e resolver somente os três conflitos conhecidos
        shell: bash
        run: |
          set -euo pipefail
          PRE="$(git rev-parse HEAD)"
          echo "$PRE" >/tmp/v04_pre
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN_ESPERADA"
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected=$'CHANGELOG.md\nREADME.md\ndocs/sprints/README.md'
          test "$conflicts" = "$expected"
          test "$rc" -eq 1

          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          pre=Path('/tmp/v04_pre').read_text().strip()
          def show(ref,path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)

          # 1) Changelog: main é a base; injeta a seção V04 exata da candidata.
          ours=show(pre,'CHANGELOG.md')
          main=show('origin/main','CHANGELOG.md')
          m=re.search(r'(?ms)^## 2026-09-12 — V04:.*?(?=^## 2026-09-12 — )',ours)
          if not m: raise SystemExit('seção V04 não encontrada no changelog candidato')
          block=m.group(0).rstrip()+'\n\n'
          if '## 2026-09-12 — V04:' in main: raise SystemExit('main já contém V04 inesperadamente')
          marker=re.search(r'(?m)^## 2026-09-12 — ',main)
          if not marker: raise SystemExit('changelog da main sem seção datada')
          Path('CHANGELOG.md').write_text(main[:marker.start()]+block+main[marker.start():],encoding='utf-8')

          # 2) README raiz: a main contém o histórico R05/R06. O bloco medido será
          # atualizado depois pelo validador na árvore já reconciliada.
          Path('README.md').write_text(show('origin/main','README.md'),encoding='utf-8')

          # 3) Índice de sprints: preserva R05/R06 da main e substitui somente
          # o bloco Sistema de Temas pelo bloco V04 da candidata.
          ours=show(pre,'docs/sprints/README.md')
          main=show('origin/main','docs/sprints/README.md')
          pat=r'(?ms)^## Sistema de Temas do Hub\n.*?(?=^### READMEs de objeto — R04-B\n)'
          mo=re.search(pat,ours); mm=re.search(pat,main)
          if not mo or not mm: raise SystemExit('bloco Sistema de Temas/R04-B não localizado')
          merged=main[:mm.start()]+mo.group(0).rstrip()+'\n\n'+main[mm.end():]
          Path('docs/sprints/README.md').write_text(merged,encoding='utf-8')
          PY
          git add CHANGELOG.md README.md docs/sprints/README.md
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Atualizar estado V04 para a base R06 sem reescrever histórico
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          run=os.environ['GITHUB_RUN_ID']

          p=Path('docs/sprints/sistema_temas/V04/README.md'); t=p.read_text(encoding='utf-8')
          old='''Durante\na implementação, a `main` avançou para `d9da056c95bf5c4209b2f208de1c9a987580efe7`\ncom a R04-B; a branch V04 foi reconciliada explicitamente com essa revisão no run\n`34727070003`, preservando os dois lados e reexecutando os gates. A base efetiva\nda candidata, portanto, contém V03 + R04-A + R04-B.'''
          new=f'''Durante\na implementação, a `main` avançou primeiro para `d9da056c95bf5c4209b2f208de1c9a987580efe7`\ncom a R04-B e depois para `289731c79e8ed43d82b39d61cdc41ba2e69ea717`\ncom R05/R06. A branch V04 foi reconciliada explicitamente com essas revisões; a\nreconciliação final usa o run `{run}`. A base efetiva da candidata contém\nV03 + R04-A + R04-B + R05 + R06.'''
          if t.count(old)!=1: raise SystemExit('README V04: histórico-base inesperado')
          p.write_text(t.replace(old,new,1),encoding='utf-8')

          p=Path('docs/sprints/sistema_temas/V04/CHECKPOINT_V04.md'); t=p.read_text(encoding='utf-8')
          old='''`d9da056c95bf5c4209b2f208de1c9a987580efe7`, que acrescentou a R04-B.\nA reconciliação verde está no commit\n`c2b91c5e3a3d80f754045dfc4fae8eb335e31bef`; a candidata final ainda precisa\nincorporar documentação/derivados e repetir os gates.'''
          new=f'''`d9da056c95bf5c4209b2f208de1c9a987580efe7`, que acrescentou a R04-B, e depois\ncom `289731c79e8ed43d82b39d61cdc41ba2e69ea717`, que integra R05/R06. A\nreconciliação final é validada no run `{run}`; a V04 continua sem aceite ou merge.'''
          if t.count(old)!=1: raise SystemExit('CHECKPOINT V04: base anterior inesperada')
          t=t.replace(old,new,1)
          oldrow='| Regressões automatizadas | CANDIDATA VALIDADA — evidência final run `34727630459` |'
          newrow=f'| Regressões automatizadas | EM REVALIDAÇÃO sobre R06 — run `{run}` |'
          if t.count(oldrow)!=1: raise SystemExit('CHECKPOINT V04: linha de regressões inesperada')
          p.write_text(t.replace(oldrow,newrow,1),encoding='utf-8')

          p=Path('docs/sprints/sistema_temas/V04/TESTES.md'); t=p.read_text(encoding='utf-8')
          marker='## Não medido por estes runs\n'
          block=f'''## Reconciliação final com R05/R06 — run `{run}`\n\nA `main` avançou depois da validação `34727630459`. O diagnóstico `34731492694`\nfalhou antes do merge porque o checkout removeu as credenciais necessárias ao\n`fetch` privado; o diagnóstico corrigido `34731516515` identificou somente três\nconflitos documentais (`CHANGELOG.md`, `README.md` e `docs/sprints/README.md`).\nNenhum deles foi tratado por escolha cega de lado. A rodada `{run}` compõe esses\ntrês arquivos, preserva os demais caminhos R05/R06 da `main`, remove os workflows\ntransitórios e repete os gates na árvore final. Este bloco só será versionado se\na rodada terminar com sucesso.\n\n'''
          if t.count(marker)!=1: raise SystemExit('TESTES V04: marcador final inesperado')
          p.write_text(t.replace(marker,block+marker,1),encoding='utf-8')
          PY
      - name: Regenerar derivados e retirar workflows transitórios
        shell: bash
        run: |
          set -euo pipefail
          cp ambiente_fonte/.assistant/MANUAL_TECNICO.md MANUAL_TECNICO.md
          python -B tools/render_simulado.py --write
          git rm .github/workflows/v04-diagnostico-main-r06-transitorio.yml .github/workflows/v04-reconciliar-r06-transitorio.yml
          test ! -e .github/workflows/v04-diagnostico-main-r06-transitorio.yml
          test ! -e .github/workflows/v04-reconciliar-r06-transitorio.yml
      - name: Medir README raiz na árvore reconciliada
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/validate_assistant.py > /tmp/validate.txt
          cat /tmp/validate.txt
          python - <<'PY'
          from pathlib import Path
          out=Path('/tmp/validate.txt').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(out) if l.startswith('skills'))
          end=next(i for i,l in enumerate(out[start:],start) if l.startswith('APROVADO:'))
          measured='\n'.join(out[start:end+1])
          p=Path('README.md'); t=p.read_text(encoding='utf-8')
          h=t.index('### Estado verificável do gate local')
          a=t.index('```text',h)+len('```text')
          b=t.index('```',a)
          p.write_text(t[:a]+'\n'+measured+'\n'+t[b:],encoding='utf-8')
          PY
      - name: Verificar preservação cruzada V04 e R05/R06
        shell: bash
        run: |
          set -euo pipefail
          PRE="$(cat /tmp/v04_pre)"
          # Caminhos V04 específicos devem permanecer iguais ao candidato anterior.
          git diff --name-only "$BASE_ANTERIOR" "$PRE" | while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              CHANGELOG.md|README.md|CLAUDE.md|MANUAL_TECNICO.md|docs/sprints/README.md|ambiente_fonte/.assistant/MANUAL_TECNICO.md|Novo_Ambiente_Simulado/Users/usuario-free/.assistant/MANUAL_TECNICO.md|.github/workflows/v04-diagnostico-main-r06-transitorio.yml)
                continue;;
            esac
            if git cat-file -e "$PRE:$p" 2>/dev/null; then
              test -e "$p" && cmp <(git show "$PRE:$p") "$p"
            fi
          done
          # Caminhos R05/R06 específicos devem permanecer iguais à main atual.
          git diff --name-only "$BASE_ANTERIOR" origin/main | while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              CHANGELOG.md|README.md|CLAUDE.md|MANUAL_TECNICO.md|docs/sprints/README.md|ambiente_fonte/.assistant/MANUAL_TECNICO.md|Novo_Ambiente_Simulado/Users/usuario-free/.assistant/MANUAL_TECNICO.md)
                continue;;
            esac
            if git cat-file -e "origin/main:$p" 2>/dev/null; then
              test -e "$p" && cmp <(git show "origin/main:$p") "$p"
            fi
          done
          cmp ambiente_fonte/.assistant/MANUAL_TECNICO.md MANUAL_TECNICO.md
          cmp ambiente_fonte/.assistant/MANUAL_TECNICO.md Novo_Ambiente_Simulado/Users/usuario-free/.assistant/MANUAL_TECNICO.md
          grep -q 'V04' ambiente_fonte/.assistant/MANUAL_TECNICO.md
          grep -q 'Guias locais R06' ambiente_fonte/.assistant/MANUAL_TECNICO.md
      - name: Gates finais da composição
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/tests/test_temas_v04.py -v
          python -B -m unittest discover -s tools/tests -p 'test_temas*.py' -v
          python -B tools/tests/test_visual_legado_v00.py
          python -B tools/validate_assistant.py --conferir-readme
          python -B docs/sprints/readmes_objetos/evidencias_r05/verificar_r05.py
          python -B docs/sprints/readmes_objetos/evidencias_r06/verificar_r06.py
          python -B tools/ci_local.py --verbose
      - name: Congelar candidata final somente com main estável
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN_ESPERADA"
          python - <<'PY'
          import os
          from pathlib import Path
          run=os.environ['GITHUB_RUN_ID']
          p=Path('docs/sprints/sistema_temas/V04/CHECKPOINT_V04.md'); t=p.read_text(encoding='utf-8')
          old=f'| Regressões automatizadas | EM REVALIDAÇÃO sobre R06 — run `{run}` |'
          new=f'| Regressões automatizadas | CANDIDATA VALIDADA sobre R06 — run `{run}` |'
          if t.count(old)!=1: raise SystemExit('CHECKPOINT: estado final inesperado')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          python -B tools/validate_assistant.py > /tmp/validate_final.txt
          python - <<'PY'
          from pathlib import Path
          out=Path('/tmp/validate_final.txt').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(out) if l.startswith('skills'))
          end=next(i for i,l in enumerate(out[start:],start) if l.startswith('APROVADO:'))
          measured='\n'.join(out[start:end+1])
          p=Path('README.md'); t=p.read_text(encoding='utf-8')
          h=t.index('### Estado verificável do gate local'); a=t.index('```text',h)+len('```text'); b=t.index('```',a)
          p.write_text(t[:a]+'\n'+measured+'\n'+t[b:],encoding='utf-8')
          PY
          python -B tools/validate_assistant.py --conferir-readme
          git add -A
          git commit -m "merge: reconciliar V04 candidata com R05/R06 integradas"
          git push origin HEAD:codex/temas-v04-html-20260912
