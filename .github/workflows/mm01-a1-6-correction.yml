name: MM01 sexta A1 - correcao transitoria

on:
  push:
    branches:
      - micromodelos/mm01-contrato-canonico
    paths:
      - .github/workflows/mm01-a1-6-correction.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar branch MM01
        uses: actions/checkout@v4
        with:
          ref: micromodelos/mm01-contrato-canonico
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Aplicar correcao da sexta A1
        run: python -B tools/mm01_a1_6_fix.py

      - name: Normalizar linha editorial alterada
        run: sed -i '3s/  $//' docs/sprints/micromodelos/MM01/README.md

      - name: Remover artefatos transitorios
        run: git rm tools/mm01_a1_6_fix.py .github/workflows/mm01-a1-6-correction.yml

      - name: Instalar dependencias
        run: python -m pip install -r tools/requirements-dev.txt

      - name: Executar suite MM01 ampliada
        run: python -B -m unittest tools/tests/test_micromodelo_mm01.py -v

      - name: Executar gate estrutural
        run: python -B tools/validate_assistant.py --root ambiente_fonte

      - name: Conferir invariantes da sexta A1
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schema = json.loads(Path('docs/sprints/micromodelos/MM01/micromodelo.schema.json').read_text(encoding='utf-8'))
          patterns = {}
          competing = []

          def walk(node, path=()):
              if isinstance(node, dict):
                  joined = '.'.join(path)
                  if 'pattern' in node:
                      patterns[joined] = node['pattern']
                  if node.get('format') == 'material-text' and 'pattern' in node:
                      competing.append(joined)
                  for key, value in node.items():
                      walk(value, path + (str(key),))
              elif isinstance(node, list):
                  for idx, value in enumerate(node):
                      walk(value, path + (str(idx),))

          walk(schema)
          expected = {
              '$defs.id': r'^[a-z][a-z0-9_]{2,63}$',
              'properties.identidade.properties.nome': r'^[a-z][a-z0-9-]{2,63}$',
              'properties.identidade.properties.micromodel_version': r'^\d+\.\d+\.\d+$',
          }
          assert not competing, competing
          assert patterns == expected, (patterns, expected)
          assert not Path('tools/mm01_a1_6_fix.py').exists()
          assert not Path('.github/workflows/mm01-a1-6-correction.yml').exists()
          print('Invariantes sexta A1: OK')
          PY
          git diff --check
          test "$(git diff --name-only | grep -c '^CHANGELOG.md$' || true)" -eq 0
          test "$(git diff --name-only | grep -c '^ambiente_fonte/.assistant/' || true)" -eq 0

      - name: Publicar correcao permanente
        shell: bash
        run: |
          git config user.name "Rodrigo"
          git config user.email "guimarais.r.rodrigo@gmail.com"
          git add -A
          git commit -m "fix(mm01): eliminar autoridade regex concorrente apos sexta A1"
          git push origin HEAD:micromodelos/mm01-contrato-canonico
