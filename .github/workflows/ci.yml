    - name: Aplicabilidade do escopo estrito V12
      id: v12_scope_applicability
      shell: bash
      run: "set -euo pipefail\nif [[ \"$GITHUB_EVENT_NAME\" == \"pull_request\" && \"$GITHUB_HEAD_REF\" != codex/temas-v12* ]]; then\n  echo \"applicable=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"V12_SCOPE=NOT_APPLICABLE\"\nelse\n  echo \"applicable=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"V12_SCOPE=APPLICABLE\"\nfi\n"
    - name: Escopo V12 e higiene
      if: steps.v12_scope_applicability.outputs.applicable == 'true'
      shell: bash
      run: "set -euo pipefail\ngit rev-parse --verify origin/main >/dev/null\ngit diff --name-only origin/main...HEAD > \"$RUNNER_TEMP/v12_alterados.txt\"\ngit diff --unified=0 origin/main...HEAD -- README.md CHANGELOG.md docs/sprints/README.md docs/sprints/sistema_temas/README.md > \"$RUNNER_TEMP/v12_compartilhados.diff\"\npython - <<'PY'\nimport os\nimport sys\nfrom pathlib import Path\n\nsys.path.insert(0, \"tools\")\nfrom temas_v12_homologacao import linhas_adicionadas, scan_hygiene\n\nPROPRIOS = (\n    \"tools/temas_v12_homologacao.py\",\n    \"tools/tests/test_temas_v12.py\",\n    \"tools/tests/test_temas_v12_evidencia_real.py\",\n    \".github/workflows/temas-v12-ci.yml\",\n)\nCOMPARTILHADOS = (\n    \"README.md\",\n    \"CHANGELOG.md\",\n    \"docs/sprints/README.md\",\n    \"docs/sprints/sistema_temas/README.md\",\n)\nPREFIXO_V12 = \"docs/sprints/sistema_temas/V12/\"\n\ntemp = Path(os.environ[\"RUNNER_TEMP\"])\nalterados = [c for c in temp.joinpath(\"v12_alterados.txt\").read_text(encoding=\"\
        utf-8\").splitlines() if c]\nprint(\"Arquivos V12 alterados:\")\nfor caminho in alterados:\n    print(\"  \" + caminho)\n\nfora = [c for c in alterados if not (c in PROPRIOS or c in COMPARTILHADOS or c.startswith(PREFIXO_V12))]\nfor caminho in fora:\n    print(\"V12_SCOPE_FAIL: \" + caminho)\nif fora:\n    raise SystemExit(1)\n\n# Caminhos que a candidata criou: varredura integral do conteúdo.\nintegrais = [c for c in alterados if c in PROPRIOS or c.startswith(PREFIXO_V12)]\nachados = []\nfor caminho in integrais:\n    arquivo = Path(caminho)\n    if arquivo.is_file():\n        achados += scan_hygiene(caminho, arquivo.read_text(encoding=\"utf-8\", errors=\"replace\"))\n\n# Documentos compartilhados: somente o que esta candidata adicionou.\n# Varrer o arquivo inteiro transformaria dívida histórica da main em\n# reprovação desta PR, que é outro problema e outro gate.\ndiff = temp.joinpath(\"v12_compartilhados.diff\").read_text(encoding=\"utf-8\", errors=\"replace\")\nadicionados =\
        \ linhas_adicionadas(diff)\nfor caminho, conteudo in sorted(adicionados.items()):\n    achados += scan_hygiene(caminho + \" (linhas adicionadas)\", conteudo)\n\nprint(\"higiene : %d caminho(s) integrais, %d documento(s) compartilhado(s) pelo diff\" % (len(integrais), len(adicionados)))\nfor codigo, origem, numero in achados:\n    print(\"%s: %s:%d\" % (codigo, origem, numero))\nif achados:\n    print(\"V12_HYGIENE_FAIL\")\n    raise SystemExit(1)\nprint(\"V12_SCOPE=PASS\")\nprint(\"V12_REMOTE_MUTATION=0\")\nPY\n"
