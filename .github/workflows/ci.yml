name: CI local reproduzível
'on':
  pull_request: null
  push:
    branches:
    - main
    - codex/temas-v*
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Baixar o repositório
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: 'tools/requirements-dev.txt

          tools/requirements-temas-dev.txt

          '
    - name: Configurar Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Instalar dependências de teste
      run: python -m pip install -r tools/requirements-dev.txt
    - name: Instalar dependências do compositor V06
      run: 'npm install --global pnpm@10.34.5

        pnpm --dir tools/readme_visuals install --frozen-lockfile

        '
    - name: Preparar derivado local do SHA
      run: 'python -B tools/validate_assistant.py --conferir-readme

        python -B tools/render_simulado.py --write

        python -B tools/render_simulado.py --check

        '
    - name: Executar o gate sem credenciais
      run: python tools/ci_local.py
  temas-widgets:
    name: temas-widgets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: 'tools/requirements-dev.txt

          tools/requirements-temas-dev.txt

          ambiente_databricks/.assistant/hub_padroes/identidade_visual/databricks_app/requirements.txt

          '
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Dependências do perfil
      run: 'python -m pip install -r tools/requirements-dev.txt ''ipywidgets>=8,<9''

        npm install --global pnpm@10.34.5

        pnpm --dir tools/readme_visuals install --frozen-lockfile

        '
    - name: Gerar e conferir saída ignorada
      run: 'python -B tools/validate_assistant.py --conferir-readme

        python -B tools/render_simulado.py --write

        python -B tools/render_simulado.py --check

        '
    - name: Suíte cumulativa por ambiente equivalente
      run: python -B -m unittest discover -s tools/tests -p 'test_temas*.py' -v
  temas-widgets-app:
    name: temas-widgets-app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_DATE_EPOCH: '1700000000'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
