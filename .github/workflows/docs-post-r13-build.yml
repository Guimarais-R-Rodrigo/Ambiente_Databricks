name: Reconciliacao documental pos-R13 D01-D04

on:
  push:
    branches: [codex/docs-post-r13-d01-d04]

permissions:
  contents: write

jobs:
  reconciliar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Aplicar D01-D04 e renderizar
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "99e01012c26621539b4379ca301e4782765f68c0"
          for f in .github/tmp_post_r13/apply_*.py; do python "$f"; done
          python tools/render_simulado.py --write
          cp .github_snapshot_post_r13.py /tmp/snapshot_post_r13.py
          cp .github_guard_post_r13.py /tmp/guard_post_r13.py
          rm -rf .github/tmp_post_r13 .github/workflows/docs-post-r13-build.yml .github_snapshot_post_r13.py .github_guard_post_r13.py
          git add -A
          git diff --cached --check
      - name: Instalar dependencias
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Validar e atualizar snapshot
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_assistant.py | tee /tmp/postr13-validator.txt
          python /tmp/snapshot_post_r13.py
          git add README.md
          python tools/validate_assistant.py --conferir-readme
          python /tmp/guard_post_r13.py
          python tools/ci_local.py | tee /tmp/postr13-ci.txt
          git add -A
          git diff --cached --check
      - name: Publicar candidata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(post-r13): reconciliar documentacao viva D01-D04 (ChatGPT)'
          git push origin HEAD:codex/docs-post-r13-d01-d04
