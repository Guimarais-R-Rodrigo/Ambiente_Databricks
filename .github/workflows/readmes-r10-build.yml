name: Freeze tecnico READMEs R10

on:
  push:
    branches: [codex/readmes-r10]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Confirmar base e materializar R10
        shell: bash
        run: |
          set -euo pipefail
          BASE=d412acb750ce0f4011f97416c74fe7a685863772
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          python docs/sprints/readmes_objetos/evidencias_r10/aplicar_r10.py
          python tools/render_simulado.py --write
          rm .github/workflows/readmes-r10-build.yml
          git add -A
          git diff --cached --check
      - name: Instalar dependencias
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Validar e atualizar snapshot real
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_assistant.py | tee /tmp/r10-validator.txt
          python docs/sprints/readmes_objetos/evidencias_r10/aplicar_r10.py --snapshot /tmp/r10-validator.txt
          python tools/validate_assistant.py --conferir-readme
      - name: Preservacao e escopo R10
        shell: bash
        run: |
          set -euo pipefail
          BASE=d412acb750ce0f4011f97416c74fe7a685863772
          objs="comparar_tabelas cross_eda data_quality eda_completa feature_engineering stat_check"
          for o in $objs; do
            git diff --exit-code "$BASE" -- "ambiente_fonte/.assistant/hub_prompts/$o/$o.md"
            grep -Fq 'Guia local: [`README.md`](./README.md)' "ambiente_fonte/.assistant/hub_prompts/$o/exemplo_$o.py"
          done
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base='d412acb750ce0f4011f97416c74fe7a685863772'
          root=Path('.')
          objs='comparar_tabelas cross_eda data_quality eda_completa feature_engineering stat_check'.split()
          for o in objs:
              p=f'ambiente_fonte/.assistant/hub_prompts/{o}/exemplo_{o}.py'
              old=subprocess.check_output(['git','show',f'{base}:{p}'],text=True)
              new=(root/p).read_text()
              executable=lambda s:'\n'.join(x for x in s.splitlines() if not x.startswith('# MAGIC'))
              assert executable(old)==executable(new), p
          ctl=json.loads((root/'docs/sprints/readmes_objetos/CONTROLE_MIGRACAO.json').read_text())
          assert len(ctl['pending'])==9, ctl['pending']
          assert all(v['sprint']=='R11' for v in ctl['pending'].values())
          PY
          diff -qr ambiente_fonte/.assistant Novo_Ambiente_Simulado/Users/usuario-free/.assistant
          cmp ambiente_fonte/.assistant_instructions.md Novo_Ambiente_Simulado/Users/usuario-free/.assistant_instructions.md
          git diff --cached --check
          git diff --check
      - name: Gate permanente
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_local.py | tee /tmp/r10-ci.txt
      - name: Registrar evidencia e publicar candidata
        shell: bash
        run: |
          set -euo pipefail
          BASE=d412acb750ce0f4011f97416c74fe7a685863772
          E=docs/sprints/readmes_objetos/evidencias_r10/FREEZE_R10.txt
          {
            echo 'R10 — freeze tecnico'
            echo "base=$BASE"
            echo "workflow_source=${GITHUB_SHA}"
            python --version
            echo
            echo '== validator =='
            cat /tmp/r10-validator.txt
            echo
            echo '== ci_local =='
            cat /tmp/r10-ci.txt
            echo
            echo 'Preservacao: 6 briefings sem diff; codigo nao-Markdown dos 6 notebooks igual a base; simulado byte a byte; 9 pendencias R11.'
          } > "$E"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(r10): freeze tecnico da leva (ChatGPT)'
          git push origin HEAD:codex/readmes-r10
