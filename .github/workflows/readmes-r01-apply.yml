name: Integracao verificada R01

on:
  push:
    branches: [codex/readmes-r01]
    paths: [.github/workflows/readmes-r01-apply.yml]

permissions:
  contents: read

jobs:
  aplicar:
    if: github.ref == 'refs/heads/codex/readmes-r01'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_SOURCE: '399bb553b250e5f7fcb8d727b829bb25678bbda2'
      EXPECTED_TREE: 'fa56632456b795a1f0ea572274f428b876f713bd'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferir base e reconstruir patch revisado
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          parts = sorted(Path('.github/readmes-r01-transport').glob('part-*.txt'))
          if len(parts) != 7:
              raise SystemExit('Transporte incompleto')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          packed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(packed).hexdigest() != '53f673a10cbaacbe0451c97173a039a814bb7e324c9da0139bb2aa12442272b5':
              raise SystemExit('Hash XZ divergente')
          patch = lzma.decompress(packed)
          if hashlib.sha256(patch).hexdigest() != 'd3a8028737c3a9997fcff902388e10742a293125f80510c2fb46c2e1c8d40c58':
              raise SystemExit('Hash patch divergente')
          Path(os.environ['RUNNER_TEMP'], 'R01.patch').write_bytes(patch)
          print('Hashes XZ e patch conferidos')
          PY
          git apply --check "$RUNNER_TEMP/R01.patch"
          git apply --index "$RUNNER_TEMP/R01.patch"
          git rm -r .github/readmes-r01-transport .github/workflows/readmes-r01-apply.yml
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
          echo "Arvore identica ao lote testado localmente: $EXPECTED_TREE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Instalar dependencias do gate existente
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Validar antes de registrar
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/r01-gate-precommit.txt"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - name: Registrar e validar historico sem alterar main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Codex'
          git config user.email 'codex@example.invalid'
          git commit -m 'feat(docs): Sprint R01 fundamentos de READMEs de objeto (Codex)'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/r01-gate-poscommit.txt"
          git diff --exit-code
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git push origin HEAD:refs/heads/codex/readmes-r01
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result = {
              'branch': 'codex/readmes-r01',
              'commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'tree': os.environ['EXPECTED_TREE'],
              'source': os.environ['EXPECTED_SOURCE'],
              'gate_precommit': 'PASS', 'gate_poscommit': 'PASS',
              'main_alterada': False, 'databricks_publicado': False,
          }
          Path(os.environ['RUNNER_TEMP'], 'R01-publicacao.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False))
          PY
      - name: Guardar evidencias desta integracao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r01-evidencias-integracao
          path: |
            ${{ runner.temp }}/r01-gate-precommit.txt
            ${{ runner.temp }}/r01-gate-poscommit.txt
            ${{ runner.temp }}/R01-publicacao.json
          retention-days: 7
          if-no-files-found: warn
