name: Consumidores e formatos V07
on:
  push:
    branches: [main, 'codex/temas-v07*']
  pull_request:
    paths:
      - 'ambiente_fonte/.assistant/hub_snippets/display/**'
      - 'ambiente_fonte/.assistant/hub_snippets/ml/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/theme_plotly/**'
      - 'Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/display/**'
      - 'Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/ml/**'
      - 'Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/visual/theme_plotly/**'
      - 'tools/tests/test_temas_v07*.py'
      - 'docs/sprints/sistema_temas/V07/**'
      - '.github/workflows/temas-v07-ci.yml'
permissions:
  contents: write
jobs:
  consumidores-v07:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SOURCE_DATE_EPOCH: '1700000000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Sincronizar semântica divergente da correlação (transitório)
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/temas-v07-consumidores-formatos-20260914'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source_root = Path('ambiente_fonte/.assistant')
          mirror_root = Path('Novo_Ambiente_Simulado/Users/usuario-free/.assistant')
          rel_code = Path('hub_snippets/display/correlation_matrix/correlation_matrix.py')
          rel_readme = Path('hub_snippets/display/correlation_matrix/README.md')

          source_code = (source_root / rel_code).read_bytes()
          (mirror_root / rel_code).write_bytes(source_code)

          old_note = '`palette.sequential` somente na escala de cor'
          new_note = '`palette.diverging` somente na escala de cor'
          old_sentence = 'O tema não troca essa escala automaticamente.'
          new_sentence = 'A rota legada não troca essa escala automaticamente; a rota `_resolvido` usa `palette.diverging` com o mesmo domínio simétrico de −1 a +1.'
          for root in (source_root, mirror_root):
              path = root / rel_readme
              text = path.read_text(encoding='utf-8')
              if old_note in text:
                  if text.count(old_note) != 1:
                      raise SystemExit(f'{path}: OLD_NOTE_COUNT={text.count(old_note)}')
                  text = text.replace(old_note, new_note, 1)
              elif text.count(new_note) != 1:
                  raise SystemExit(f'{path}: NEW_NOTE_COUNT={text.count(new_note)}')
              if old_sentence in text:
                  if text.count(old_sentence) != 1:
                      raise SystemExit(f'{path}: OLD_SENTENCE_COUNT={text.count(old_sentence)}')
                  text = text.replace(old_sentence, new_sentence, 1)
              elif text.count(new_sentence) != 1:
                  raise SystemExit(f'{path}: NEW_SENTENCE_COUNT={text.count(new_sentence)}')
              path.write_text(text, encoding='utf-8')

          registry_path = Path('docs/sprints/sistema_temas/V07/CONSUMIDORES.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          controls = registry['controls_v07']
          if 'palette.diverging' not in controls:
              idx = controls.index('palette.categorical') + 1
              controls.insert(idx, 'palette.diverging')
          correlation = next(item for item in registry['consumers'] if item['id'] == 'display.correlation_matrix')
          correlation['tokens'] = ['palette.diverging']
          correlation['reason'] = 'Heatmap possui domínio simétrico de -1 a +1; a rota temática usa a paleta divergente e mantém cálculo Spark e pares fortes compartilhados.'
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = Path('tools/tests/test_temas_v07_mirror.py')
          test_text = test_path.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n'
          semantic = '''\n\nclass SemanticPaletteTests(unittest.TestCase):\n    def test_correlation_uses_diverging_palette(self):\n        text = (SOURCE / "hub_snippets/display/correlation_matrix/correlation_matrix.py").read_text(encoding="utf-8")\n        self.assertIn('tokens["palette.diverging"]', text)\n        self.assertNotIn('tokens["palette.sequential"]', text)\n'''
          if 'class SemanticPaletteTests' not in test_text:
              if test_text.count(marker) != 1:
                  raise SystemExit(f'V07_TEST_MARKER_COUNT={test_text.count(marker)}')
              test_text = test_text.replace(marker, semantic + marker, 1)
              test_path.write_text(test_text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/display/correlation_matrix/correlation_matrix.py
          git add ambiente_fonte/.assistant/hub_snippets/display/correlation_matrix/README.md
          git add Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/display/correlation_matrix/README.md
          git add docs/sprints/sistema_temas/V07/CONSUMIDORES.json tools/tests/test_temas_v07_mirror.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix(v07): alinhar correlação à paleta divergente"
            git push origin HEAD:codex/temas-v07-consumidores-formatos-20260914
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências Python de temas e regressões
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python -m pip install 'ipywidgets>=8,<9'
      - name: Dependências do compositor V06
        run: |
          npm install --global pnpm@10.34.5
          pnpm --dir tools/readme_visuals install --frozen-lockfile
      - name: V07 — consumidores, invariância e formatos
        run: python -B -m unittest discover -s tools/tests -p 'test_temas_v07*.py' -v
      - name: Regressões de temas V01–V07
        run: python -B -m unittest discover -s tools/tests -p 'test_temas*.py' -v
      - name: Compatibilidade visual V00
        run: python -B tools/tests/test_visual_legado_v00.py
      - name: Validação estrutural e documental
        run: python -B tools/validate_assistant.py --conferir-readme
      - name: Escopo
        run: echo 'V07 integra consumidores runtime e HTML Plotly local; não publica Databricks, não homologa PNG/PDF/PPTX/browser e mantém SHAP/Kaplan como exceções explícitas.'
