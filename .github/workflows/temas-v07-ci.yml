name: Consumidores e formatos V07
on:
  push:
    branches: [main, 'codex/temas-v07*']
  pull_request:
    paths:
      - 'ambiente_fonte/.assistant/hub_snippets/display/**'
      - 'ambiente_fonte/.assistant/hub_snippets/ml/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/theme_plotly/**'
      - 'Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/display/**'
      - 'Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/ml/**'
      - 'Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/visual/theme_plotly/**'
      - 'tools/tests/test_temas_v07*.py'
      - 'docs/sprints/sistema_temas/V07/**'
      - '.github/workflows/temas-v07-ci.yml'
permissions:
  contents: write
jobs:
  consumidores-v07:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SOURCE_DATE_EPOCH: '1700000000'
      V07_CHANGELOG_ENTRY_B64: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconciliar README e changelog da candidata V07
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/temas-v07-consumidores-formatos-20260914'
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          replacements = [
              ('repo (identidade)  : 1339 arquivos varridos no repositório editável/derivado', 'repo (identidade)  : 1345 arquivos varridos no repositório editável/derivado'),
              ('repo (links)       : 1840 links fora da raiz analisada', 'repo (links)       : 1849 links fora da raiz analisada'),
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'README_OLD_COUNT={old}:{text.count(old)}')
                  text = text.replace(old, new, 1)
                  changed = True
              elif text.count(new) != 1:
                  raise SystemExit(f'README_EXPECTED_VALUE_NOT_FOUND={new}')
          if changed:
              readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          history = changelog.read_text(encoding='utf-8')
          marker = '## 2026-09-14 — V06: integração Git e fechamento técnico (ChatGPT)'
          title = '## 2026-09-14 — V07: candidata de consumidores e formatos de saída (ChatGPT)'
          if title not in history:
              if history.count(marker) != 1:
                  raise SystemExit(f'V07_CHANGELOG_MARKER_COUNT={history.count(marker)}')
              entry = base64.b64decode(os.environ['V07_CHANGELOG_ENTRY_B64']).decode('utf-8')
              history = history.replace(marker, entry + '\n' + marker, 1)
              changelog.write_text(history, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "docs(v07): reconciliar métricas e changelog da candidata"
            git push origin HEAD:codex/temas-v07-consumidores-formatos-20260914
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências Python de temas e regressões
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python -m pip install 'ipywidgets>=8,<9'
      - name: Dependências do compositor V06
        run: |
          npm install --global pnpm@10.34.5
          pnpm --dir tools/readme_visuals install --frozen-lockfile
      - name: V07 — consumidores, invariância e formatos
        run: python -B -m unittest discover -s tools/tests -p 'test_temas_v07*.py' -v
      - name: Regressões de temas V01–V07
        run: python -B -m unittest discover -s tools/tests -p 'test_temas*.py' -v
      - name: Compatibilidade visual V00
        run: python -B tools/tests/test_visual_legado_v00.py
      - name: Validação estrutural e documental
        run: python -B tools/validate_assistant.py --conferir-readme
      - name: Escopo
        run: echo 'V07 integra consumidores runtime e HTML Plotly local; não publica Databricks, não homologa PNG/PDF/PPTX/browser e mantém SHAP/Kaplan como exceções explícitas.'
