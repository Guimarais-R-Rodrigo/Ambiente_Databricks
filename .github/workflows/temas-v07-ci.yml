name: Consumidores e formatos V07
# Receita manual de compatibilidade. Execução automática: ci.yml (DAG compartilhado).
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  consumidores-v07:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SOURCE_DATE_EPOCH: '1700000000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar derivado local do SHA
        run: |
          python -B tools/render_simulado.py --write
          python -B tools/render_simulado.py --check
      - name: Dependências Python de temas e regressões
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python -m pip install 'ipywidgets>=8,<9'
      - name: Dependências do compositor V06
        run: |
          npm install --global pnpm@10.34.5
          pnpm --dir tools/readme_visuals install --frozen-lockfile
      - name: V07 — consumidores, invariância e formatos
        run: python -B -m unittest discover -s tools/tests -p 'test_temas_v07*.py' -v
      - name: Regressões de temas V01–V07
        run: python -B -m unittest discover -s tools/tests -p 'test_temas*.py' -v
      - name: Compatibilidade visual V00
        run: python -B tools/tests/test_visual_legado_v00.py
      - name: Validação estrutural e documental
        run: python -B tools/validate_assistant.py --conferir-readme
      - name: Escopo
        run: echo 'V07 integra consumidores runtime e HTML Plotly local; não publica Databricks, não homologa PNG/PDF/PPTX/browser e mantém SHAP/Kaplan como exceções explícitas.'
