name: Reconciliacao documental V08
on:
  push:
    branches:
      - 'codex/temas-v08*'
permissions:
  contents: write
jobs:
  reconciliar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Aplicar reconciliação V08
        run: |
          python tools/v08_reconcile_state.py
          rm tools/v08_reconcile_state.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "docs(v08): reconciliar índices e changelog da candidata"
            git push origin HEAD:codex/temas-v08-integracao-transversal-20260914
          fi
