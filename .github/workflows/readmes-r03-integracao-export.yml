name: Exportar arvore validada R03-V01
on:
  push:
    branches: [codex/readmes-r03-integracao]
    paths: [.github/workflows/readmes-r03-integracao-export.yml]
permissions:
  contents: read
jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      R03B: d61fedbf111075aa3f238b46d2d64834b185bc10
      MAIN: 836f23684cf76ee1f3d7898d44acb70d32a7ff59
      EXPECTED_PARENT: 3abc6e5a526b35b90c759cbd2d82ec992adf9220
      TESTED_RUN: '34712073970'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruir exatamente a composicao validada
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          set +e
          git -c merge.conflictStyle=diff3 merge-tree --write-tree --name-only "$R03B" "$MAIN" > "$RUNNER_TEMP/merge-tree.txt" 2> "$RUNNER_TEMP/merge-tree.err"
          rc=$?
          set -e
          test "$rc" = 1
          python - <<'PY'
          import os
          from pathlib import Path
          lines=Path(os.environ['RUNNER_TEMP'],'merge-tree.txt').read_text().splitlines()
          tree=lines[0]; conflicts=[]
          for line in lines[1:]:
              if not line: break
              conflicts.append(line)
          expected={'CHANGELOG.md','README.md','docs/sprints/README.md'}
          if set(conflicts)!=expected: raise SystemExit(f'Conflitos inesperados: {conflicts}')
          Path(os.environ['RUNNER_TEMP'],'auto-tree.txt').write_text(tree+'\n')
          print('AUTO_TREE',tree,'CONFLICTS',sorted(conflicts))
          PY
          git read-tree --reset -u "$(cat "$RUNNER_TEMP/auto-tree.txt")"
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          R03=os.environ['R03B']; MAIN=os.environ['MAIN']
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          intro='# Changelog\n\nToda mudança relevante deste projeto é registrada aqui, em entradas curtas, sem\nexpor identificadores corporativos, PII ou segredos. Formato: seções por data,\nsubseções Adicionado/Atualizado/Corrigido/Removido, cada item com a IA autora\nentre parênteses. Template: `.claude/templates/changelog-entry.md`.\n\n'
          marker='## 2026-09-12 — V00: reconciliação e aceite de integração Git (Codex)'
          r03=show(R03,'CHANGELOG.md'); main=show(MAIN,'CHANGELOG.md')
          assert r03.startswith(intro) and main.startswith(intro) and marker in r03 and marker in main
          entry='''## 2026-09-12 — R03-I: reconciliação READMEs com V01 integrada (ChatGPT)\n\n### Atualizado\n\n- (ChatGPT) R03-A/R03-B reconciliadas com a `main` que já contém V01 e seu alinhamento documental; três conflitos textuais resolvidos sem descartar qualquer iniciativa.\n- (ChatGPT) Estado agregado do README raiz recalculado pela execução real; índice de sprints registra simultaneamente a continuidade dos READMEs e o estado aceito/integrado de V00/V01.\n\n### Notas\n\n- (ChatGPT) Integração autorizada explicitamente por Rodrigo; árvore combinada revalidada antes do merge. Evidências anteriores permanecem vinculadas às árvores em que foram produzidas.\n- (ChatGPT) Sem publicação Databricks, mudança funcional, V02 ou R04-A nesta reconciliação. Auditoria independente e homologações operacionais permanecem separadas.\n\n'''
          Path('CHANGELOG.md').write_text(intro+entry+r03[len(intro):r03.index(marker)]+main[len(intro):main.index(marker)]+main[main.index(marker):],encoding='utf-8')
          Path('README.md').write_text(show(R03,'README.md'),encoding='utf-8')
          s_r03=show(R03,'docs/sprints/README.md'); s_main=show(MAIN,'docs/sprints/README.md'); theme='## Sistema de Temas do Hub'
          assert theme in s_main
          if theme in s_r03: s_r03=s_r03[:s_r03.index(theme)]
          sec='''## Integração READMEs com a main V01 — 2026-09-12\n\nRodrigo autorizou a reconciliação e integração das R03-A/R03-B com a `main` que já contém V01. A candidata preserva os 19 READMEs operacionais, o contrato 1.0.0 e a documentação/guardas do sistema de temas. Registro em [`INTEGRACAO_R03_V01.md`](readmes_objetos/INTEGRACAO_R03_V01.md).\n\n'''
          Path('docs/sprints/README.md').write_text(s_r03.rstrip()+'\n\n'+sec+s_main[s_main.index(theme):],encoding='utf-8')
          Path('docs/sprints/readmes_objetos/INTEGRACAO_R03_V01.md').write_text('''# Integração R03-A/R03-B com a main V01\n\n## Estado\n\nReconciliação e integração autorizadas explicitamente por Rodrigo em 12/09/2026. A bateria completa da composição foi executada no run `34712073970`; este passo apenas materializa remotamente a mesma árvore determinística já validada.\n\n## Bases\n\n- R03-B acumulada: `d61fedbf111075aa3f238b46d2d64834b185bc10`.\n- main com V01 aceita/integrada e alinhamento documental: `836f23684cf76ee1f3d7898d44acb70d32a7ff59`.\n- R03-B já contém a R03-A e o contrato de README 1.0.0.\n\n## Conflitos e resolução\n\nA composição encontrou somente `CHANGELOG.md`, `README.md` e `docs/sprints/README.md` em conflito. O changelog preserva as entradas exclusivas das duas frentes e uma única cópia do histórico comum; o README preserva a narrativa R03 e recebe contagens recalculadas; o índice de sprints preserva R03 e o estado vigente de V00/V01.\n\n## Preservação\n\nADR-0013, contrato, fixtures, verificadores, testes e workflow V01 permanecem byte a byte iguais à main. Os 19 READMEs operacionais, três exemplares, contrato 1.0.0, conteúdo de produto/espelho e controle de migração permanecem iguais à R03-B. Nenhum helper, API, paleta/CSS, formulário, skill ou objeto analítico é alterado pela integração.\n\n## Limites\n\nSem publicação Databricks, V02 ou R04-A. Sete testes opcionais Spark do gate continuam SKIP, não PASS. Auditoria independente e homologações operacionais continuam separadas.\n''',encoding='utf-8')
          PY
          git checkout "$MAIN" -- .github/workflows/temas-v01-ci.yml docs/decisions/ADR-0013-sistema-de-temas.md docs/sprints/sistema_temas/V01 docs/testes/sistema_temas/V01 tools/requirements-temas-dev.txt tools/temas_v01_contract.py tools/tests/test_temas_v01.py tools/tests/test_temas_v01_integracao.py
          git checkout "$R03B" -- ambiente_fonte/.assistant Novo_Ambiente_Simulado MANUAL_TECNICO.md tools/readme_objeto_contract.py tools/tests/test_readme_objeto_contract.py tools/tests/test_readme_integracao.py docs/sprints/readmes_objetos/CONTROLE_MIGRACAO.json
          git add -A
          python tools/validate_assistant.py 2>&1 | tee "$RUNNER_TEMP/contagens.txt"
          python - <<'PY'
          import os,re
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'],'contagens.txt').read_text()
          labels=['skills','prompts','helpers citados','markdown / links','notebooks / links','readmes de objeto','pastas de objeto','forma da pasta','contrato de dados','contrato de entrada','saída colada','idioma da docstring','normas do molde','notebook exercita','python (AST)','instrucoes','repo (identidade)','repo (links)']
          lines=[]
          for label in labels:
              m=re.search(rf'^{re.escape(label)}\s*:.*$',out,re.M)
              if not m: raise SystemExit('Contagem ausente: '+label)
              lines.append(m.group(0))
          status=re.search(r'^APROVADO:.*$',out,re.M)
          if not status: raise SystemExit('Composição reprovada')
          p=Path('README.md'); text=p.read_text(); anchor='### Estado verificável do gate local'; start=text.index('```text',text.index(anchor)); end=text.index('```',start+7)
          p.write_text(text[:start]+'```text\n'+'\n'.join(lines)+'\n\n'+status.group(0)+'\n```'+text[end+3:],encoding='utf-8')
          PY
          git add -A
          git diff --exit-code "$MAIN" -- .github/workflows/temas-v01-ci.yml docs/decisions/ADR-0013-sistema-de-temas.md docs/sprints/sistema_temas/V01 docs/testes/sistema_temas/V01 tools/requirements-temas-dev.txt tools/temas_v01_contract.py tools/tests/test_temas_v01.py tools/tests/test_temas_v01_integracao.py
          git diff --exit-code "$R03B" -- ambiente_fonte/.assistant Novo_Ambiente_Simulado MANUAL_TECNICO.md tools/readme_objeto_contract.py tools/tests/test_readme_objeto_contract.py tools/tests/test_readme_integracao.py docs/sprints/readmes_objetos/CONTROLE_MIGRACAO.json
      - name: Registrar a arvore no GitHub e criar commit de merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          MAIN=os.environ['MAIN']; R03=os.environ['R03B']; head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          def git(*args): return subprocess.check_output(['git',*args])
          local_tree=git('write-tree').decode().strip(); main_tree=git('rev-parse',f'{MAIN}^{{tree}}').decode().strip()
          raw=git('diff','--cached','--no-renames','--name-status','-z',MAIN).decode().split('\0')
          entries=[]; i=0
          while i<len(raw) and raw[i]:
              status=raw[i]; path=raw[i+1]; i+=2
              if status in ('A','M'):
                  stage=git('ls-files','--stage','--',path).decode().split()
                  if not stage: raise SystemExit('Sem stage para '+path)
                  entries.append({'path':path,'mode':stage[0],'type':'blob','content':Path(path).read_text(encoding='utf-8')})
              elif status=='D':
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
              else: raise SystemExit(f'Status inesperado {status} {path}')
          api=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          def post(route,payload):
              req=urllib.request.Request(api+route,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=90) as r:return json.load(r)
          remote_tree=post('/git/trees',{'base_tree':main_tree,'tree':entries})['sha']
          if remote_tree!=local_tree: raise SystemExit(f'Tree divergente local={local_tree} remoto={remote_tree}')
          commit=post('/git/commits',{'tree':remote_tree,'parents':[head,MAIN],'message':'docs(r03i): integra R03-A/B com V01 apos revalidacao completa (ChatGPT)\n\nComposição autorizada por Rodrigo. Preserva V01 e os 19 READMEs/contrato 1.0.0, resolve três agregadores e usa a árvore validada no run 34712073970. Sem Databricks, V02 ou R04-A.'})
          result={'commit':commit['sha'],'tree':remote_tree,'parents':[head,MAIN],'changed_paths_vs_main':len(entries),'tested_run':os.environ['TESTED_RUN'],'export_run':os.environ['GITHUB_RUN_ID'],'databricks_publicado':False}
          Path(os.environ['RUNNER_TEMP'],'R03I-export.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          Path(os.environ['RUNNER_TEMP'],'changed-paths.txt').write_text('\n'.join(e['path'] for e in entries)+'\n')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r03i-exportacao
          retention-days: 7
          path: |
            ${{ runner.temp }}/merge-tree.txt
            ${{ runner.temp }}/merge-tree.err
            ${{ runner.temp }}/contagens.txt
            ${{ runner.temp }}/R03I-export.json
            ${{ runner.temp }}/changed-paths.txt
          if-no-files-found: warn
