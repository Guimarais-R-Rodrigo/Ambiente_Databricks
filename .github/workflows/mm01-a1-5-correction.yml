name: MM01 quinta A1 - correcao transitoria

on:
  push:
    branches:
      - micromodelos/mm01-contrato-canonico
    paths:
      - .github/workflows/mm01-a1-5-correction.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch MM01
        uses: actions/checkout@v4
        with:
          ref: micromodelos/mm01-contrato-canonico
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Aplicar correcao da quinta A1
        run: python -B .github/scripts/mm01_a1_5_correction.py

      - name: Remover artefatos transitorios
        run: |
          git rm .github/workflows/mm01-a1-5-correction.yml
          git rm .github/scripts/mm01_a1_5_correction.py
          git add -A

      - name: Instalar dependencias
        run: python -m pip install -r tools/requirements-dev.txt

      - name: Executar suite MM01 ampliada
        run: python -B -m unittest tools/tests/test_micromodelo_mm01.py -v

      - name: Executar gate estrutural
        run: python -B tools/validate_assistant.py --root ambiente_fonte

      - name: Conferir fronteiras e metrica
        run: |
          test ! -e .github/workflows/mm01-a1-5-correction.yml
          test ! -e .github/scripts/mm01_a1_5_correction.py
          test -z "$(git diff --name-only --cached | grep '^ambiente_fonte/.assistant/' || true)"
          test -z "$(git diff --name-only --cached | grep '^CHANGELOG.md$' || true)"
          test -z "$(git diff --name-only --cached | grep '^tools/micromodelo_mm01_contract.py$' || true)"
          grep -Fq 'repo (identidade)  : 1426 arquivos varridos no repositório editável/derivado' README.md
          grep -Fq 'contém **34 métodos de teste**' docs/sprints/micromodelos/MM01/TESTES.md
          grep -Fq 'sexta A1' docs/sprints/micromodelos/MM01/CHECKPOINT.md

      - name: Marcar reteste de construcao verde
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'docs/sprints/micromodelos/MM01/CHECKPOINT.md',
              'docs/sprints/micromodelos/MM01/README.md',
          ]:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('RETESTE DE CONSTRUÇÃO EM EXECUÇÃO', 'RETESTE DE CONSTRUÇÃO VERDE')
              path.write_text(text, encoding='utf-8')
          PY
          git add docs/sprints/micromodelos/MM01/CHECKPOINT.md docs/sprints/micromodelos/MM01/README.md
          python -B tools/validate_assistant.py --root ambiente_fonte

      - name: Publicar correcao permanente
        run: |
          git config user.name 'Rodrigo'
          git config user.email 'guimarais.r.rodrigo@gmail.com'
          git commit -m 'fix(mm01): completar autoridade material-text apos quinta A1'
          git push origin HEAD:micromodelos/mm01-contrato-canonico
