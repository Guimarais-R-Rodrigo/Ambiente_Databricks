name: MM00 reconciliar índice transitório

on:
  push:
    branches:
      - micromodelos/mm00-fechamento-pos-merge

permissions:
  contents: write

jobs:
  reconciliar-indice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Substituir apenas o bloco de micromodelos
        shell: bash
        env:
          NEW_BLOCK_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os
          path = Path('docs/sprints/README.md')
          raw = path.read_bytes()
          start_marker = '## Framework de Micromodelos — MM00 em execução'.encode('utf-8')
          end_marker = '## Sistema de Temas do Hub'.encode('utf-8')
          start = raw.index(start_marker)
          end = raw.index(end_marker, start)
          new_block = base64.b64decode(os.environ['NEW_BLOCK_B64'])
          before, after = raw[:start], raw[end:]
          path.write_bytes(before + new_block + after)
          reread = path.read_bytes()
          assert reread[:start] == before
          assert reread[start:start + len(new_block)] == new_block
          assert reread[start + len(new_block):] == after
          PY

      - name: Verificar escopo e auto-remover workflow transitório
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sprints/README.md
          git rm .github/workflows/mm00-reconciliar-indice-transitorio.yml
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/mm00-reconciliar-indice-transitorio.yml docs/sprints/README.md "
          git commit -m "MM00 — reconciliar índice global pós-merge"
          git push origin HEAD:micromodelos/mm00-fechamento-pos-merge
