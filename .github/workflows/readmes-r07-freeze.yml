name: Freeze R07 score vintage e sobrevivencia
on:
  push:
    branches: [codex/readmes-r07]
    paths: [.github/workflows/readmes-r07-freeze.yml]
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BASE_COMMIT: 289731c79e8ed43d82b39d61cdc41ba2e69ea717
      BASE_TREE: 481472738a97495bb63e01ab95ba41843abbe33b
      EXPECTED_PARENT: aa18a1faf62631093cb3f035e4f2237ec06cd7a8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar integracao editorial fail-closed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python docs/sprints/readmes_objetos/evidencias_r07/aplicar_r07.py
          cp ambiente_fonte/.assistant/MANUAL_TECNICO.md MANUAL_TECNICO.md
          python tools/render_simulado.py --write
          git rm .github/workflows/readmes-r07-freeze.yml
          git add -A
          python tools/validate_assistant.py > "$RUNNER_TEMP/validator-pre.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'],'validator-pre.txt').read_text()
          keys=['skills','prompts','helpers citados','markdown / links','notebooks / links','readmes de objeto','pastas de objeto','forma da pasta','contrato de dados','contrato de entrada','saída colada','idioma da docstring','normas do molde','notebook exercita','python (AST)','instrucoes','repo (identidade)','repo (links)']
          actual={}
          for line in out.splitlines():
              for key in keys:
                  if line.startswith(key): actual[key]=line
          assert set(actual)==set(keys),set(keys)-set(actual)
          assert '49/75 operacionais' in actual['readmes de objeto'] and '26 pendentes' in actual['readmes de objeto'],actual['readmes de objeto']
          p=Path('README.md'); lines=p.read_text(encoding='utf-8').splitlines(); found=set()
          for i,line in enumerate(lines):
              for key,value in actual.items():
                  if line.startswith(key): lines[i]=value; found.add(key); break
          assert found==set(keys),set(keys)-found
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git add -A
          git diff --cached --check "$BASE_COMMIT"
          git write-tree | tee "$RUNNER_TEMP/tree-pre.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-dev.txt
            tools/requirements-temas-dev.txt

      - name: Gate vigente V00-V03 e preservacao
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-dev.txt -r tools/requirements-temas-dev.txt >/dev/null
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/gate.txt"
          for suite in test_inventario_visual test_visual_legado_v00 test_baseline_visual_runner test_temas_v01 test_temas_v01_integracao test_temas_v02 test_temas_v03; do python "tools/tests/$suite.py"; done
          python docs/sprints/readmes_objetos/evidencias_r07/verificar_preservacao.py 2>&1 | tee "$RUNNER_TEMP/preservacao.txt"
          python docs/sprints/readmes_objetos/evidencias_r07/verificar_r07.py 2>&1 | tee "$RUNNER_TEMP/r07-base.txt"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tree-pre.txt")"
          git diff --exit-code

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Criar ambiente isolado R07
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/r07-env"
          PY="$RUNNER_TEMP/r07-env/bin/python"
          "$PY" -m pip install --upgrade pip >/dev/null
          "$PY" -m pip install "lifelines==0.30.3" "pyspark==4.0.1" "plotly>=5,<7" >/dev/null
          "$PY" -m pip freeze > "$RUNNER_TEMP/r07-pacotes.txt"

      - name: Executar suite R07 com runtime real
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r07-work"
          (cd "$RUNNER_TEMP/r07-work" && "$RUNNER_TEMP/r07-env/bin/python" "$GITHUB_WORKSPACE/docs/sprints/readmes_objetos/evidencias_r07/verificar_r07.py" --require-runtime) 2>&1 | tee "$RUNNER_TEMP/r07.txt"
          ! grep -qi 'FAILED' "$RUNNER_TEMP/r07.txt"
          ! grep -qi 'skipped=' "$RUNNER_TEMP/r07.txt"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tree-pre.txt")"

      - name: Fechar relatorio rubrica e reconferir a mesma arvore
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          log=Path(os.environ['RUNNER_TEMP'],'r07.txt').read_text()
          m=re.search(r'Ran (\d+) tests',log); assert m,log[-2500:]
          cases=int(m.group(1))
          report=Path('docs/sprints/readmes_objetos/RELATORIO_R07.md'); s=report.read_text(encoding='utf-8')
          marker=f'Workflow de fechamento: **run {os.environ["GITHUB_RUN_ID"]}**. Resultado ainda não presumido; a árvore só será materializada depois de gate, preservação e runtime R07.'
          final=f'''Workflow de fechamento: **run {os.environ['GITHUB_RUN_ID']} — success até esta etapa**. Na árvore final: gate vigente aprovado; validador 0 falhas/0 avisos; V00/V01/V02/V03 aprovadas; preservação PASS; suíte R07 **{cases}/{cases} aprovada sem skips** no ambiente isolado registrado em `r07-pacotes.txt`. Cobertura validada: **49/75 operacionais, 3/3 exemplares e 26 pendências**. A materialização ocorre somente após a reconferência abaixo.'''
          assert marker in s; report.write_text(s.replace(marker,final),encoding='utf-8')
          rubric=Path('docs/sprints/readmes_objetos/RUBRICA_R07.json'); data=json.loads(rubric.read_text(encoding='utf-8'))
          for key in ['contract_1_0_0','notebook_prose_only','implementation_unchanged','facade_unchanged','previous_readmes_preserved','migration_exactly_six_removed','repository_gate','v00','v01','v02','v03','runtime_r07','manual_mirrors']:
              data['criteria'][key]='passed_self_review'
          data['remote_run_id']=int(os.environ['GITHUB_RUN_ID'])
          data['validated_coverage']='49/75 operacionais; 3/3 exemplares; 26 pendentes'
          rubric.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add -A
          git diff --cached --check "$BASE_COMMIT"
          python tools/ci_local.py --verbose > "$RUNNER_TEMP/gate-final.txt" 2>&1
          python docs/sprints/readmes_objetos/evidencias_r07/verificar_preservacao.py > "$RUNNER_TEMP/preservacao-final.txt"
          python tools/validate_assistant.py > "$RUNNER_TEMP/validator-final.txt"
          grep -q 'APROVADO: 0 falha(s), 0 aviso(s)' "$RUNNER_TEMP/validator-final.txt"
          grep -q '49/75 operacionais' "$RUNNER_TEMP/validator-final.txt"
          git diff --exit-code
          git write-tree | tee "$RUNNER_TEMP/final-tree.txt"

      - name: Materializar exatamente a arvore final testada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args])
          final=Path(os.environ['RUNNER_TEMP'],'final-tree.txt').read_text().strip(); assert git('write-tree').decode().strip()==final
          raw=git('diff','--cached','--no-renames','--name-status','-z',os.environ['BASE_COMMIT']).decode().split('\0'); entries=[]; i=0
          while i<len(raw) and raw[i]:
              st,p=raw[i:i+2]; i+=2; assert st in ('A','M'),(st,p)
              mode=git('ls-files','--stage','--',p).decode().split()[0]
              entries.append({'path':p,'mode':mode,'type':'blob','content':Path(p).read_text(encoding='utf-8')})
          req=urllib.request.Request(os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',data=json.dumps({'base_tree':os.environ['BASE_TREE'],'tree':entries}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=90) as response: tree=json.load(response)['sha']
          assert tree==final,(tree,final)
          result={'tree':tree,'base':os.environ['BASE_COMMIT'],'paths_vs_main':len(entries),'gate':'PASS','v00':'PASS','v01':'PASS','v02':'PASS','v03':'PASS','r07_runtime':'PASS','preservacao':'PASS','coverage':'49/75','pending':26,'run_id':os.environ['GITHUB_RUN_ID'],'workflow_in_final_tree':False,'main_changed':False,'databricks_published':False}
          Path(os.environ['RUNNER_TEMP'],'R07-FINAL.json').write_text(json.dumps(result,indent=2)+'\n'); print(json.dumps(result))
          PY

      - name: Guardar evidencias mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r07-freeze-evidencias
          retention-days: 7
          path: |
            ${{ runner.temp }}/validator-pre.txt
            ${{ runner.temp }}/validator-final.txt
            ${{ runner.temp }}/gate.txt
            ${{ runner.temp }}/gate-final.txt
            ${{ runner.temp }}/preservacao.txt
            ${{ runner.temp }}/preservacao-final.txt
            ${{ runner.temp }}/r07-base.txt
            ${{ runner.temp }}/r07.txt
            ${{ runner.temp }}/r07-pacotes.txt
            ${{ runner.temp }}/final-tree.txt
            ${{ runner.temp }}/R07-FINAL.json
          if-no-files-found: warn
