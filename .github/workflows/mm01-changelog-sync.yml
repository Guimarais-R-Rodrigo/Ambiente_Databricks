name: MM01 changelog sync transitório

on:
  push:
    branches:
      - micromodelos/mm01-contrato-canonico
    paths:
      - .github/workflows/mm01-changelog-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: micromodelos/mm01-contrato-canonico
          fetch-depth: 0

      - name: Corrigir afirmação exata e remover workflow transitório
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          old = "O gate permanente executa instalação limpa, 9 testes MM01 e `validate_assistant.py --root ambiente_fonte`; CI agregado de PR e auditoria A1 permanecem pendentes."
          new = "O gate permanente executa instalação limpa, 17 métodos de teste MM01 e `validate_assistant.py --root ambiente_fonte`; a suíte inclui mutantes negativos, bypasses adversariais e caminhos positivos de publicação; auditoria A1 permanece pendente."
          if text.count(old) != 1:
              raise SystemExit(f"trecho esperado deveria ocorrer exatamente uma vez; encontrado={text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/mm01-changelog-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/mm01-changelog-sync.yml
          git diff --cached --check
          git commit -m "docs(mm01): sincronizar contagem de testes no changelog"
          git push origin HEAD:micromodelos/mm01-contrato-canonico
