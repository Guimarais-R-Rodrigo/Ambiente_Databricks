name: MM01 reparo transitório do changelog

on:
  push:
    branches:
      - micromodelos/mm01-contrato-canonico
    paths:
      - .github/workflows/mm01-repair-changelog.yml

permissions:
  contents: write

jobs:
  reparar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar changelog completo do commit anterior e corrigir somente o SHA abreviado
        env:
          SOURCE_COMMIT: 3633f0674e961d7798e7c10790f8050de75053ee
          SHORT: main@a9480391
          FULL: main@a9480391c78e2402986885db0ce08b10e0619a1a
        run: |
          git show "${SOURCE_COMMIT}:CHANGELOG.md" > /tmp/changelog-before
          python - <<'PY'
          import os
          from pathlib import Path

          before = Path('/tmp/changelog-before').read_bytes()
          short = os.environ['SHORT'].encode('utf-8')
          full = os.environ['FULL'].encode('utf-8')
          if before.count(short) != 1:
              raise SystemExit(f'esperava 1 ocorrência abreviada, encontrei {before.count(short)}')
          after = before.replace(short, full, 1)
          if after.count(short) != 0:
              raise SystemExit('abreviação residual após substituição')
          if after.replace(full, short, 1) != before:
              raise SystemExit('prova de preservação byte a byte falhou')
          Path('CHANGELOG.md').write_bytes(after)
          PY

      - name: Provar adição pura contra main
        run: |
          git fetch origin main
          NUMSTAT="$(git diff --numstat origin/main -- CHANGELOG.md)"
          echo "${NUMSTAT}"
          ADDED="$(printf '%s' "${NUMSTAT}" | awk '{print $1}')"
          DELETED="$(printf '%s' "${NUMSTAT}" | awk '{print $2}')"
          test "${ADDED}" = "23"
          test "${DELETED}" = "0"

      - name: Executar gate estrutural já com o changelog reparado
        run: python -B tools/validate_assistant.py --root ambiente_fonte

      - name: Remover workflow transitório e publicar reparo
        run: |
          git rm .github/workflows/mm01-repair-changelog.yml
          git add CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(mm01): restaurar changelog completo e usar SHA seguro"
          git push origin HEAD
