name: MM00 fechamento Q-01 transitório

on:
  push:
    branches:
      - micromodelos/mm00-fechamento-pos-merge

permissions:
  contents: write

jobs:
  fechar-q01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inserir entrada MM00 preservando bytes históricos
        shell: bash
        env:
          MM00_BLOCK_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, os
          path = Path('CHANGELOG.md')
          raw = path.read_bytes()
          marker = '## 2026-09-14 — V08: integração transversal e fechamento técnico (ChatGPT)'.encode('utf-8')
          idx = raw.index(marker)
          block = base64.b64decode(os.environ['MM00_BLOCK_B64'])
          if block in raw:
              raise SystemExit('Entrada MM00 já existe; recusando duplicação.')
          before, after = raw[:idx], raw[idx:]
          new = before + block + after
          path.write_bytes(new)
          reread = path.read_bytes()
          assert reread[:idx] == before
          assert reread[idx:idx + len(block)] == block
          assert reread[idx + len(block):] == after
          print('OLD_SHA256=' + hashlib.sha256(raw).hexdigest())
          print('NEW_SHA256=' + hashlib.sha256(reread).hexdigest())
          print('INSERTED_BYTES=' + str(len(block)))
          PY

      - name: Verificar escopo e auto-remover workflow transitório
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git rm .github/workflows/mm00-fechar-q01-transitorio.yml
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/mm00-fechar-q01-transitorio.yml CHANGELOG.md "
          git commit -m "MM00 — fechar Q-01 de forma estritamente aditiva"
          git push origin HEAD:micromodelos/mm00-fechamento-pos-merge
