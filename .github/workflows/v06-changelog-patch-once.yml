name: V06 changelog patch once

on:
  push:
    branches: [codex/temas-v06-fechamento-documental-20260914]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          marker = '## 2026-09-14 — V05: fechamento técnico do Visual Lab em candidata (Codex)'
          title = '## 2026-09-14 — V06: integração Git e fechamento técnico (ChatGPT)'
          if title in text:
              raise SystemExit('V06_CHANGELOG_ALREADY_PRESENT')
          if text.count(marker) != 1:
              raise SystemExit(f'V06_CHANGELOG_MARKER_COUNT={text.count(marker)}')
          entry = '''## 2026-09-14 — V06: integração Git e fechamento técnico (ChatGPT)

### Atualizado

- (ChatGPT) PR #38 integrada após aceite explícito de Rodrigo; head final validado `70499e1803ce0d61a148a0da975c4f52611046e0`, merge `418946de8d1e95e87cbfd9df528ddcced5075237` e árvore `68ddec3d691047e890ba2785e1e2e007039fa0e3` idêntica entre candidata testada e merge.
- (ChatGPT) V06 registra geração determinística por `ResolvedTheme`, bridge Python → compositor, 12 assets congelados protegidos por SHA-256, manifesto/fingerprints, detecção de adulteração e separação entre gerar, revisar, aprovar, promover e publicar.
- (ChatGPT) CI agregado, V04 e V05 passaram a preparar Node 22, `pnpm@10.34.5` e dependências do compositor antes da descoberta cumulativa V01–V06; nenhum teste foi removido ou filtrado.

### Evidências

- (ChatGPT) Head final da PR: CI geral, V00, V01, V02, V04, V05 e V06 concluíram com `success`; suíte V06 5/5, regressões V01–V06 364/364 e V00 12/12.
- (ChatGPT) Pós-merge: oito workflows na `main` concluíram com `success` — CI geral e V00–V06, incluindo V03.
- (ChatGPT) Failures históricos permanecem failures, incluindo `34845378370`, `34845593931`, `34845754341`, `34845937711`, `34846291082`, `34847723861`, `34848445012`, `34848898532` e `34848898536`; suas causas e correções estão preservadas nos documentos V06.

### Limites

- (ChatGPT) Sem publicação Databricks, promoção automática de variante, ACL/compute/Spark/SQL/MLflow remoto, homologação de navegador/acessibilidade/UAT ou início da V07.
'''
          p.write_text(text.replace(marker, entry + '\n' + marker, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v06-changelog-patch-once.yml
          git add CHANGELOG.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs(v06): registrar fechamento no changelog"
          git push origin HEAD:codex/temas-v06-fechamento-documental-20260914
