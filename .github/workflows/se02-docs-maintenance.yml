name: SE02 Docs Maintenance

on:
  push:
    branches:
      - sef/SE02-preflight

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sef/SE02-preflight
          fetch-depth: 0

      - name: Reconciliar documentos com âncoras estritas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: âncora inesperada ({count}) para {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          def insert_before_once(path: str, anchor: str, block: str, sentinel: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if sentinel in text:
                  raise SystemExit(f"{path}: sentinela já presente: {sentinel}")
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f"{path}: âncora inesperada ({count}) para {anchor!r}")
              p.write_text(text.replace(anchor, block + anchor), encoding="utf-8")

          replace_once(
              "docs/sprints/skill_enforcement/PLANO_MESTRE.md",
              "**Status:** SE00 concluída e integrada; SE01 em fechamento para homologação; SE02–SE08 não iniciadas  ",
              "**Status:** SE00 e SE01 concluídas e integradas; SE02 em andamento; SE03–SE08 não iniciadas  ",
          )

          manual_entry = '''### 27.0. Preflight e governança de execução\n\n#### `hub_scripts.skill_execution`\n\nGuia conceitual e de decisão: `hub_scripts/skill_execution/README.md` (a partir de `.assistant/`).\n\nResolve `execution_contract.json` antes do core analítico e devolve um `PreflightResult` estruturado com `PASS` ou `BLOCKED`, decisões por recurso/template, issues bloqueantes e `writes_performed=false`. Na SE02, `run_preflight` avalia apenas pré-condições objetivas: não executa a EDA, não chama helpers analíticos e não prova aderência posterior.\n\nA API pública é `run_preflight`. O contrato v0.1 continua em `mode="audit"`; runner determinístico, Execution Receipt e postflight pertencem a estágios posteriores do Skill Enforcement Framework. Condição usada pelo contrato sem contexto explícito bloqueia o preflight em vez de ser tratada silenciosamente como falsa.\n\n---\n\n'''
          insert_before_once(
              "ambiente_fonte/.assistant/MANUAL_TECNICO.md",
              "### 27.1. Constantes e formatação",
              manual_entry,
              "#### `hub_scripts.skill_execution`",
          )
          Path("MANUAL_TECNICO.md").write_bytes(
              Path("ambiente_fonte/.assistant/MANUAL_TECNICO.md").read_bytes()
          )

          replace_once(
              "ambiente_fonte/.assistant/skills/README.md",
              "- **Helpers recomendados:** `hub_scripts.quick_profile`, `hub_scripts.data_quality_check`, `hub_snippets.spark.null_summary`, `hub_snippets.spark.smart_sample`, `hub_snippets.spark.safe_display`, `hub_snippets.display.correlation_matrix`, `hub_snippets.display.distribution_grid`, `hub_snippets.visual.theme_plotly`, `hub_snippets.visual.index_generator` e `hub_snippets.constants.format_br`.",
              "- **Helpers recomendados:** `hub_scripts.skill_execution`, `hub_scripts.quick_profile`, `hub_scripts.data_quality_check`, `hub_snippets.spark.null_summary`, `hub_snippets.spark.smart_sample`, `hub_snippets.spark.safe_display`, `hub_snippets.display.correlation_matrix`, `hub_snippets.display.distribution_grid`, `hub_snippets.visual.theme_plotly`, `hub_snippets.visual.index_generator` e `hub_snippets.constants.format_br`.",
          )

          replace_once(
              "ambiente_fonte/.assistant/hub_scripts/README.md",
              "| os sete utilitários disponíveis | [Catálogo Detalhado](#catalogo-detalhado) |",
              "| os oito objetos disponíveis | [Catálogo Detalhado](#catalogo-detalhado) |",
          )
          replace_once(
              "ambiente_fonte/.assistant/hub_scripts/README.md",
              "Os sete utilitários se distribuem por quatro frentes funcionais: qualidade e perfil, estabilidade, transformação analítica e governança técnica. Todos são executados sob demanda e cada um preserva seu próprio contrato de retorno.",
              "O catálogo reúne os sete utilitários históricos de qualidade, estabilidade, transformação e governança técnica, além do objeto transversal `skill_execution`, introduzido pelo Skill Enforcement Framework para resolver pré-condições antes do core analítico. Todos são executados sob demanda e cada um preserva seu próprio contrato de retorno.",
          )
          replace_once(
              "ambiente_fonte/.assistant/hub_scripts/README.md",
              "**Equivalente textual da figura:** `data_quality_check` e `quick_profile` inspecionam qualidade e perfil; `drift_detector` compara distribuições; `rfv_calculator` constrói features RFV; `schema_to_yaml`, `naming_checker` e `doc_coverage` apoiam governança técnica. Os tipos de retorno estão explícitos no catálogo abaixo.",
              "**Equivalente textual da figura:** `data_quality_check` e `quick_profile` inspecionam qualidade e perfil; `drift_detector` compara distribuições; `rfv_calculator` constrói features RFV; `schema_to_yaml`, `naming_checker` e `doc_coverage` apoiam governança técnica. A figura retrata esses sete objetos históricos; `skill_execution` é um oitavo objeto transversal acrescentado depois dela. Os tipos de retorno estão explícitos no catálogo abaixo.",
          )

          script_entry = '''### 🛡️ 0. Preflight e Governança de Execução\n\n#### `skill_execution` — Preflight do Contrato de Skill\n\n- **Guia local:** [skill_execution: guia local](skill_execution/README.md)\n- **O que faz:** lê um `execution_contract.json`, avalia condições objetivas e resolve APIs públicas/templates aplicáveis antes do core analítico.\n- **O que retorna:** `PreflightResult` estruturado com `PASS` ou `BLOCKED`, decisões por item, issues bloqueantes e `writes_performed=false`.\n- **Quando usar:** antes de uma execução protegida pelo Skill Enforcement Framework. Na SE02, não executa a EDA, não chama helpers analíticos e não substitui runner, receipt ou postflight.\n\n---\n\n'''
          insert_before_once(
              "ambiente_fonte/.assistant/hub_scripts/README.md",
              "### 🩺 1. Qualidade e Perfilamento de Dados (Data Health)",
              script_entry,
              "#### `skill_execution` — Preflight do Contrato de Skill",
          )
          replace_once(
              "ambiente_fonte/.assistant/hub_scripts/README.md",
              "O exemplo abaixo usa especificamente `data_quality_check`. Os campos e o tratamento mostrados aqui não devem ser copiados como se fossem o contrato universal dos outros seis utilitários.",
              "O exemplo abaixo usa especificamente `data_quality_check`. Os campos e o tratamento mostrados aqui não devem ser copiados como se fossem o contrato universal dos demais objetos de `hub_scripts`.",
          )
          PY

      - name: Conferir escopo documental
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          allowed = {
              "MANUAL_TECNICO.md",
              "ambiente_fonte/.assistant/MANUAL_TECNICO.md",
              "ambiente_fonte/.assistant/hub_scripts/README.md",
              "ambiente_fonte/.assistant/skills/README.md",
              "docs/sprints/skill_enforcement/PLANO_MESTRE.md",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected or missing:
              print("unexpected=", unexpected)
              print("missing=", missing)
              sys.exit(1)
          if Path("MANUAL_TECNICO.md").read_bytes() != Path("ambiente_fonte/.assistant/MANUAL_TECNICO.md").read_bytes():
              print("MANUAL_TECNICO divergiu")
              sys.exit(1)
          print("escopo documental SE02 conferido")
          PY

      - name: Commitar e remover workflow transitório
        shell: bash
        run: |
          git config user.name "SE02 Docs"
          git config user.email "actions@users.noreply.github.com"
          git add MANUAL_TECNICO.md ambiente_fonte/.assistant/MANUAL_TECNICO.md ambiente_fonte/.assistant/hub_scripts/README.md ambiente_fonte/.assistant/skills/README.md docs/sprints/skill_enforcement/PLANO_MESTRE.md
          git rm .github/workflows/se02-docs-maintenance.yml
          git commit -m "docs(SE02): reconciliar inventários e plano mestre"
          git push origin HEAD:sef/SE02-preflight
