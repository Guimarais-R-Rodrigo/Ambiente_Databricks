name: Polir README V03
on:
  push:
    branches:
      - codex/temas-v03-review-20260912
permissions:
  contents: write
jobs:
  polir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências declaradas
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Polir README canônico e regenerar espelho
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'O estado desta sprint está em `docs/sprints/sistema_temas/V03/CHECKPOINT_V03.md`' ambiente_fonte/.assistant/hub_snippets/visual/theme_plotly/README.md; then
            echo 'Polimento já aplicado; não repetir.'
          else
            python -B tools/_v03_polish_readme.py
          fi
          python -B tools/render_simulado.py --write
          cmp ambiente_fonte/.assistant/hub_snippets/visual/theme_plotly/README.md Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/visual/theme_plotly/README.md
      - name: Exigir validação global e V03 verdes
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/validate_assistant.py --conferir-readme
          python -B tools/tests/test_temas_v03.py
      - name: Commitar somente README fonte e derivado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add ambiente_fonte/.assistant/hub_snippets/visual/theme_plotly/README.md Novo_Ambiente_Simulado/Users/usuario-free/.assistant/hub_snippets/visual/theme_plotly/README.md
          if git diff --cached --quiet; then
            echo 'Sem alteração permanente adicional.'
            exit 0
          fi
          git commit -m "docs(temas): completar orientação operacional do adaptador V03"
          git push origin HEAD:codex/temas-v03-review-20260912
