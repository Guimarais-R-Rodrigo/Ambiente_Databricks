name: Code-check transitório V04
on:
  push:
    branches:
      - codex/temas-v04-html-20260912
permissions:
  contents: read
jobs:
  codecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências declaradas
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Regenerar APIs apenas na worktree do teste
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from api_publica import api_publica, conteudo_init
          paths = [
              'ambiente_fonte/.assistant/hub_snippets/constants/styles/styles.py',
              'ambiente_fonte/.assistant/hub_snippets/visual/badge/badge.py',
              'ambiente_fonte/.assistant/hub_snippets/visual/divider/divider.py',
              'ambiente_fonte/.assistant/hub_snippets/visual/kpi_card/kpi_card.py',
              'ambiente_fonte/.assistant/hub_snippets/visual/section_header/section_header.py',
              'ambiente_fonte/.assistant/hub_snippets/visual/index_generator/index_generator.py',
              'ambiente_fonte/.assistant/hub_snippets/display/dataframe_styled/dataframe_styled.py',
          ]
          for raw in paths:
              p = Path(raw)
              (p.parent / '__init__.py').write_text(conteudo_init(p.stem, api_publica(p)), encoding='utf-8')
          PY
      - name: V04
        run: python -B tools/tests/test_temas_v04.py -v
      - name: Todas as sprints de temas
        run: python -B -m unittest discover -s tools/tests -p 'test_temas*.py' -v
      - name: Regressão visual V00
        run: python -B tools/tests/test_visual_legado_v00.py
      - name: AST do produto
        run: python -B tools/validate_assistant.py
