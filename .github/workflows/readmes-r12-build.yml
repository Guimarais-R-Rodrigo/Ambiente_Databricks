name: Freeze tecnico READMEs R12

on:
  push:
    branches: [codex/readmes-r12]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Materializar R12
        shell: bash
        run: |
          set -euo pipefail
          BASE=d51ca5dddb76e960f44f5b106b918f3415cc25d4
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          python docs/sprints/readmes_objetos/evidencias_r12/gerar_indices_r12.py
          python docs/sprints/readmes_objetos/evidencias_r12/integrar_navegacao_r12.py
          python docs/sprints/readmes_objetos/evidencias_r12/registrar_r12.py
          python tools/render_simulado.py --write
          rm .github/workflows/readmes-r12-build.yml
          git add -A
          git diff --cached --check
      - name: Instalar dependencias
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Validar snapshot e preservacao
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_assistant.py | tee /tmp/r12-validator.txt
          python docs/sprints/readmes_objetos/evidencias_r12/snapshot_r12.py /tmp/r12-validator.txt
          python tools/validate_assistant.py --conferir-readme
          python docs/sprints/readmes_objetos/evidencias_r12/verificar_r12.py | tee /tmp/r12-preservacao.txt
      - name: Gate permanente
        run: python tools/ci_local.py | tee /tmp/r12-ci.txt
      - name: Publicar candidata
        shell: bash
        run: |
          set -euo pipefail
          E=docs/sprints/readmes_objetos/evidencias_r12/FREEZE_R12.txt
          {
            echo 'R12 — freeze tecnico'
            echo 'base=d51ca5dddb76e960f44f5b106b918f3415cc25d4'
            echo "workflow_source=${GITHUB_SHA}"
            python --version
            echo
            echo '== validator =='
            cat /tmp/r12-validator.txt
            echo
            echo '== preservacao =='
            cat /tmp/r12-preservacao.txt
            echo
            echo '== ci_local =='
            cat /tmp/r12-ci.txt
          } > "$E"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(r12): integrar indices de categoria (ChatGPT)'
          git push origin HEAD:codex/readmes-r12
