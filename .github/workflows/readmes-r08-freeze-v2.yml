name: Freeze R08 v2
# rerun: preservation now mirrors the renderer publication scope
on:
  push:
    branches: [codex/readmes-r08-build]
    paths: [.github/workflows/readmes-r08-freeze-v2.yml]
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: b73bbb91961f9ba5f9031d648c42ec0891b63347
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/requirements-dev.txt
            tools/requirements-temas-dev.txt

      - name: Preparar árvore R08
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          python docs/sprints/readmes_objetos/evidencias_r08/aplicar_r08_v2.py
          cp ambiente_fonte/.assistant/MANUAL_TECNICO.md MANUAL_TECNICO.md
          python tools/render_simulado.py --write
          git rm .github/workflows/readmes-r08-freeze.yml .github/workflows/readmes-r08-freeze-v2.yml .github/workflows/readmes-r08-freeze-v3.yml .github/workflows/readmes-r08-freeze-v4.yml
          git rm docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py
          git mv docs/sprints/readmes_objetos/evidencias_r08/verificar_r08_v2.py docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py
          git rm docs/sprints/readmes_objetos/evidencias_r08/verificar_preservacao.py docs/sprints/readmes_objetos/evidencias_r08/verificar_preservacao_v2.py
          git mv docs/sprints/readmes_objetos/evidencias_r08/verificar_preservacao_v3.py docs/sprints/readmes_objetos/evidencias_r08/verificar_preservacao.py
          printf '\n- `docs/sprints/readmes_objetos/evidencias_r08/aplicar_r08_v2.py` — entrada compatível com o schema `pending` vigente.\n' >> docs/sprints/readmes_objetos/MATRIZ_ALTERACOES_R08.md
          sed -i 's/[[:space:]]\+$//' docs/sprints/readmes_objetos/MATRIZ_ALTERACOES_R08.md docs/sprints/readmes_objetos/evidencias_r08/aplicar_r08.py
          git add -A
          git diff --cached --check "$BASE"
          python tools/validate_assistant.py > "$RUNNER_TEMP/derived.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'],'derived.txt').read_text()
          keys=['skills','prompts','helpers citados','markdown / links','notebooks / links','readmes de objeto','pastas de objeto','forma da pasta','contrato de dados','contrato de entrada','saída colada','idioma da docstring','normas do molde','notebook exercita','python (AST)','instrucoes','repo (identidade)','repo (links)']
          actual={}
          for line in out.splitlines():
              for key in keys:
                  if line.startswith(key): actual[key]=line
          assert set(actual)==set(keys)
          assert '55/75 operacionais' in actual['readmes de objeto'] and '20 pendentes' in actual['readmes de objeto']
          p=Path('README.md'); lines=p.read_text(encoding='utf-8').splitlines(); found=set()
          for i,line in enumerate(lines):
              for key,val in actual.items():
                  if line.startswith(key): lines[i]=val; found.add(key); break
          assert found==set(keys)
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git add README.md
          python tools/validate_assistant.py --conferir-readme | tee "$RUNNER_TEMP/validator-pre.txt"
          grep -q 'APROVADO: 0 falha(s), 0 aviso(s)' "$RUNNER_TEMP/validator-pre.txt"
          git write-tree > "$RUNNER_TEMP/tree-pre.txt"

      - name: Gate estrutural e temas V00-V04
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-dev.txt -r tools/requirements-temas-dev.txt >/dev/null
          python docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py --group static | tee "$RUNNER_TEMP/static.txt"
          python tools/ci_local.py --verbose | tee "$RUNNER_TEMP/gate.txt"
          for s in test_inventario_visual test_visual_legado_v00 test_baseline_visual_runner test_temas_v01 test_temas_v01_integracao test_temas_v02 test_temas_v03 test_temas_v04; do python "tools/tests/$s.py"; done
          python docs/sprints/readmes_objetos/evidencias_r08/verificar_preservacao.py --base "$BASE" | tee "$RUNNER_TEMP/preservacao.txt"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tree-pre.txt")"

      - name: Runtime core
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/core"; P="$RUNNER_TEMP/core/bin/python"
          "$P" -m pip install --upgrade pip >/dev/null
          "$P" -m pip install 'numpy<2' pandas scikit-learn mlflow tabulate scipy >/dev/null
          "$P" -m pip freeze > "$RUNNER_TEMP/core-pacotes.txt"
          "$P" docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py --group core | tee "$RUNNER_TEMP/core.txt"

      - name: Runtime PyTorch
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/torch"; P="$RUNNER_TEMP/torch/bin/python"
          "$P" -m pip install --upgrade pip >/dev/null
          "$P" -m pip install 'numpy<2' >/dev/null
          "$P" -m pip install torch --index-url https://download.pytorch.org/whl/cpu >/dev/null
          "$P" -m pip freeze > "$RUNNER_TEMP/torch-pacotes.txt"
          "$P" docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py --group torch | tee "$RUNNER_TEMP/torch.txt"

      - name: Runtime SHAP
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/shap"; P="$RUNNER_TEMP/shap/bin/python"
          "$P" -m pip install --upgrade pip >/dev/null
          "$P" -m pip install 'numpy==1.26.4' 'scikit-learn==1.4.2' 'shap==0.44.1' pandas matplotlib >/dev/null
          "$P" -m pip freeze > "$RUNNER_TEMP/shap-pacotes.txt"
          "$P" docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py --group shap | tee "$RUNNER_TEMP/shap.txt"

      - name: Runtime UMAP
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/umap"; P="$RUNNER_TEMP/umap/bin/python"
          "$P" -m pip install --upgrade pip >/dev/null
          "$P" -m pip install 'numpy==1.26.4' 'umap-learn==0.5.5' pandas plotly >/dev/null
          "$P" -m pip freeze > "$RUNNER_TEMP/umap-pacotes.txt"
          "$P" docs/sprints/readmes_objetos/evidencias_r08/verificar_r08.py --group umap | tee "$RUNNER_TEMP/umap.txt"

      - name: Fechar e materializar candidata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          names=['static.txt','core.txt','torch.txt','shap.txt','umap.txt']; counts={}
          for name in names:
              text=Path(os.environ['RUNNER_TEMP'],name).read_text(); m=re.search(r'Ran (\d+) tests',text); assert m,name; counts[name]=int(m.group(1)); assert 'FAILED' not in text
          total=sum(counts.values())
          p=Path('docs/sprints/readmes_objetos/RELATORIO_R08.md'); s=p.read_text(encoding='utf-8'); s=s.replace('STATUS_R08: CANDIDATA — aguarda fechamento automatizado e revisão/aceite humano antes de qualquer merge.', f'STATUS_R08: PASS técnico — {total}/{total} casos aprovados no run {os.environ["GITHUB_RUN_ID"]}; aguarda aceite editorial humano.'); p.write_text(s,encoding='utf-8')
          r=Path('docs/sprints/readmes_objetos/RUBRICA_R08.json'); d=json.loads(r.read_text(encoding='utf-8')); d['run_id']=int(os.environ['GITHUB_RUN_ID']); d['runtime_case_counts']=counts; d['runtime_total_cases']=total
          for k in d['criteria']: d['criteria'][k]='passed_self_review'
          r.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add -A
          git diff --cached --check "$BASE"
          python tools/ci_local.py --verbose > "$RUNNER_TEMP/gate-final.txt"
          python tools/validate_assistant.py --conferir-readme > "$RUNNER_TEMP/validator-final.txt"
          grep -q 'APROVADO: 0 falha(s), 0 aviso(s)' "$RUNNER_TEMP/validator-final.txt"
          python docs/sprints/readmes_objetos/evidencias_r08/verificar_preservacao.py --base "$BASE" > "$RUNNER_TEMP/preservacao-final.txt"
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          TREE=$(git write-tree)
          COMMIT=$(printf '%s\n' 'R08 — READMEs de clusters, anomalias e explicabilidade validados (ChatGPT)' | git commit-tree "$TREE" -p "$BASE")
          git push origin "$COMMIT:refs/heads/codex/readmes-r08-final"
          printf '{"base":"%s","tree":"%s","commit":"%s","coverage":"55/75","pending":20,"run_id":%s}\n' "$BASE" "$TREE" "$COMMIT" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/R08-FINAL.json"

      - name: Evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r08-freeze-v2-evidencias
          retention-days: 7
          path: |
            ${{ runner.temp }}/validator-pre.txt
            ${{ runner.temp }}/validator-final.txt
            ${{ runner.temp }}/gate.txt
            ${{ runner.temp }}/gate-final.txt
            ${{ runner.temp }}/preservacao.txt
            ${{ runner.temp }}/preservacao-final.txt
            ${{ runner.temp }}/static.txt
            ${{ runner.temp }}/core.txt
            ${{ runner.temp }}/torch.txt
            ${{ runner.temp }}/shap.txt
            ${{ runner.temp }}/umap.txt
            ${{ runner.temp }}/*-pacotes.txt
            ${{ runner.temp }}/R08-FINAL.json
          if-no-files-found: warn
