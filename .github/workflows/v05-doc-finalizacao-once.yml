name: V05 finalizacao documental one-shot

on:
  push:
    branches:
      - codex/temas-v05-fechamento-r13-20260913
    paths:
      - .github/workflows/v05-doc-finalizacao-once.yml
      - tools/v05_finalize_docs_once.py

permissions:
  contents: write

jobs:
  finalizar-documentacao:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch, renderizar e conferir escopo
        run: python tools/v05_finalize_docs_once.py

      - name: Commitar somente documentacao conferida
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            ambiente_fonte/.assistant/MANUAL_TECNICO.md \
            MANUAL_TECNICO.md \
            ambiente_fonte/.assistant/README.md \
            CHANGELOG.md \
            Novo_Ambiente_Simulado/Users/usuario-free/.assistant/MANUAL_TECNICO.md \
            Novo_Ambiente_Simulado/Users/usuario-free/.assistant/README.md
          git diff --cached --check
          git commit -m "docs(temas): fechar Manual e navegacao V05 sobre D05"
          git push origin HEAD:${GITHUB_REF_NAME}
