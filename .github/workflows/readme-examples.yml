name: Exemplos dos READMEs (Spark local, nao Databricks)
on:
  pull_request:
    paths:
      - 'Template_READMEs/sprints_preenchidos/**'
      - 'tools/**'
      - '.github/workflows/readme-examples.yml'
  push:
    branches: ['chatgpt/revisao-readmes-2026-09-11']
    paths:
      - 'Template_READMEs/sprints_preenchidos/**'
      - 'tools/**'
      - '.github/workflows/readme-examples.yml'
permissions:
  contents: read
jobs:
  spark-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependencias apenas do runner local
        run: python -m pip install -r tools/requirements-dev.txt 'pyspark==4.0.1'
      - name: Gate de revisao e exemplos do Markdown
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SPARK_LOCAL_IP: '127.0.0.1'
        run: |
          python tools/review_readmes.py
          python tools/tests/test_readme_review.py
          python tools/tests/test_readme_examples.py --spark
