name: TEMP MM01 round4 documentation sync

on:
  push:
    paths:
      - '.github/workflows/mm01-round4-doc-sync-transient.yml'

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: micromodelos/mm01-contrato-canonico
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Dependências de manutenção
        run: python -m pip install -r tools/requirements-dev.txt

      - name: Sincronizar documentação
        run: python tools/mm01_sync_round4_docs.py

      - name: Remover mecanismos transitórios
        run: git rm tools/mm01_sync_round4_docs.py .github/workflows/mm01-round4-doc-sync-transient.yml

      - name: Confirmar 31 métodos e executar suíte
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('tools/tests/test_micromodelo_mm01.py').read_text(encoding='utf-8'))
          methods = [n.name for c in tree.body if isinstance(c, ast.ClassDef) for n in c.body if isinstance(n, ast.FunctionDef) and n.name.startswith('test_')]
          print(f'mm01_test_methods={len(methods)}')
          if len(methods) != 31:
              raise SystemExit(f'esperados 31, encontrados {len(methods)}')
          PY
          python -B -m unittest tools/tests/test_micromodelo_mm01.py -v

      - name: CLI e gate estrutural
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/micromodelo_mm01_contract.py docs/sprints/micromodelos/MM01/micromodelo.template.yaml --schema docs/sprints/micromodelos/MM01/micromodelo.schema.json
          python -B tools/micromodelo_mm01_contract.py tools/tests/fixtures/micromodelos_mm01/valido_validado.json --schema docs/sprints/micromodelos/MM01/micromodelo.schema.json
          python -B tools/validate_assistant.py --root ambiente_fonte

      - name: Preservar história e dívida deliberada
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- CHANGELOG.md
          git diff --exit-code HEAD -- docs/auditoria/2026-09-14_micromodelos-mm01/03_resultado_a1.md
          git diff --exit-code HEAD -- docs/auditoria/2026-09-14_micromodelos-mm01/04_resultado_a1_reauditoria.md
          git diff --exit-code HEAD -- docs/auditoria/2026-09-14_micromodelos-mm01/05_resultado_a1_reauditoria_2.md
          git diff --exit-code HEAD -- docs/auditoria/2026-09-14_micromodelos-mm01/06_resultado_a1_reauditoria_3.md
          test ! -e tools/mm01_sync_round4_docs.py
          test ! -e .github/workflows/mm01-round4-doc-sync-transient.yml

      - name: Publicar documentação validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sprints/micromodelos/MM01/TESTES.md \
                  docs/sprints/micromodelos/MM01/CHECKPOINT.md \
                  docs/sprints/micromodelos/MM01/README.md \
                  docs/sprints/micromodelos/MM01/CONTRATO_MICROMODELO.md \
                  docs/sprints/micromodelos/MM01/ESTADOS_E_PROVENIENCIA.md \
                  docs/sprints/micromodelos/README.md
          git commit -m 'docs(mm01): registrar quarta A1 e preparar quinta auditoria'
          git push origin HEAD:micromodelos/mm01-contrato-canonico
