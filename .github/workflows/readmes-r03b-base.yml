name: Base fixa R03-B
on:
  push:
    branches: [codex/readmes-r03b]
    paths: [.github/workflows/readmes-r03b-base.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exportar historico sem credenciais
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c60f1e54743dc23ed60b32ad2260b9aa6a77af0a
          git branch r03b-base c60f1e54743dc23ed60b32ad2260b9aa6a77af0a
          git bundle create "$RUNNER_TEMP/r03b-base.bundle" r03b-base
          git bundle verify "$RUNNER_TEMP/r03b-base.bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: r03b-base
          path: ${{ runner.temp }}/r03b-base.bundle
          retention-days: 1
