name: MM01 - correcoes da matriz final

on:
  push:
    branches:
      - micromodelos/mm01-contrato-canonico
    paths:
      - .github/workflows/mm01-final-acceptance-fix.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar branch MM01
        uses: actions/checkout@v4
        with:
          ref: micromodelos/mm01-contrato-canonico
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Aplicar correções da matriz final
        run: python tools/_tmp_mm01_final_acceptance_fix.py

      - name: Remover mecanismos transitórios
        run: |
          git rm tools/_tmp_mm01_final_acceptance_fix.py
          git rm .github/workflows/mm01-final-acceptance-fix.yml

      - name: Instalar dependências
        run: python -m pip install -r tools/requirements-dev.txt

      - name: Executar suíte MM01
        run: python -B -m unittest tools/tests/test_micromodelo_mm01.py -v

      - name: Executar CLI snapshot
        shell: bash
        run: |
          output="$(python -B tools/micromodelo_mm01_contract.py docs/sprints/micromodelos/MM01/micromodelo.template.yaml --schema docs/sprints/micromodelos/MM01/micromodelo.schema.json)"
          printf '%s\n' "$output"
          grep -q 'SNAPSHOT_VALIDO' <<<"$output"
          grep -q 'HISTORICO_NAO_CERTIFICADO' <<<"$output"

      - name: Executar gate estrutural e README congelado
        run: python -B tools/validate_assistant.py --root ambiente_fonte --conferir-readme

      - name: Conferir invariantes da matriz final
        shell: bash
        run: |
          git diff --check
          test ! -e tools/_tmp_mm01_final_acceptance_fix.py
          test ! -e .github/workflows/mm01-final-acceptance-fix.yml
          test -e docs/sprints/micromodelos/MM01/MATRIZ_ACEITE_FINAL.md
          test "$(grep -c '^    def test_' tools/tests/test_micromodelo_mm01.py)" -eq 47
          grep -q 'Default_Ignorable_Code_Point' tools/micromodelo_mm01_contract.py
          grep -q '_normalize_editorial_text' tools/micromodelo_mm01_contract.py
          grep -q 'APROVADO_EVOLUCAO' tools/micromodelo_mm01_contract.py
          grep -q 'HISTORICO_NAO_CERTIFICADO' tools/micromodelo_mm01_contract.py
          grep -q 'regex>=' tools/requirements-dev.txt
          test "$(git diff --name-only HEAD -- CHANGELOG.md | wc -l)" -eq 0
          test "$(git diff --name-only HEAD -- ambiente_fonte/.assistant | wc -l)" -eq 0
          changed="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/mm01-final-acceptance-fix.yml \
            tools/_tmp_mm01_final_acceptance_fix.py \
            tools/micromodelo_mm01_contract.py \
            tools/requirements-dev.txt \
            tools/tests/test_micromodelo_mm01.py | sort)"
          test "$changed" = "$expected"

      - name: Publicar correção permanente
        shell: bash
        run: |
          git config user.name "Rodrigo"
          git config user.email "guimarais.r.rodrigo@gmail.com"
          git add -A
          git commit -m "fix(mm01): aplicar matriz de aceite final"
          git push origin HEAD:micromodelos/mm01-contrato-canonico
