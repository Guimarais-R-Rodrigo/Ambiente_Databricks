name: TEMP MM01 third A1 documentation sync

on:
  push:
    paths:
      - '.github/workflows/mm01-third-a1-doc-sync-transient.yml'

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: micromodelos/mm01-contrato-canonico
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Dependências de manutenção
        run: python -m pip install -r tools/requirements-dev.txt

      - name: Sincronizar documentação da terceira A1
        run: python tools/mm01_sync_third_a1_docs.py

      - name: Preparar árvore final sem mecanismos transitórios
        run: git rm tools/mm01_sync_third_a1_docs.py .github/workflows/mm01-third-a1-doc-sync-transient.yml

      - name: Confirmar 29 métodos MM01
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('tools/tests/test_micromodelo_mm01.py').read_text(encoding='utf-8'))
          methods = [
              node.name
              for cls in tree.body if isinstance(cls, ast.ClassDef)
              for node in cls.body if isinstance(node, ast.FunctionDef) and node.name.startswith('test_')
          ]
          print(f'mm01_test_methods={len(methods)}')
          if len(methods) != 29:
              raise SystemExit(f'esperados 29 métodos, encontrados {len(methods)}')
          PY

      - name: Suíte MM01
        run: python -B -m unittest tools/tests/test_micromodelo_mm01.py -v

      - name: CLI direta, Unicode e previous
        shell: bash
        run: |
          set -euo pipefail
          CLI=tools/micromodelo_mm01_contract.py
          SCHEMA=docs/sprints/micromodelos/MM01/micromodelo.schema.json
          VALID=tools/tests/fixtures/micromodelos_mm01/valido_validado.json

          python -B "$CLI" docs/sprints/micromodelos/MM01/micromodelo.template.yaml --schema "$SCHEMA"
          python -B "$CLI" "$VALID" --schema "$SCHEMA"

          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          valid = json.loads(Path('tools/tests/fixtures/micromodelos_mm01/valido_validado.json').read_text(encoding='utf-8'))

          positive = copy.deepcopy(valid)
          positive['proveniencia']['gerado_por'] = '生成器'
          positive['proveniencia']['pedido_original_ref'] = '文档١'
          positive['fontes'][0]['schema'] = '数据域'
          positive['fontes'][0]['objeto'] = 'दस्तावेज'
          positive['fontes'][0]['campos'][0] = 'Jose\u0301'
          Path('/tmp/mm01_unicode_positive.json').write_text(json.dumps(positive, ensure_ascii=False), encoding='utf-8')

          negative = copy.deepcopy(valid)
          negative['proveniencia']['gerado_por'] = '\u200b!!!\u0301'
          Path('/tmp/mm01_unicode_negative.json').write_text(json.dumps(negative, ensure_ascii=False), encoding='utf-8')

          previous = copy.deepcopy(valid)
          current = copy.deepcopy(valid)
          current['identidade']['estado']['fase_anterior'] = 'VALIDADO'
          current['identidade']['estado']['fase_atual'] = 'CANDIDATO_PRODUTO'
          current['publicacao']['status'] = 'CANDIDATA'
          current['saida']['publicacao'] = {
              'estado': 'DEFINIDO',
              'campo_booleano': {'nome': 'possui_caracteristica', 'tipo': 'BOOLEAN'},
              'politica_indeterminado': {
                  'tratamento': 'CAMPO_COBERTURA_SEPARADO',
                  'indeterminado_vira_false': False,
                  'regra_ref': None,
                  'proveniencia': copy.deepcopy(valid['classificacao']['semantica']['proveniencia']),
              },
          }
          Path('/tmp/mm01_previous.json').write_text(json.dumps(previous, ensure_ascii=False), encoding='utf-8')
          Path('/tmp/mm01_current.json').write_text(json.dumps(current, ensure_ascii=False), encoding='utf-8')
          PY

          python -B "$CLI" /tmp/mm01_unicode_positive.json --schema "$SCHEMA"
          if python -B "$CLI" /tmp/mm01_unicode_negative.json --schema "$SCHEMA"; then
            echo 'ERRO: caso Unicode materialmente vazio foi aceito' >&2
            exit 1
          fi
          python -B "$CLI" /tmp/mm01_current.json --schema "$SCHEMA" --previous /tmp/mm01_previous.json

      - name: Gate estrutural obrigatório
        run: python -B tools/validate_assistant.py --root ambiente_fonte

      - name: Medir e reconciliar somente a saída congelada do README
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -B tools/validate_assistant.py --root ambiente_fonte --conferir-readme | tee /tmp/mm01_readme_check.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            python - <<'PY'
          import re
          from pathlib import Path

          output = Path('/tmp/mm01_readme_check.txt').read_text(encoding='utf-8')
          pairs = re.findall(r'colado\s*:\s*(.+?)\n\s*real\s*:\s*(.+?)\n', output)
          if not pairs:
              raise SystemExit('validate_assistant falhou, mas não informou divergência mensurável de saída no README')

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          changed = []
          for pasted, real in pairs:
              pasted = pasted.rstrip()
              real = real.rstrip()
              if pasted not in text:
                  raise SystemExit(f'linha medida antiga não encontrada no README: {pasted!r}')
              text = text.replace(pasted, real, 1)
              changed.append((pasted, real))
          path.write_text(text, encoding='utf-8')
          for old, new in changed:
              print(f'README medido: {old} -> {new}')
          PY
            python -B tools/validate_assistant.py --root ambiente_fonte --conferir-readme
          fi

      - name: Revalidar árvore exata e invariantes históricos
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/validate_assistant.py --root ambiente_fonte
          git diff --exit-code HEAD -- CHANGELOG.md
          git diff --exit-code HEAD -- docs/auditoria/2026-09-14_micromodelos-mm01/03_resultado_a1.md
          git diff --exit-code HEAD -- docs/auditoria/2026-09-14_micromodelos-mm01/04_resultado_a1_reauditoria.md
          test ! -e tools/mm01_sync_third_a1_docs.py
          test ! -e .github/workflows/mm01-third-a1-doc-sync-transient.yml

      - name: Publicar documentação validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # As duas deleções transitórias já estão staged por `git rm`.
          # Aqui adicionamos somente artefatos permanentes que ainda existem.
          git add README.md \
                  docs/auditoria/2026-09-14_micromodelos-mm01/05_resultado_a1_reauditoria_2.md \
                  docs/sprints/micromodelos/MM01/CONTRATO_MICROMODELO.md \
                  docs/sprints/micromodelos/MM01/ESTADOS_E_PROVENIENCIA.md \
                  docs/sprints/micromodelos/MM01/TESTES.md \
                  docs/sprints/micromodelos/MM01/CHECKPOINT.md \
                  docs/sprints/micromodelos/MM01/README.md \
                  docs/sprints/micromodelos/README.md
          python - <<'PY'
          import subprocess

          allowed = {
              'README.md',
              'docs/auditoria/2026-09-14_micromodelos-mm01/05_resultado_a1_reauditoria_2.md',
              'docs/sprints/micromodelos/MM01/CONTRATO_MICROMODELO.md',
              'docs/sprints/micromodelos/MM01/ESTADOS_E_PROVENIENCIA.md',
              'docs/sprints/micromodelos/MM01/TESTES.md',
              'docs/sprints/micromodelos/MM01/CHECKPOINT.md',
              'docs/sprints/micromodelos/MM01/README.md',
              'docs/sprints/micromodelos/README.md',
              'tools/mm01_sync_third_a1_docs.py',
              '.github/workflows/mm01-third-a1-doc-sync-transient.yml',
          }
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          unexpected = staged - allowed
          if unexpected:
              raise SystemExit(f'arquivos inesperados no commit documental: {sorted(unexpected)}')
          required_deletions = {
              'tools/mm01_sync_third_a1_docs.py',
              '.github/workflows/mm01-third-a1-doc-sync-transient.yml',
          }
          if not required_deletions <= staged:
              raise SystemExit(f'deleções transitórias ausentes do staging: {sorted(required_deletions - staged)}')
          print('staged:', *sorted(staged), sep='\n- ')
          PY
          git commit -m 'docs(mm01): registrar terceira A1 e preparar quarta auditoria'
          git push origin HEAD:micromodelos/mm01-contrato-canonico
