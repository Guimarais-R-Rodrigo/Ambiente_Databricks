name: Kit de transição para o trabalho
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/aceite_trabalho.py"
      - "tools/kit_transicao_trabalho.py"
      - "tools/bundle_implantacao.py"
      - "tools/tests/test_transicao_trabalho.py"
      - "docs/playbooks/**"
      - ".github/workflows/kit-transicao-trabalho.yml"
permissions:
  contents: read
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependências somente do runner Linux
        run: python -m pip install -r tools/requirements-dev.txt 'pyspark==4.0.1'
      - name: Gate local sem credenciais Databricks
        run: python tools/ci_local.py --verbose
      - name: Contratos em Spark local, não Databricks
        run: python tools/tests/test_transicao_trabalho.py --spark -v
      - name: Gerar kit do commit limpo
        run: python tools/kit_transicao_trabalho.py --output .artifacts/kit-trabalho
      - uses: actions/upload-artifact@v4
        with:
          name: kit-transicao-trabalho
          path: .artifacts/kit-trabalho/
          retention-days: 14
          if-no-files-found: error
