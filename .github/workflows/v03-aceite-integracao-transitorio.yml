name: Ratificar aceite V03
on:
  push:
    branches:
      - codex/temas-v03-review-20260912
permissions:
  contents: write
jobs:
  ratificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências declaradas
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Aplicar ratificação documental
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/_v03_aceite_integracao.py
          git rm .github/workflows/v03-aceite-integracao-transitorio.yml tools/_v03_aceite_integracao.py
      - name: Exigir árvore final verde
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/validate_assistant.py --conferir-readme
          python -B tools/tests/test_temas_v03.py
          python -B tools/tests/test_visual_legado_v00.py
          python -B tools/tests/test_temas_v02.py
          python -B -m unittest discover -s tools/tests -p 'test_temas_v01*.py' -v
          python -B tools/ci_local.py --verbose
      - name: Conferir escopo e gravar
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/v03-aceite-integracao-transitorio.yml
          test ! -e tools/_v03_aceite_integracao.py
          git status --short
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add CHANGELOG.md docs/sprints/README.md docs/sprints/sistema_temas/README.md docs/sprints/sistema_temas/V03/README.md docs/sprints/sistema_temas/V03/CHECKPOINT_V03.md
          git diff --cached --name-only
          git diff --cached --quiet && { echo 'Nenhuma mudança permanente para gravar'; exit 1; } || true
          git commit -m "docs(temas): ratificar aceite V03 para integração"
          git push origin HEAD:codex/temas-v03-review-20260912
