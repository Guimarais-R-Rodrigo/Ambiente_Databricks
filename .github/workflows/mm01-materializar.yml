name: MM01 materialização transitória

on:
  push:
    branches:
      - micromodelos/mm01-contrato-canonico
    paths:
      - .github/workflows/mm01-materializar.yml

permissions:
  contents: write

jobs:
  materializar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar pacotes candidatos com allowlist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARCHIVE_BLOB_SHAS: "7eb9685301f157cf74f94a2fb1f0b64aebd86f8d c758f2c56aec7ff86420a584b47e59f68744660d a11acfe8c1dc0bb696bab9b36df39627ee388958"
        run: |
          python - <<'PY'
          import base64
          import io
          import json
          import os
          import pathlib
          import tarfile
          import urllib.request

          allowed = {
              "docs/sprints/micromodelos/MM01/README.md",
              "docs/sprints/micromodelos/MM01/CONTRATO_MICROMODELO.md",
              "docs/sprints/micromodelos/MM01/ESTADOS_E_PROVENIENCIA.md",
              "docs/sprints/micromodelos/MM01/TESTES.md",
              "docs/sprints/micromodelos/MM01/CHECKPOINT.md",
              "docs/sprints/micromodelos/MM01/micromodelo.schema.json",
              "docs/sprints/micromodelos/MM01/micromodelo.template.yaml",
              "tools/micromodelo_mm01_contract.py",
              "tools/tests/test_micromodelo_mm01.py",
              "tools/tests/fixtures/micromodelos_mm01/valido_validado.json",
              "tools/tests/fixtures/micromodelos_mm01/casos_invalidos.json",
              "tools/requirements-dev.txt",
              "docs/sprints/micromodelos/README.md",
          }
          root = pathlib.Path.cwd().resolve()
          seen = set()

          for blob_sha in os.environ["ARCHIVE_BLOB_SHAS"].split():
              url = f"https://api.github.com/repos/{os.environ['REPO']}/git/blobs/{blob_sha}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              archive = base64.b64decode(payload["content"].replace("\n", ""), validate=True)

              with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as tar:
                  for member in tar.getmembers():
                      if not member.isfile():
                          continue
                      if member.name not in allowed:
                          raise SystemExit(f"arquivo fora da allowlist: {member.name}")
                      if member.name in seen:
                          raise SystemExit(f"arquivo duplicado entre pacotes: {member.name}")
                      destination = (root / member.name).resolve()
                      if root != destination and root not in destination.parents:
                          raise SystemExit(f"path fora do repositório: {member.name}")
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      source = tar.extractfile(member)
                      if source is None:
                          raise SystemExit(f"conteúdo ausente: {member.name}")
                      destination.write_bytes(source.read())
                      seen.add(member.name)

          if seen != allowed:
              missing = sorted(allowed - seen)
              extra = sorted(seen - allowed)
              raise SystemExit(f"allowlist incompleta: ausentes={missing} extras={extra}")
          PY

      - name: Instalar dependências de manutenção
        run: python -m pip install -r tools/requirements-dev.txt

      - name: Executar suíte MM01
        run: python -B -m unittest tools/tests/test_micromodelo_mm01.py

      - name: Executar gate estrutural
        run: python -B tools/validate_assistant.py --root ambiente_fonte

      - name: Remover materializador e publicar candidata
        run: |
          git rm .github/workflows/mm01-materializar.yml
          git add docs/sprints/micromodelos/MM01 docs/sprints/micromodelos/README.md tools/micromodelo_mm01_contract.py tools/tests/test_micromodelo_mm01.py tools/tests/fixtures/micromodelos_mm01 tools/requirements-dev.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "MM01 — contrato canônico de micromodelos"
          git push origin HEAD
