name: Integracao conferida R02
on:
  push:
    branches: [codex/readmes-r02]
    paths: [.github/workflows/readmes-r02-apply.yml]
permissions:
  contents: read
jobs:
  conferir:
    if: github.ref == 'refs/heads/codex/readmes-r02'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      SPARK_LOCAL_IP: '127.0.0.1'
      BASE_COMMIT: af1efd14f2a688d3d3cc816ef85f5f1755e8afec
      BASE_TREE: fa56632456b795a1f0ea572274f428b876f713bd
      EXPECTED_PARENT: 9875f4b9e8b39500a732438fe9fd3eb8ff75b7e7
      EXPECTED_TREE: a01f5ad520affd2fe8901ec31092576a107a5458
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruir e conferir lote revisado
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          parts = sorted(Path('.github/readmes-r02-transport').glob('part-*.txt'))
          if len(parts) != 9:
              raise SystemExit('Transporte incompleto')
          packed = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          if hashlib.sha256(packed).hexdigest() != 'b9f3f657a476903086bad668ed35e016caf49533b0a27e9cf357893e4a7e1ac3':
              raise SystemExit('Hash XZ divergente')
          patch = lzma.decompress(packed)
          if hashlib.sha256(patch).hexdigest() != '41f28896dc4b4c1e8d9112669b9bc26a363a35e22000c1403b755a1cb5e53432':
              raise SystemExit('Hash patch divergente')
          Path(os.environ['RUNNER_TEMP'], 'R02.patch').write_bytes(patch)
          print('Hashes conferidos; lote idêntico ao revisado localmente.')
          PY
          git apply --check "$RUNNER_TEMP/R02.patch"
          git apply --index "$RUNNER_TEMP/R02.patch"
          git rm -r .github/readmes-r02-transport .github/workflows/readmes-r02-base.yml .github/workflows/readmes-r02-apply.yml
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Gate do projeto sem novas dependencias permanentes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-dev.txt
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/r02-gate.txt"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pilotos com bibliotecas reais em ambiente isolado
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/r02-venv"
          "$RUNNER_TEMP/r02-venv/bin/python" -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 xgboost==3.1.3 mlflow-skinny==3.1.4 pyspark==4.0.1
          "$RUNNER_TEMP/r02-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/r02-pacotes.txt"
          mkdir -p "$RUNNER_TEMP/r02-spark"
          (cd "$RUNNER_TEMP/r02-spark" && "$RUNNER_TEMP/r02-venv/bin/python" "$GITHUB_WORKSPACE/docs/sprints/readmes_objetos/evidencias_r02/verificar_pilotos.py" --require-all) 2>&1 | tee "$RUNNER_TEMP/r02-pilotos.txt"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - name: Armazenar arvore testada sem atualizar nenhuma branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args])
          if git('write-tree').decode().strip() != os.environ['EXPECTED_TREE']:
              raise SystemExit('Arvore mudou após testes')
          changes = git('diff', '--cached', '--name-status', '-z', os.environ['BASE_COMMIT']).decode().split('\0')
          entries = []
          i = 0
          while i < len(changes) and changes[i]:
              status, path = changes[i:i+2]
              i += 2
              if status not in ('A', 'M'):
                  raise SystemExit('Alteracao fora do lote esperado: '+status)
              mode = git('ls-files', '--stage', '--', path).decode().split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'content': Path(path).read_bytes().decode('utf-8')})
          if len(entries) != 54:
              raise SystemExit('Escopo divergente: '+str(len(entries)))
          body = json.dumps({'base_tree': os.environ['BASE_TREE'], 'tree': entries}).encode()
          request = urllib.request.Request(
              os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',
              data=body, method='POST', headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json',
                  'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request, timeout=90) as response:
              tree = json.load(response)['sha']
          if tree != os.environ['EXPECTED_TREE']:
              raise SystemExit('Arvore remota divergente: '+tree)
          result = {'tree': tree, 'base': os.environ['BASE_COMMIT'], 'paths': len(entries),
              'gate': 'PASS', 'pilotos_require_all': 'PASS', 'run_id': os.environ['GITHUB_RUN_ID'],
              'branch_updated_by_workflow': False, 'main_alterada': False, 'databricks_publicado': False}
          Path(os.environ['RUNNER_TEMP'], 'R02-integracao.json').write_text(json.dumps(result, indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Guardar evidencias mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02-evidencias-integracao
          retention-days: 7
          path: |
            ${{ runner.temp }}/r02-gate.txt
            ${{ runner.temp }}/r02-pilotos.txt
            ${{ runner.temp }}/r02-pacotes.txt
            ${{ runner.temp }}/R02-integracao.json
          if-no-files-found: warn
