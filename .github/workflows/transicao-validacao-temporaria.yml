name: Snapshot isolado para transicao
on:
  push:
    branches: ['chatgpt/transicao-trabalho-2026-09-11']
    paths: ['.github/workflows/transicao-validacao-temporaria.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 704b3bb801834aa4c0ca2c3a107022b061d62032
          persist-credentials: false
      - run: |
          git archive --format=zip --output="$RUNNER_TEMP/repository.zip" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/identity.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: transicao-source
          path: |
            ${{ runner.temp }}/repository.zip
            ${{ runner.temp }}/identity.txt
          retention-days: 1
