name: Adaptador Plotly V03
on:
  push:
    branches: [main, codex/temas-v03]
  pull_request:
    paths:
      - 'tools/**'
      - 'ambiente_fonte/**'
      - '.github/workflows/**'
      - 'docs/ai/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/theme_plotly/**'
      - 'ambiente_fonte/.assistant/hub_snippets/visual/tema/**'
      - 'ambiente_fonte/.assistant/hub_padroes/identidade_visual/**'
      - 'tools/tests/test_temas_v03.py'
      - 'tools/tests/test_visual_legado_v00.py'
      - 'docs/sprints/sistema_temas/V03/**'
      - '.github/workflows/temas-v03-ci.yml'
permissions:
  contents: read
jobs:
  plotly-v03:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar derivado local do SHA
        run: |
          python -B tools/render_simulado.py --write
          python -B tools/render_simulado.py --check
      - name: Dependências declaradas
        run: python -m pip install -r tools/requirements-dev.txt
      - name: V03 e compatibilidade visual legada
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/tests/test_temas_v03.py
          python -B tools/tests/test_visual_legado_v00.py
      - name: Núcleo e contrato anteriores
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/tests/test_temas_v02.py
          python -B -m unittest discover -s tools/tests -p 'test_temas_v01*.py' -v
      - name: Escopo
        run: echo 'V03 valida adaptador Plotly offline; não publica nem homologa Databricks/Spark.'
