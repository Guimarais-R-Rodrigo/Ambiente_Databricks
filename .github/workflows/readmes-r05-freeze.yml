name: Freeze R05 modelos tabulares
on:
  push:
    branches: [codex/readmes-r05]
    paths: [.github/workflows/readmes-r05-freeze.yml]
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BASE_COMMIT: d9da056c95bf5c4209b2f208de1c9a987580efe7
      BASE_TREE: d461d1a2ef8523d380f82bac6bb112287e6cd870
      EXPECTED_PARENT: 47a16eeeac677281228b223b1fd4cc4c0600089f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Integrar prosa, índices e controle sem alterar implementação
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path('.')
          objs=['lgbm_ranker','mlp_embeddings','optuna_lgbm','tabnet_wrapper','train_catboost','train_lgbm']

          def replace_once(path, old, new):
              p=root/path; s=p.read_text(encoding='utf-8'); n=s.count(old); assert n==1,(path,n,old[:80]); p.write_text(s.replace(old,new),encoding='utf-8')
          def sub_once(path, pattern, repl):
              p=root/path; s=p.read_text(encoding='utf-8'); out,n=re.subn(pattern,repl,s,flags=re.S); assert n==1,(path,n,pattern[:100]); p.write_text(out,encoding='utf-8')

          # Backlink em Markdown, antes do primeiro COMMAND.
          for obj in objs:
              path=f'ambiente_fonte/.assistant/hub_snippets/ml/{obj}/exemplo_{obj}.py'
              p=root/path; s=p.read_text(encoding='utf-8'); marker='\n# COMMAND ----------'
              assert marker in s and 'Guia local completo:' not in s,obj
              intro='\n# MAGIC\n# MAGIC **Guia local completo:** [README deste modelo](README.md).'
              p.write_text(s.replace(marker,intro+marker,1),encoding='utf-8')

          # Ranker: o contrato real não implementa MAP.
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/lgbm_ranker/exemplo_lgbm_ranker.py',
              '# MAGIC **O que este helper faz.** Treina LambdaRank com grupos declarados e avalia com NDCG e MAP, que medem posição e não acerto.',
              '# MAGIC **O que este helper faz.** Treina LambdaRank com grupos declarados e avalia com NDCG. Nesta versão, MAP não é calculado pelo helper.'
          )

          # MLP: retirar afirmações universais sobre one-hot/árvores e cardinalidade.
          sub_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/mlp_embeddings/exemplo_mlp_embeddings.py',
              r'# MAGIC \*\*O problema\.\*\* Categórica com milhares de níveis.*?# MAGIC \*\*O que este helper faz\.\*\*',
              '# MAGIC **O problema.** Categóricas com muitos níveis podem tornar one-hot muito largo. Uma embedding oferece outra hipótese: aprender vetores densos por nível e ajustar essa representação junto com a tarefa.\n# MAGIC\n# MAGIC **O que este helper faz.**'
          )
          sub_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/mlp_embeddings/exemplo_mlp_embeddings.py',
              r'# MAGIC O ponto do notebook não é o placar:.*?# MAGIC pode colocar as três no mesmo lugar do espaço\.',
              '# MAGIC O ponto do notebook não é o placar: o sinal foi construído em grupos latentes de agência e produto. A embedding oferece uma representação densa em que níveis podem aprender vetores semelhantes. Isso é uma capacidade de representação, não prova de que one-hot ou árvores seriam incapazes de modelar a relação; a comparação precisa ser feita no mesmo protocolo.'
          )
          sub_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/mlp_embeddings/exemplo_mlp_embeddings.py',
              r'# MAGIC \*\*Antes de adotar isso, a comparação honesta:\*\*.*?# MAGIC para aprendê-la — as três coisas juntas\.',
              '# MAGIC **Antes de adotar isso, faça a comparação honesta:** rode um baseline tabular na mesma base, com a mesma partição e métrica. Embeddings se justificam quando a representação aprendida acrescenta valor suficiente para compensar preparo de índices, categorias novas, custo e manutenção.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/mlp_embeddings/exemplo_mlp_embeddings.py',
              '# MAGIC - **Antes de tentar árvore.** Na maioria dos problemas tabulares do banco, LightGBM empata ou ganha, e treina em minutos.',
              '# MAGIC - **Sem baseline comparável.** Primeiro estabeleça uma referência mais simples sob os mesmos dados; só então meça se a embedding acrescenta valor.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/mlp_embeddings/exemplo_mlp_embeddings.py',
              '# MAGIC - **Com categórica de baixa cardinalidade.** Abaixo de ~20 níveis, one-hot resolve e é auditável.',
              '# MAGIC - **Quando uma representação simples já é suficiente.** Baixa cardinalidade pode favorecer one-hot ou tratamento nativo, mas não existe um corte universal de níveis.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/mlp_embeddings/exemplo_mlp_embeddings.py',
              '# MAGIC - **Sem base grande.** Embedding precisa de exemplos por nível; com poucos, cada vetor é ruído aprendido.',
              '# MAGIC - **Com poucos exemplos por nível.** Embeddings pouco observadas podem ficar instáveis; avalie cobertura por categoria e desempenho fora da amostra.'
          )

          # Optuna: remover thresholds universais e hipérbole.
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/optuna_lgbm/exemplo_optuna_lgbm.py',
              '# MAGIC **O problema.** Grid search testa combinações que já se sabe ruins e gasta o orçamento nas bordas. E busca sem validação separada acha o melhor jeito de decorar o conjunto de teste.',
              '# MAGIC **O problema.** Grid search percorre uma malha fixa sem usar o desempenho dos trials anteriores para sugerir o próximo ponto. E busca sem validação separada encontra o melhor ajuste à própria amostra usada para escolher.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/optuna_lgbm/exemplo_optuna_lgbm.py',
              '# MAGIC - **Com poucos trials.** Abaixo de ~30, a busca bayesiana ainda está explorando; o resultado é quase sorteio.',
              '# MAGIC - **Com orçamento incompatível com o espaço.** Não há um número mínimo universal de trials; examine convergência, variabilidade, custo e tamanho do espaço.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/optuna_lgbm/exemplo_optuna_lgbm.py',
              '# MAGIC - **Antes de ter feature boa.** Hiperparâmetro rende alguns pontos decimais; feature nova rende ordens de grandeza.',
              '# MAGIC - **Antes de estabilizar dados, features e validação.** Tuning não corrige leakage ou target mal definido e pode consumir orçamento otimizando o problema errado.'
          )

          # TabNet: importância é model-derived, não causal; sem ranking universal de algoritmos.
          sub_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/tabnet_wrapper/exemplo_tabnet_wrapper.py',
              r'# MAGIC \*\*O problema\.\*\* Rede neural em dado tabular.*?# MAGIC \*\*O que este helper faz\.\*\* Treina TabNet, que seleciona features por passo com máscaras esparsas — o que dá uma explicação nativa, sem SHAP por cima\.',
              '# MAGIC **O problema.** Redes neurais tabulares acrescentam custo e flexibilidade, mas precisam provar valor contra baselines mais simples. Quando usadas, também é útil entender quais features o próprio modelo priorizou.\n# MAGIC\n# MAGIC **O que este helper faz.** Treina TabNet e devolve a importância global calculada pela implementação a partir de suas máscaras/explicações internas. Isso não é causalidade nem substitui uma análise local quando ela for necessária.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/tabnet_wrapper/exemplo_tabnet_wrapper.py',
              '# MAGIC **A importância aqui não vem de SHAP.** Ela sai das máscaras de atenção:',
              '# MAGIC **A importância aqui não vem de SHAP.** Na biblioteca usada, ela é derivada da explicação/máscaras do modelo sobre o treino:'
          )
          sub_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/tabnet_wrapper/exemplo_tabnet_wrapper.py',
              r'# MAGIC As colunas 4 a 7 são ruído puro.*?# MAGIC o degrau entre 0,094 e 0,058 é onde o sinal acaba\.',
              '# MAGIC Neste cenário sintético, as colunas 4 a 7 foram geradas como ruído e receberam importância menor que as quatro primeiras. Não existe regra de que ruído precise receber exatamente zero, nem um “degrau” universal que separe sinal de ruído; valide estabilidade e comportamento fora da amostra.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/tabnet_wrapper/exemplo_tabnet_wrapper.py',
              '# MAGIC Para comparar com um baseline honesto, `hub_snippets.ml.train_lgbm` dá\n# MAGIC 0,9268 num problema parecido, em uma fração do tempo.',
              '# MAGIC Para comparar com um baseline honesto, rode `hub_snippets.ml.train_lgbm` **nesta mesma base e partição**. O número 0,9268 aparece em outro notebook com outro dataset sintético e não é comparação direta.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/tabnet_wrapper/exemplo_tabnet_wrapper.py',
              '# MAGIC - **Como primeira tentativa.** É o último recurso da lista tabular, não o primeiro. Comece pelo baseline de árvore.',
              '# MAGIC - **Sem baseline anterior.** A complexidade extra só é justificável depois de uma referência comparável sob a mesma validação.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/tabnet_wrapper/exemplo_tabnet_wrapper.py',
              '# MAGIC - **Com poucos dados.** Precisa de volume para as máscaras convergirem; abaixo disso, a explicação é instável entre execuções.',
              '# MAGIC - **Quando o volume não sustenta a arquitetura.** Estabilidade das máscaras e da métrica deve ser medida; não há corte universal de tamanho nesta documentação.'
          )

          # CatBoost: ordered statistics não são point-in-time temporal.
          sub_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/train_catboost/exemplo_train_catboost.py',
              r'# MAGIC O que importa é que ele \*\*encontrou\*\* esse sinal,.*?# MAGIC \*target encoding\* de vazar o alvo\.',
              '# MAGIC O que importa é que ele **encontrou** esse sinal com uma coluna de 200 níveis, sem one-hot manual. O CatBoost usa mecanismos de estatísticas categóricas ordenadas/permutadas para reduzir o viés e o vazamento do target durante o treino. Essa “ordem” é parte do algoritmo e **não equivale ao tempo real de disponibilidade do dado**: point-in-time continua sendo responsabilidade da construção da base.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/train_catboost/exemplo_train_catboost.py',
              '# MAGIC - **Sem declarar `cat_features`.** Sem isso ele trata a categórica como número, e a ordem inventada vira sinal falso.',
              '# MAGIC - **Sem declarar corretamente as categóricas.** Em ndarray numérico, um código nominal pode ser tratado como número; em outros tipos, a biblioteca pode falhar. Confira `cat_features` e os tipos.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/train_catboost/exemplo_train_catboost.py',
              '# MAGIC - **Quando não há categórica.** O ganho dele está exatamente aí; sem categórica, é mais lento sem contrapartida.',
              '# MAGIC - **Quando não há razão específica para CatBoost.** Sem categóricas relevantes, compare custo e qualidade com outros baselines em vez de presumir vantagem ou desvantagem.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/train_catboost/exemplo_train_catboost.py',
              '# MAGIC - **Em busca de hiperparâmetro larga.** É o mais lento dos três; use LightGBM para explorar e CatBoost para confirmar.',
              '# MAGIC - **Em tuning caro sem orçamento definido.** O custo relativo depende de dados, hardware e parâmetros; escolha a estratégia de busca por evidência do seu ambiente.'
          )

          # LightGBM: neutralizar título/claims e corrigir efeito do subsample.
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/train_lgbm/exemplo_train_lgbm.py',
              '# MAGIC # `train_lgbm` — o baseline que quase sempre ganha',
              '# MAGIC # `train_lgbm` — um baseline de árvore para comparação tabular'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/train_lgbm/exemplo_train_lgbm.py',
              '# MAGIC **O problema.** Começar um problema tabular por rede neural custa semanas e costuma perder para uma árvore ajustada em minutos. Sem baseline, não há como saber se o modelo complexo valeu.',
              '# MAGIC **O problema.** Sem uma referência tabular consistente, não há como saber se a complexidade de outro modelo acrescentou valor. Um baseline ajuda a comparar qualidade, custo e estabilidade sob o mesmo protocolo.'
          )
          sub_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/train_lgbm/exemplo_train_lgbm.py',
              r'# MAGIC \*\*Como ler\.\*\* Comece pelo `overfit_gap`.*?# MAGIC vai se repetir em produção\.',
              '# MAGIC **Como ler.** `overfit_gap` é a diferença de AUC entre treino e validação: aqui foi **0,0460**. O helper não define limiar que transforme esse valor em “pequeno” ou “grande”. Interprete-o junto da partição, variabilidade e custo da decisão; gap baixo também pode coexistir com leakage compartilhado entre treino e validação.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/train_lgbm/exemplo_train_lgbm.py',
              '# MAGIC também é informação: o problema é fácil o bastante para não precisar do\n# MAGIC orçamento inteiro. Se ele fosse até o limite, valeria aumentar.',
              '# MAGIC também é informação: nesta execução a validação deixou de melhorar antes do\n# MAGIC orçamento inteiro. Se o treino alcançar o limite, investigue curva, custo e validação antes de decidir se aumentar `n_estimators` faz sentido.'
          )
          sub_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/train_lgbm/exemplo_train_lgbm.py',
              r'# MAGIC \*\*Como ler\.\*\* \*\*Seis\*\* destes nove valores.*?# MAGIC que ninguém escolheu consome o tempo que os outros seis mereciam\.',
              '# MAGIC **Como ler.** O bloco histórico acima é um extrato: a constante atual também contém `objective`, `metric`, `random_state` e `verbose`, que a célula Python imprime. Use `DEFAULT_PARAMS_BINARY` e `model.get_params()` como inventário técnico; não conte o bloco colado como lista completa. Alguns valores coincidem com defaults da biblioteca e outros são escolhas locais.'
          )
          sub_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/train_lgbm/exemplo_train_lgbm.py',
              r'# MAGIC `learning_rate` 0,05 em vez de 0,1.*?# MAGIC — muita gente prefere começar em zero\.',
              '# MAGIC `learning_rate` 0,05, `n_estimators` 500, regularização e `colsample_bytree=0,8` são escolhas locais a revisar. Um detalhe importante: `subsample=0,8` **não habilita sozinho bagging de linhas** porque o wrapper não define `subsample_freq` e o default LightGBM é 0 (desabilitado). A amostragem de colunas em 0,8, por outro lado, está ativa.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/train_lgbm/exemplo_train_lgbm.py',
              '# MAGIC - **Em base pequena.** Com poucos milhares de linhas, regressão logística regularizada costuma empatar e é explicável.',
              '# MAGIC - **Sem comparar com referência simples.** Em problemas menores ou mais lineares, regressão regularizada pode ser competitiva e mais simples; meça em vez de presumir.'
          )
          replace_once(
              'ambiente_fonte/.assistant/hub_snippets/ml/train_lgbm/exemplo_train_lgbm.py',
              '# MAGIC - **Com `log_mlflow=False` em produção.** Aqui é contorno de laboratório; lá, o registro é o que torna o resultado auditável.',
              '# MAGIC - **Quando sua governança exige rastreabilidade e o logging foi desligado.** O laboratório usa `False`; em produção, siga a política de experimentos do ambiente em vez de assumir um padrão universal.'
          )

          # Teste TabNet: batch compatível com virtual_batch_size default 128.
          p=root/'docs/sprints/readmes_objetos/evidencias_r05/verificar_r05.py'; s=p.read_text(encoding='utf-8')
          s=s.replace('X = rng.normal(size=(180, 4)).astype("float32")','X = rng.normal(size=(600, 4)).astype("float32")')
          s=s.replace('size=180) > 0).astype(int)','size=600) > 0).astype(int)')
          s=s.replace('X[:130], y[:130], X[130:], y[130:],\n            task="binary", n_d=4, n_a=4, n_steps=2,\n            max_epochs=2, patience=2, batch_size=32, log_mlflow=False,','X[:480], y[:480], X[480:], y[480:],\n            task="binary", n_d=4, n_a=4, n_steps=2,\n            max_epochs=2, patience=2, batch_size=256, log_mlflow=False,')
          s=s.replace('X = rng.normal(size=(160, 3)).astype("float32")','X = rng.normal(size=(560, 3)).astype("float32")')
          s=s.replace('size=160)).astype("float32")','size=560)).astype("float32")')
          s=s.replace('X[:115], y[:115], X[115:], y[115:],\n            task="regression", n_d=4, n_a=4, n_steps=2,\n            max_epochs=2, patience=2, batch_size=32, log_mlflow=False,','X[:448], y[:448], X[448:], y[448:],\n            task="regression", n_d=4, n_a=4, n_steps=2,\n            max_epochs=2, patience=2, batch_size=256, log_mlflow=False,')
          p.write_text(s,encoding='utf-8')

          # Catálogo de snippets: rotas R05 antes das famílias específicas.
          p=root/'ambiente_fonte/.assistant/hub_snippets/README.md'; s=p.read_text(encoding='utf-8')
          anchor='#### 🕒 Engenharia Temporal e Séries Temporais'
          assert anchor in s and '#### 📘 Guias locais R05 — modelos tabulares' not in s
          block='''#### 📘 Guias locais R05 — modelos tabulares\n\nAntes de treinar ou ajustar estes modelos, use os guias locais para distinguir objetivo, métrica, dependência e limite de cada API:\n\n- [LightGBM baseline](ml/train_lgbm/README.md) — classificação/regressão, early stopping e defaults;\n- [CatBoost baseline](ml/train_catboost/README.md) — categóricas e efeitos de configuração;\n- [LambdaRank](ml/lgbm_ranker/README.md) — grupos e NDCG;\n- [Optuna + LightGBM](ml/optuna_lgbm/README.md) — busca, função objetivo e reconstrução do candidato;\n- [MLP com embeddings](ml/mlp_embeddings/README.md) — categóricas indexadas e treinador binário;\n- [TabNet](ml/tabnet_wrapper/README.md) — rede tabular e importância global.\n\nOs seis recursos são customizados pelo Hub e executados explicitamente; nenhum README aprova um modelo para produção.\n\n'''
          p.write_text(s.replace(anchor,block+anchor,1),encoding='utf-8')

          # Manual canônico: rota operacional simples antes das fontes.
          p=root/'ambiente_fonte/.assistant/MANUAL_TECNICO.md'; s=p.read_text(encoding='utf-8')
          assert '### Guias locais R05 — modelos tabulares' not in s
          section='''### Guias locais R05 — modelos tabulares\n\nPara escolher entre os seis modelos/tabulares desta leva, abra primeiro o README da pasta. A rota recomendada é: baseline simples → baseline de árvore → somente depois tuning ou arquitetura neural, sempre sob a mesma validação.\n\n- `hub_snippets/ml/train_lgbm/README.md` — LightGBM e métricas por tarefa;\n- `hub_snippets/ml/train_catboost/README.md` — CatBoost e categóricas;\n- `hub_snippets/ml/lgbm_ranker/README.md` — ranking por grupos e NDCG;\n- `hub_snippets/ml/optuna_lgbm/README.md` — TPE e limites da busca;\n- `hub_snippets/ml/mlp_embeddings/README.md` — embeddings e contrato binário do treinador;\n- `hub_snippets/ml/tabnet_wrapper/README.md` — TabNet e importância global.\n\nOs notebooks instalam dependências de laboratório e reiniciam o Python. Leia esses efeitos antes de executar. Métrica de validação, importância ou tuning não equivalem a homologação do modelo.\n\n'''
          m=re.search(r'(?m)^## 30\.',s); assert m
          p.write_text(s[:m.start()]+section+s[m.start():],encoding='utf-8')
          (root/'MANUAL_TECNICO.md').write_bytes(p.read_bytes())

          # Controle de migração: exatamente seis pendências R05.
          p=root/'docs/sprints/readmes_objetos/CONTROLE_MIGRACAO.json'; data=json.loads(p.read_text(encoding='utf-8'))
          removed={f'hub_snippets/ml/{obj}' for obj in objs}; assert removed <= set(data['pending'])
          for key in sorted(removed):
              assert data['pending'][key]=={'sprint':'R05','lote':'A'},(key,data['pending'][key]); data['pending'].pop(key)
          assert len(data['pending'])==37,len(data['pending'])
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Índice da iniciativa: atualizar estado e rotas.
          p=root/'docs/sprints/readmes_objetos/README.md'; s=p.read_text(encoding='utf-8')
          pattern=r'O contrato vigente é \*\*1\.0\.0\*\*\..*?A próxima parada é a revisão desta leva antes da R05\.'
          replacement='''O contrato vigente é **1.0.0**. A R04-B foi aceita e integrada pelo PR nº 18 no commit `d9da056`, já reconciliada com a V03 e com cinco CIs pós-merge verdes. A R05 documenta `lgbm_ranker`, `mlp_embeddings`, `optuna_lgbm`, `tabnet_wrapper`, `train_catboost` e `train_lgbm` sem alterar suas implementações/fachadas. A cobertura esperada é **38/75 operacionais e 3/3 exemplares, com 37 pendências**; a saída do validador da árvore fechada é a fonte de verdade. Isso não significa publicação no workspace nem aceite antecipado dos seis textos.\n\nConsulte o [relatório R05](RELATORIO_R05.md), a [matriz nominal](MATRIZ_ALTERACOES_R05.md) e os [achados](ACHADOS_R05.md). A próxima parada é a revisão desta leva antes da R06.'''
          s,n=re.subn(pattern,replacement,s,flags=re.S); assert n==1,n
          s=s.replace('[Matriz R04-B](MATRIZ_ALTERACOES_R04B.md)','[Matriz R05](MATRIZ_ALTERACOES_R05.md)')
          s=s.replace('[Achados R04-B](ACHADOS_R04B.md)','[Achados R05](ACHADOS_R05.md)')
          s=s.replace('[Relatório R04-B](RELATORIO_R04B.md)','[Relatório R05](RELATORIO_R05.md)')
          p.write_text(s,encoding='utf-8')

          # Checkpoints aditivos.
          additions={
            'CLAUDE.md':'\n### Estado da migração de READMEs — R05\nA R04-B foi integrada na `main` em `d9da056`. A R05 documenta seis modelos tabulares sem alterar implementações/fachadas; consulte `docs/sprints/readmes_objetos/RELATORIO_R05.md`. Cobertura estrutural não é aceite editorial nem homologação.\n',
            'PLANO_HUB.md':'\n### Checkpoint R05 — modelos tabulares\nSeis objetos `hub_snippets/ml` recebem README local no contrato 1.0.0. A leva preserva implementações e pausa antes da R06 para revisão. Fonte: `docs/sprints/readmes_objetos/RELATORIO_R05.md`.\n',
            'docs/sprints/README.md':'\n### READMEs de objeto — R05\nA R04-B está integrada em `d9da056`. A R05 cobre seis modelos tabulares e pausa para revisão antes da R06. Consulte `readmes_objetos/RELATORIO_R05.md` e `readmes_objetos/MATRIZ_ALTERACOES_R05.md`.\n',
          }
          for name,block in additions.items():
              p=root/name; s=p.read_text(encoding='utf-8'); heading=block.splitlines()[1]; assert heading not in s,name
              p.write_text(s.rstrip()+'\n'+block,encoding='utf-8')

          # README raiz: continuidade; contagens serão substituídas pela saída real do validador.
          p=root/'README.md'; s=p.read_text(encoding='utf-8'); assert '### Continuidade R05' not in s
          block='''\n### Continuidade R05\n\nApós o aceite e merge da R04-B (`d9da056`), a R05 documenta seis modelos tabulares. A candidata não altera suas implementações/fachadas e deve chegar a **38/75 READMEs operacionais**, com 37 pendências, sujeito ao validador. A leva pausa antes da R06 para revisão editorial.\n'''
          p.write_text(s.rstrip()+'\n'+block,encoding='utf-8')

          # Changelog aditivo.
          p=root/'CHANGELOG.md'; s=p.read_text(encoding='utf-8'); assert '## 2026-09-12 — R05: READMEs de modelos tabulares' not in s
          entry='''## 2026-09-12 — R05: READMEs de modelos tabulares (ChatGPT)\n\n- Documenta `lgbm_ranker`, `mlp_embeddings`, `optuna_lgbm`, `tabnet_wrapper`, `train_catboost` e `train_lgbm` no contrato 1.0.0.\n- Corrige somente prosa/backlinks dos seis notebooks; código, magics executáveis e outputs históricos permanecem protegidos.\n- Retira exatamente seis dispensas R05 do controle de migração.\n- Registra limitações de API encontradas, relatório, matriz, rubrica e testes de runtime isolados.\n- Sem alteração de implementação, dependência permanente, publicação Databricks, auditoria independente ou início da R06.\n\n'''
          pos=s.index('## 2026-'); p.write_text(s[:pos]+entry+s[pos:],encoding='utf-8')

          # Relatório conhece o run, sem antecipar o resultado.
          p=root/'docs/sprints/readmes_objetos/RELATORIO_R05.md'; s=p.read_text(encoding='utf-8')
          old='**PENDENTE.** Esta seção será substituída pelo workflow de fechamento somente depois de todos os gates, preservação e testes específicos concluírem. A árvore não deve ser materializada como candidata final em caso de falha.'
          new=f'Workflow de fechamento: **run {os.environ["GITHUB_RUN_ID"]}**. Resultado ainda não presumido; a árvore só é materializada após todos os gates, preservação e runtime dos seis objetos.'
          assert old in s; p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          cp ambiente_fonte/.assistant/MANUAL_TECNICO.md MANUAL_TECNICO.md
          python tools/render_simulado.py --write
          git rm .github/workflows/readmes-r05-freeze.yml
          git add -A
          python tools/validate_assistant.py > "$RUNNER_TEMP/validator-pre.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'],'validator-pre.txt').read_text()
          keys=['skills','prompts','helpers citados','markdown / links','notebooks / links','readmes de objeto','pastas de objeto','forma da pasta','contrato de dados','contrato de entrada','saída colada','idioma da docstring','normas do molde','notebook exercita','python (AST)','instrucoes','repo (identidade)','repo (links)']
          actual={}
          for line in out.splitlines():
              for key in keys:
                  if line.startswith(key): actual[key]=line
          assert set(actual)==set(keys),set(keys)-set(actual)
          assert '38/75 operacionais' in actual['readmes de objeto'] and '37 pendentes' in actual['readmes de objeto'],actual['readmes de objeto']
          p=Path('README.md'); lines=p.read_text(encoding='utf-8').splitlines(); found=set()
          for i,line in enumerate(lines):
              for key,value in actual.items():
                  if line.startswith(key): lines[i]=value; found.add(key); break
          assert found==set(keys),set(keys)-found
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git add -A
          git diff --cached --check "$BASE_COMMIT"
          git write-tree | tee "$RUNNER_TEMP/tree-pre.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-dev.txt
            tools/requirements-temas-dev.txt
      - name: Gate vigente, V00-V03 e preservação
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-dev.txt -r tools/requirements-temas-dev.txt >/dev/null
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/gate.txt"
          for suite in test_inventario_visual test_visual_legado_v00 test_baseline_visual_runner test_temas_v01 test_temas_v01_integracao test_temas_v02 test_temas_v03; do python "tools/tests/$suite.py"; done
          python docs/sprints/readmes_objetos/evidencias_r05/verificar_preservacao.py 2>&1 | tee "$RUNNER_TEMP/preservacao.txt"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tree-pre.txt")"
          git diff --exit-code
      - name: Criar ambiente isolado dos modelos
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/r05-env"
          PY="$RUNNER_TEMP/r05-env/bin/python"
          "$PY" -m pip install --upgrade pip >/dev/null
          "$PY" -m pip install numpy==2.3.5 scikit-learn==1.7.2 lightgbm==4.6.0 catboost==1.2.8 optuna==4.5.0 >/dev/null
          "$PY" -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu >/dev/null
          "$PY" -m pip install pytorch-tabnet==4.1.0 >/dev/null
          "$PY" -m pip freeze > "$RUNNER_TEMP/r05-pacotes.txt"
      - name: Executar suíte R05 com bibliotecas reais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r05-work"
          (cd "$RUNNER_TEMP/r05-work" && "$RUNNER_TEMP/r05-env/bin/python" "$GITHUB_WORKSPACE/docs/sprints/readmes_objetos/evidencias_r05/verificar_r05.py" --require-models) 2>&1 | tee "$RUNNER_TEMP/r05.txt"
          ! grep -qi 'FAILED' "$RUNNER_TEMP/r05.txt"
          ! grep -qi 'skipped=' "$RUNNER_TEMP/r05.txt"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tree-pre.txt")"
      - name: Fechar relatório, rubrica e reconferir a mesma árvore
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          log=Path(os.environ['RUNNER_TEMP'],'r05.txt').read_text()
          m=re.search(r'Ran (\d+) tests',log); assert m,log[-2000:]
          cases=int(m.group(1))
          report=Path('docs/sprints/readmes_objetos/RELATORIO_R05.md'); s=report.read_text(encoding='utf-8')
          marker=f'Workflow de fechamento: **run {os.environ["GITHUB_RUN_ID"]}**. Resultado ainda não presumido; a árvore só é materializada após todos os gates, preservação e runtime dos seis objetos.'
          final=f'''Workflow de fechamento: **run {os.environ['GITHUB_RUN_ID']} — success até esta etapa**. Na árvore final: gate vigente aprovado; validador 0 falhas/0 avisos; V00/V01/V02/V03 aprovadas; preservação PASS; suíte R05 **{cases}/{cases} aprovada sem skips** com versões registradas em `r05-pacotes.txt`. Cobertura validada: **38/75 operacionais, 3/3 exemplares e 37 pendências**. A materialização ocorre somente após a reconferência abaixo.'''
          assert marker in s; report.write_text(s.replace(marker,final),encoding='utf-8')
          rubric=Path('docs/sprints/readmes_objetos/RUBRICA_R05.json'); data=json.loads(rubric.read_text(encoding='utf-8'))
          for key in ['contract_1_0_0','notebook_prose_only','implementation_unchanged','facade_unchanged','previous_readmes_preserved','migration_exactly_six_removed','repository_gate','v00','v01','v02','v03','model_runtime','manual_mirrors']:
              data['criteria'][key]='passed_self_review'
          data['remote_run_id']=int(os.environ['GITHUB_RUN_ID'])
          data['validated_coverage']='38/75 operacionais; 3/3 exemplares; 37 pendentes'
          rubric.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add -A
          git diff --cached --check "$BASE_COMMIT"
          python tools/ci_local.py --verbose > "$RUNNER_TEMP/gate-final.txt" 2>&1
          python docs/sprints/readmes_objetos/evidencias_r05/verificar_preservacao.py > "$RUNNER_TEMP/preservacao-final.txt"
          python tools/validate_assistant.py > "$RUNNER_TEMP/validator-final.txt"
          grep -q 'APROVADO: 0 falha(s), 0 aviso(s)' "$RUNNER_TEMP/validator-final.txt"
          grep -q '38/75 operacionais' "$RUNNER_TEMP/validator-final.txt"
          git diff --exit-code
          git write-tree | tee "$RUNNER_TEMP/final-tree.txt"
      - name: Materializar exatamente a árvore final testada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args])
          final=Path(os.environ['RUNNER_TEMP'],'final-tree.txt').read_text().strip(); assert git('write-tree').decode().strip()==final
          raw=git('diff','--cached','--no-renames','--name-status','-z',os.environ['BASE_COMMIT']).decode().split('\0'); entries=[]; i=0
          while i<len(raw) and raw[i]:
              st,p=raw[i:i+2]; i+=2; assert st in ('A','M'),(st,p)
              mode=git('ls-files','--stage','--',p).decode().split()[0]
              entries.append({'path':p,'mode':mode,'type':'blob','content':Path(p).read_text(encoding='utf-8')})
          req=urllib.request.Request(os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',data=json.dumps({'base_tree':os.environ['BASE_TREE'],'tree':entries}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=90) as response: tree=json.load(response)['sha']
          assert tree==final,(tree,final)
          result={'tree':tree,'base':os.environ['BASE_COMMIT'],'paths_vs_main':len(entries),'gate':'PASS','v00':'PASS','v01':'PASS','v02':'PASS','v03':'PASS','r05_runtime':'PASS','preservacao':'PASS','coverage':'38/75','pending':37,'run_id':os.environ['GITHUB_RUN_ID'],'workflow_in_final_tree':False,'main_changed':False,'databricks_published':False}
          Path(os.environ['RUNNER_TEMP'],'R05-FINAL.json').write_text(json.dumps(result,indent=2)+'\n'); print(json.dumps(result))
          PY
      - name: Guardar evidências mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r05-freeze-evidencias
          retention-days: 7
          path: |
            ${{ runner.temp }}/validator-pre.txt
            ${{ runner.temp }}/validator-final.txt
            ${{ runner.temp }}/gate.txt
            ${{ runner.temp }}/gate-final.txt
            ${{ runner.temp }}/preservacao.txt
            ${{ runner.temp }}/preservacao-final.txt
            ${{ runner.temp }}/r05.txt
            ${{ runner.temp }}/r05-pacotes.txt
            ${{ runner.temp }}/final-tree.txt
            ${{ runner.temp }}/R05-FINAL.json
          if-no-files-found: warn
