name: Ratificacao e revalidacao V01 autorizadas
on:
  push:
    branches: [codex/temas-v01-validacao-aceite-20260912]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      V01_HEAD: c3f1e38594fcd5e2fd76dfaa011b6def3c6f4364
      V01_BASE: b88a9ccdde6e61892bc25eb7cf4f4b2577badb23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3f1e38594fcd5e2fd76dfaa011b6def3c6f4364
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-dev.txt
            tools/requirements-temas-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: v01-aceite-34708693721
          run-id: 34708693721
          github-token: ${{ github.token }}
          path: /tmp/aceite-origem
      - name: Reconstituir documentacao por hash e corrigir contador medido
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v01-aceite/documentos
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          head = os.environ['V01_HEAD']
          assert git('rev-parse', 'HEAD') == head
          assert git('rev-parse', 'HEAD^{tree}') == 'fd0aa6a505dda994b63f36d2bd9c1439c974c111'
          assert not git('status', '--porcelain')
          patch = Path('/tmp/aceite-origem/ratificacao.patch')
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == 'c064999ee130f91d666fd8fe1e27c6c57b78d5147351b96141b4af382bd8efe9'
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          assert git('write-tree') == '25aba30b801a43ef94d892fab5fb7f276917e8d1'
          readme = Path('README.md')
          old = readme.read_text(encoding='utf-8')
          before = 'repo (links)       : 765 links fora da raiz analisada'
          after = 'repo (links)       : 768 links fora da raiz analisada'
          assert old.count(before) == 1
          readme.write_text(old.replace(before, after), encoding='utf-8')
          changelog = Path('CHANGELOG.md')
          old = changelog.read_text(encoding='utf-8')
          anchor = '- (Codex) Revalidação identificada por base, candidata, árvore e run próprio.'
          assert old.count(anchor) == 1
          note = '- (Codex) A rodada 34708693721 passou V01/V00/publicador, mas o CI reprovou a contagem de links do README raiz (765 documentados, 768 medidos). Contador reconciliado com a saída real e bateria repetida; o run anterior permanece reprovado, sem relaxar a guarda.\n'
          changelog.write_text(old.replace(anchor, note + anchor), encoding='utf-8')
          paths = ['CHANGELOG.md', 'README.md', 'docs/decisions/ADR-0013-sistema-de-temas.md', 'docs/decisions/README.md', 'docs/sprints/sistema_temas/README.md', 'docs/sprints/sistema_temas/V01/CHECKPOINT_V01.md', 'docs/sprints/sistema_temas/V01/README.md']
          paths.sort()
          subprocess.run(['git','add','--',*paths],check=True)
          assert sorted(git('diff','--cached','--name-only').splitlines()) == paths
          out=Path('/tmp/v01-aceite')
          (out/'documentos_alterados.json').write_text(json.dumps(paths,indent=2)+'\n')
          (out/'ratificacao.patch').write_text(git('diff','--cached')+'\n')
          for name in paths:
              dest=out/'documentos'/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(Path(name).read_bytes())
          subprocess.run(['git','-c','user.name=Codex','-c','user.email=codex@users.noreply.github.com','commit','-m','docs(temas): ratificar aceite V01 e reconciliar contador medido'],check=True)
          (out/'candidata_local.json').write_text(json.dumps({'base':os.environ['V01_BASE'],'parent':head,'local_commit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'run_id':os.environ['GITHUB_RUN_ID'],'previous_failed_run':'34708693721'},indent=2)+'\n')
          PY
      - name: Instalar dependencias declaradas e registrar versoes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-dev.txt -r tools/requirements-temas-dev.txt > /tmp/v01-aceite/instalacao.log 2>&1
          python --version | tee /tmp/v01-aceite/python.txt
          python -m pip freeze > /tmp/v01-aceite/dependencias.txt
      - name: Testar contrato, V01, V00, publicador e oito etapas do CI
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/temas_v01_contract.py 2>&1 | tee /tmp/v01-aceite/contrato.log
          python -B -m unittest discover -s tools/tests -p 'test_temas_v01*.py' -v 2>&1 | tee /tmp/v01-aceite/v01.log
          python -B tools/tests/test_inventario_visual.py 2>&1 | tee /tmp/v01-aceite/v00-inventario.log
          python -B tools/tests/test_visual_legado_v00.py 2>&1 | tee /tmp/v01-aceite/v00-legado.log
          python -B tools/tests/test_baseline_visual_runner.py 2>&1 | tee /tmp/v01-aceite/v00-relatorios.log
          python -B -m unittest discover -s tools/readme_visuals/tests -p 'test_*.py' -v 2>&1 | tee /tmp/v01-aceite/publicador.log
          python -B tools/ci_local.py --verbose 2>&1 | tee /tmp/v01-aceite/ci.log
          python -B tools/validate_assistant.py 2>&1 | tee /tmp/v01-aceite/validate.log
      - name: Conferir preservacao e registrar objetos Git sem mover branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert not git('status','--porcelain')
          base,head=os.environ['V01_BASE'],os.environ['V01_HEAD']
          scopes=['ambiente_fonte','Novo_Ambiente_Simulado','MANUAL_TECNICO.md','tools/ci_local.py']
          subprocess.run(['git','diff','--exit-code',base,'HEAD','--',*scopes],check=True)
          subprocess.run(['git','diff','--exit-code',head,'HEAD','--','.github/workflows','tools'],check=True)
          protected=git('ls-tree','-r',base,'--',*scopes).splitlines()
          assert protected==git('ls-tree','-r','HEAD','--',*scopes).splitlines()
          out=Path('/tmp/v01-aceite')
          paths=json.loads((out/'documentos_alterados.json').read_text())
          assert sorted(git('diff','--name-only',head,'HEAD').splitlines())==paths
          repo=os.environ['GITHUB_REPOSITORY']
          def api(method,path,data=None):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=None if data is None else json.dumps(data).encode(),method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response: return json.load(response)
          assert api('GET','/branches/main')['commit']['sha']==base
          assert api('GET','/git/ref/heads/codex/temas-v01')['object']['sha']==head
          entries=[]
          for name in paths:
              blob=api('POST','/git/blobs',{'content':Path(name).read_text(encoding='utf-8'),'encoding':'utf-8'})
              assert blob['sha']==git('hash-object',name)
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('POST','/git/trees',{'base_tree':git('rev-parse',head+'^{tree}'),'tree':entries})
          assert tree['sha']==git('rev-parse','HEAD^{tree}')
          message='docs(temas): ratificar aceite V01 e revalidar integracao (Codex)\n\nAceite explicito de Rodrigo em 12/09/2026; integracao pelo PR #10 condicionada aos checks.\nRun de revalidacao: '+os.environ['GITHUB_RUN_ID']+'.\nContador documental reconciliado apos falha 34708693721, sem relaxar guardas.\nProduto, espelho, Manual, codigo, schema, fixtures e workflows permanentes preservados.\nSem publicacao Databricks; auditoria independente e homologacoes pendentes.'
          commit=api('POST','/git/commits',{'message':message,'tree':tree['sha'],'parents':[head]})
          receipt={'base':base,'parent':head,'tree':tree['sha'],'commit':commit['sha'],'run_id':os.environ['GITHUB_RUN_ID'],'previous_failed_run':'34708693721','protected_files_including_ci':len(protected),'changed_documents':paths,'branches_updated':False,'databricks_published':False,'independent_audit':False}
          (out/'CANDIDATA_ACEITE.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v01-aceite-${{ github.run_id }}
          path: /tmp/v01-aceite
          retention-days: 30
