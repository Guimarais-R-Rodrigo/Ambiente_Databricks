name: MM01 - sincronizar docs apos sexta A1

on:
  push:
    branches:
      - micromodelos/mm01-contrato-canonico
    paths:
      - .github/workflows/mm01-doc-sync-after-a1-6.yml

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar branch MM01
        uses: actions/checkout@v4
        with:
          ref: micromodelos/mm01-contrato-canonico
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Sincronizar estado operacional
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: esperado 1 match, encontrado {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/sprints/micromodelos/MM01/README.md',
              'RETESTE DE CONSTRUÇÃO PENDENTE; SÉTIMA A1 PENDENTE',
              'RETESTE DE CONSTRUÇÃO VERDE; 7 WORKFLOWS PERMANENTES VERDES; SÉTIMA A1 PENDENTE',
              'README status',
          )
          replace_once(
              'docs/sprints/micromodelos/MM01/README.md',
              'O reteste de construção das correções da quinta A1 deve ficar verde no novo HEAD antes da próxima auditoria independente.',
              'O reteste de construção das correções da sexta A1 está verde no HEAD reconciliado, e os sete workflows permanentes foram executados com sucesso antes do congelamento para a sétima A1.',
              'README evidência',
          )
          replace_once(
              'docs/sprints/micromodelos/MM01/CHECKPOINT.md',
              'RETESTE DE CONSTRUÇÃO PENDENTE; SÉTIMA A1 PENDENTE',
              'RETESTE DE CONSTRUÇÃO VERDE; 7 WORKFLOWS PERMANENTES VERDES; SÉTIMA A1 PENDENTE',
              'CHECKPOINT status',
          )
          replace_once(
              'docs/sprints/micromodelos/MM01/CHECKPOINT.md',
              '- a candidata foi reconciliada sucessivamente com as bases pós-V10 e pós-V11;',
              '- a candidata foi reconciliada sucessivamente com as bases pós-V10, pós-V11 e com `main@28669f99db27cf23df73549297bbf57eda033f58` após a integração do plano mestre SEF;',
              'CHECKPOINT base',
          )
          replace_once(
              'docs/sprints/micromodelos/MM01/CHECKPOINT.md',
              '1. concluir o reteste de construção e validar os workflows permanentes do novo HEAD;\n2. executar sétima A1 em sessão independente;\n3. confrontar qualquer novo achado com a árvore;\n4. se a sétima A1 for limpa, executar contraditório final;\n5. sincronizar o bloco MM01 do `CHANGELOG.md` preservando byte-for-byte o restante do arquivo;\n6. revalidar a árvore exata e reconfirmar `main`, `behind_by` e mergeabilidade;\n7. obter aceite explícito;\n8. só então integrar a PR #51.',
              '1. executar sétima A1 em sessão independente;\n2. confrontar qualquer novo achado com a árvore;\n3. se a sétima A1 for limpa, executar contraditório final;\n4. sincronizar o bloco MM01 do `CHANGELOG.md` preservando byte-for-byte o restante do arquivo;\n5. revalidar a árvore exata e reconfirmar `main`, `behind_by` e mergeabilidade;\n6. obter aceite explícito;\n7. só então integrar a PR #51.',
              'CHECKPOINT gates',
          )
          replace_once(
              'docs/sprints/micromodelos/README.md',
              'os dois desvios bloqueantes da sexta A1 foram confirmados e corrigidos; reteste e sétima A1 independentes pendentes.',
              'os dois desvios bloqueantes da sexta A1 foram confirmados e corrigidos; reteste e sete workflows permanentes verdes; sétima A1 independente pendente.',
              'índice status',
          )
          replace_once(
              'docs/sprints/micromodelos/README.md',
              '1. concluir o reteste de construção e obter os workflows permanentes verdes no HEAD corrigido;\n2. executar uma **sétima A1 independente** sobre esse HEAD, sem usar relatórios anteriores, narrativa do autor, changelog ou mensagens de commit como prova;\n3. confrontar qualquer novo achado e corrigir somente se procedente;\n4. se a sétima A1 for limpa, executar contraditório final;\n5. sincronizar o bloco MM01 do `CHANGELOG.md` antes do merge, preservando byte a byte o histórico anterior;\n6. revalidar a árvore exata após o changelog, reconfirmar `main`/`behind_by`/mergeabilidade e solicitar aceite final explícito;\n7. integrar a PR #51 somente após o aceite.',
              '1. executar uma **sétima A1 independente** sobre esse HEAD, sem usar relatórios anteriores, narrativa do autor, changelog ou mensagens de commit como prova;\n2. confrontar qualquer novo achado e corrigir somente se procedente;\n3. se a sétima A1 for limpa, executar contraditório final;\n4. sincronizar o bloco MM01 do `CHANGELOG.md` antes do merge, preservando byte a byte o histórico anterior;\n5. revalidar a árvore exata após o changelog, reconfirmar `main`/`behind_by`/mergeabilidade e solicitar aceite final explícito;\n6. integrar a PR #51 somente após o aceite.',
              'índice gates',
          )
          PY

      - name: Remover workflow transitório
        run: git rm .github/workflows/mm01-doc-sync-after-a1-6.yml

      - name: Instalar dependencias
        run: python -m pip install -r tools/requirements-dev.txt

      - name: Executar suite MM01
        run: python -B -m unittest tools/tests/test_micromodelo_mm01.py -v

      - name: Executar gate estrutural e README congelado
        run: python -B tools/validate_assistant.py --root ambiente_fonte --conferir-readme

      - name: Conferir escopo documental
        shell: bash
        run: |
          git diff --check
          test ! -e .github/workflows/mm01-doc-sync-after-a1-6.yml
          test "$(git diff --name-only HEAD -- CHANGELOG.md | wc -l)" -eq 0
          test "$(git diff --name-only HEAD -- ambiente_fonte/.assistant | wc -l)" -eq 0
          changed="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' docs/sprints/micromodelos/MM01/CHECKPOINT.md docs/sprints/micromodelos/MM01/README.md docs/sprints/micromodelos/README.md | sort)"
          test "$changed" = "$expected"

      - name: Publicar sincronizacao documental
        shell: bash
        run: |
          git config user.name "Rodrigo"
          git config user.email "guimarais.r.rodrigo@gmail.com"
          git add -A
          git commit -m "docs(mm01): sincronizar estado apos sexta A1"
          git push origin HEAD:micromodelos/mm01-contrato-canonico
