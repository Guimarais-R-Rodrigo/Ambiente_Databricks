name: Integracao final verificada R03 com V01
on:
  push:
    branches: [codex/readmes-r03-integracao]
    paths: [.github/workflows/readmes-r03-integracao-final.yml]
permissions:
  contents: read
jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      SPARK_LOCAL_IP: '127.0.0.1'
      R03B: d61fedbf111075aa3f238b46d2d64834b185bc10
      MAIN: 836f23684cf76ee1f3d7898d44acb70d32a7ff59
      EXPECTED_PARENT: 119222e9927882996086d9a83102dca07d179d25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compor e resolver os três conflitos reproduzidos
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git cat-file -e "$MAIN^{commit}"
          set +e
          git merge --no-commit --no-ff "$MAIN" > "$RUNNER_TEMP/merge.txt" 2>&1
          rc=$?
          set -e
          test "$rc" = 1
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n' CHANGELOG.md README.md docs/sprints/README.md | sort)"
          test "$conflicts" = "$expected"
          printf '%s\n' "$conflicts" > "$RUNNER_TEMP/conflicts.txt"
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          R03=os.environ['R03B']; MAIN=os.environ['MAIN']
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          intro='# Changelog\n\nToda mudança relevante deste projeto é registrada aqui, em entradas curtas, sem\nexpor identificadores corporativos, PII ou segredos. Formato: seções por data,\nsubseções Adicionado/Atualizado/Corrigido/Removido, cada item com a IA autora\nentre parênteses. Template: `.claude/templates/changelog-entry.md`.\n\n'
          marker='## 2026-09-12 — V00: reconciliação e aceite de integração Git (Codex)'
          r03=show(R03,'CHANGELOG.md'); main=show(MAIN,'CHANGELOG.md')
          assert r03.startswith(intro) and main.startswith(intro) and marker in r03 and marker in main
          integration='''## 2026-09-12 — R03-I: reconciliação READMEs com V01 integrada (ChatGPT)\n\n### Atualizado\n\n- (ChatGPT) R03-A/R03-B reconciliadas com a `main` que já contém V01 e seu alinhamento documental; três conflitos textuais resolvidos sem descartar qualquer iniciativa.\n- (ChatGPT) Estado agregado do README raiz recalculado pela execução real; índice de sprints passa a registrar simultaneamente a continuidade dos READMEs e o estado aceito/integrado de V00/V01.\n\n### Notas\n\n- (ChatGPT) Integração autorizada explicitamente por Rodrigo; árvore combinada revalidada antes do merge. Evidências anteriores continuam vinculadas às árvores em que foram produzidas.\n- (ChatGPT) Sem publicação Databricks, mudança funcional, V02 ou R04-A nesta reconciliação. Auditoria independente e homologações operacionais continuam separadas.\n\n'''
          r03_unique=r03[len(intro):r03.index(marker)]
          main_unique=main[len(intro):main.index(marker)]
          common=main[main.index(marker):]
          Path('CHANGELOG.md').write_text(intro+integration+r03_unique+main_unique+common,encoding='utf-8')
          Path('README.md').write_text(show(R03,'README.md'),encoding='utf-8')
          s_r03=show(R03,'docs/sprints/README.md'); s_main=show(MAIN,'docs/sprints/README.md')
          theme='## Sistema de Temas do Hub'
          assert theme in s_main
          theme_main=s_main[s_main.index(theme):]
          if theme in s_r03: s_r03=s_r03[:s_r03.index(theme)]
          integration_section='''## Integração READMEs com a main V01 — 2026-09-12\n\nRodrigo autorizou a reconciliação e integração das R03-A/R03-B com a `main` que já contém V01. A candidata combinada preserva os 19 READMEs operacionais da iniciativa, o contrato 1.0.0 e a documentação/guardas do sistema de temas. Registro em [`INTEGRACAO_R03_V01.md`](readmes_objetos/INTEGRACAO_R03_V01.md).\n\n'''
          Path('docs/sprints/README.md').write_text(s_r03.rstrip()+"\n\n"+integration_section+theme_main,encoding='utf-8')
          Path('docs/sprints/readmes_objetos/INTEGRACAO_R03_V01.md').write_text('''# Integração R03-A/R03-B com a main V01\n\n## Estado\n\nReconciliação e integração autorizadas explicitamente por Rodrigo em 12/09/2026. Este registro pertence à candidata combinada e às evidências produzidas sobre ela.\n\n## Bases\n\n- R03-B acumulada: `d61fedbf111075aa3f238b46d2d64834b185bc10`.\n- main com V01 aceita/integrada e alinhamento documental: `836f23684cf76ee1f3d7898d44acb70d32a7ff59`.\n- R03-B já contém a R03-A e o contrato de README 1.0.0.\n\n## Conflitos reproduzidos\n\nA composição encontrou somente três conflitos textuais: `CHANGELOG.md`, `README.md` e `docs/sprints/README.md`. `CLAUDE.md`, o índice de ADRs e os arquivos V01 combinaram sem conflito textual.\n\n## Política de resolução\n\n1. `CHANGELOG.md`: preservar as entradas exclusivas R03 e V01 e manter uma única cópia do histórico comum.\n2. `README.md`: preservar a narrativa R03-B e recalcular o bloco de contagens com o validador sobre a árvore combinada.\n3. `docs/sprints/README.md`: preservar R03-A/R03-B e o estado vigente de V00/V01, acrescentando esta reconciliação sem reescrever relatos históricos.\n\n## Preservação exigida\n\n- ADR-0013, contrato, fixtures, verificadores, testes e workflow V01 permanecem byte a byte iguais à main, fora dos agregadores reconciliados.\n- Os 19 READMEs operacionais, três exemplares, contrato 1.0.0, notebooks/documentação da R03 e controle de migração permanecem iguais à R03-B, fora dos agregadores reconciliados.\n- Nenhum helper, API, paleta/CSS, formulário, skill ou objeto analítico é alterado por esta integração.\n\n## Limites\n\nA reconciliação não publica no Databricks, não inicia V02 ou R04-A, não converte sete SKIPs opcionais de Spark em PASS e não substitui auditoria independente ou homologação operacional.\n''',encoding='utf-8')
          PY
          # Repor bytes canônicos das áreas que cada frente possui.
          git checkout "$MAIN" -- \
            .github/workflows/temas-v01-ci.yml \
            docs/decisions/ADR-0013-sistema-de-temas.md \
            docs/sprints/sistema_temas/V01 \
            docs/testes/sistema_temas/V01 \
            tools/requirements-temas-dev.txt \
            tools/temas_v01_contract.py \
            tools/tests/test_temas_v01.py \
            tools/tests/test_temas_v01_integracao.py
          git checkout "$R03B" -- \
            ambiente_fonte/.assistant \
            Novo_Ambiente_Simulado \
            MANUAL_TECNICO.md \
            tools/readme_objeto_contract.py \
            tools/tests/test_readme_objeto_contract.py \
            tools/tests/test_readme_integracao.py \
            docs/sprints/readmes_objetos/CONTROLE_MIGRACAO.json
          # Workflows transitórios não pertencem à árvore final.
          git rm -f .github/workflows/readmes-r03-integracao-diagnostico.yml \
                    .github/workflows/readmes-r03-integracao-apply.yml \
                    .github/workflows/readmes-r03-integracao-final.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          python tools/validate_assistant.py 2>&1 | tee "$RUNNER_TEMP/r03i-contagens.txt"
          python - <<'PY'
          import os,re
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'],'r03i-contagens.txt').read_text()
          labels=['skills','prompts','helpers citados','markdown / links','notebooks / links','readmes de objeto','pastas de objeto','forma da pasta','contrato de dados','contrato de entrada','saída colada','idioma da docstring','normas do molde','notebook exercita','python (AST)','instrucoes','repo (identidade)','repo (links)']
          lines=[]
          for label in labels:
              m=re.search(rf'^{re.escape(label)}\s*:.*$',out,re.M)
              if not m: raise SystemExit('Contagem ausente: '+label)
              lines.append(m.group(0))
          status=re.search(r'^APROVADO:.*$',out,re.M)
          if not status: raise SystemExit('Validador base não aprovou a composição')
          text=Path('README.md').read_text(encoding='utf-8'); anchor='### Estado verificável do gate local'
          start=text.index('```text',text.index(anchor)); end=text.index('```',start+7)
          block='```text\n'+'\n'.join(lines)+'\n\n'+status.group(0)+'\n```'
          Path('README.md').write_text(text[:start]+block+text[end+3:],encoding='utf-8')
          PY
          git add README.md
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-dev.txt
            tools/requirements-temas-dev.txt
      - name: Instalar dependências de manutenção
        run: python -m pip install -r tools/requirements-dev.txt -r tools/requirements-temas-dev.txt
      - name: Gate, V00 e V01
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_local.py --verbose 2>&1 | tee "$RUNNER_TEMP/r03i-gate.txt"
          for suite in test_inventario_visual test_visual_legado_v00 test_baseline_visual_runner; do
            python "tools/tests/$suite.py" 2>&1 | tee "$RUNNER_TEMP/$suite.txt"
          done
          python -B tools/temas_v01_contract.py 2>&1 | tee "$RUNNER_TEMP/r03i-v01-contract.txt"
          python -B -m unittest discover -s tools/tests -p 'test_temas_v01*.py' -v 2>&1 | tee "$RUNNER_TEMP/r03i-v01-tests.txt"
      - name: Preservação cruzada
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$MAIN" -- \
            .github/workflows/temas-v01-ci.yml \
            docs/decisions/ADR-0013-sistema-de-temas.md \
            docs/sprints/sistema_temas/V01 \
            docs/testes/sistema_temas/V01 \
            tools/requirements-temas-dev.txt \
            tools/temas_v01_contract.py \
            tools/tests/test_temas_v01.py \
            tools/tests/test_temas_v01_integracao.py
          git diff --exit-code "$R03B" -- \
            ambiente_fonte/.assistant \
            Novo_Ambiente_Simulado \
            MANUAL_TECNICO.md \
            tools/readme_objeto_contract.py \
            tools/tests/test_readme_objeto_contract.py \
            tools/tests/test_readme_integracao.py \
            docs/sprints/readmes_objetos/CONTROLE_MIGRACAO.json
          printf '%s\n' '{"v01_preservada":true,"readmes_preservados":true,"readmes_operacionais":19,"exemplares":3,"pendentes":55}' > "$RUNNER_TEMP/r03i-preservacao.json"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Suplementos R03-A e R03-B com Spark real
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/r03i-env"
          "$RUNNER_TEMP/r03i-env/bin/python" -m pip install numpy==2.3.5 pandas==2.2.3 plotly==6.5.2 jinja2==3.1.6 scipy==1.17.0 pyspark==4.0.1
          "$RUNNER_TEMP/r03i-env/bin/python" -m pip freeze > "$RUNNER_TEMP/r03i-pacotes.txt"
          mkdir -p "$RUNNER_TEMP/r03i-spark"
          (cd "$RUNNER_TEMP/r03i-spark" && "$RUNNER_TEMP/r03i-env/bin/python" "$GITHUB_WORKSPACE/docs/sprints/readmes_objetos/evidencias_r03a/verificar_r03a.py" --require-spark) 2>&1 | tee "$RUNNER_TEMP/r03i-r03a.txt"
          (cd "$RUNNER_TEMP/r03i-spark" && "$RUNNER_TEMP/r03i-env/bin/python" "$GITHUB_WORKSPACE/docs/sprints/readmes_objetos/evidencias_r03b/verificar_r03b.py" --require-spark) 2>&1 | tee "$RUNNER_TEMP/r03i-r03b.txt"
          git diff --exit-code
      - name: Criar commit testado sem mover refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); main=os.environ['MAIN']
          api=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          payload={'tree':tree,'parents':[head,main],'message':'docs(r03i): reconcilia R03-A/B com V01 e revalida composição (ChatGPT)\n\nResolve três agregadores preservando bytes canônicos das duas frentes.\nContagens recalculadas na árvore combinada; gate, V00, V01 e suplementos\nR03-A/R03-B executados antes do commit. Sem Databricks, V02 ou R04-A.'}
          req=urllib.request.Request(api+'/git/commits',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=90) as r: commit=json.load(r)
          result={'commit':commit['sha'],'tree':tree,'parents':[head,main],'main':main,'r03b':os.environ['R03B'],'run_id':os.environ['GITHUB_RUN_ID'],'refs_atualizadas_pelo_workflow':False,'databricks_publicado':False}
          Path(os.environ['RUNNER_TEMP'],'R03I-integracao.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Guardar evidências mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03i-evidencias-integracao
          retention-days: 7
          path: |
            ${{ runner.temp }}/merge.txt
            ${{ runner.temp }}/conflicts.txt
            ${{ runner.temp }}/r03i-contagens.txt
            ${{ runner.temp }}/r03i-gate.txt
            ${{ runner.temp }}/test_inventario_visual.txt
            ${{ runner.temp }}/test_visual_legado_v00.txt
            ${{ runner.temp }}/test_baseline_visual_runner.txt
            ${{ runner.temp }}/r03i-v01-contract.txt
            ${{ runner.temp }}/r03i-v01-tests.txt
            ${{ runner.temp }}/r03i-preservacao.json
            ${{ runner.temp }}/r03i-r03a.txt
            ${{ runner.temp }}/r03i-r03b.txt
            ${{ runner.temp }}/r03i-pacotes.txt
            ${{ runner.temp }}/R03I-integracao.json
          if-no-files-found: warn
