name: TEMP MM01 A1 round4 fix

on:
  push:
    paths:
      - '.github/workflows/mm01-a1-round4-fix-transient.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: micromodelos/mm01-contrato-canonico
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Dependências de manutenção
        run: python -m pip install -r tools/requirements-dev.txt

      - name: Aplicar correção da quarta A1
        run: python tools/mm01_apply_a1_round4_fixes.py

      - name: Preparar árvore permanente
        run: git rm tools/mm01_apply_a1_round4_fixes.py .github/workflows/mm01-a1-round4-fix-transient.yml

      - name: Confirmar 31 métodos MM01
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('tools/tests/test_micromodelo_mm01.py').read_text(encoding='utf-8'))
          methods = [
              node.name
              for cls in tree.body if isinstance(cls, ast.ClassDef)
              for node in cls.body if isinstance(node, ast.FunctionDef) and node.name.startswith('test_')
          ]
          print(f'mm01_test_methods={len(methods)}')
          if len(methods) != 31:
              raise SystemExit(f'esperados 31 métodos, encontrados {len(methods)}')
          PY

      - name: Suíte MM01 ampliada
        run: python -B -m unittest tools/tests/test_micromodelo_mm01.py -v

      - name: CLI direta, materialidade e previous
        shell: bash
        run: |
          set -euo pipefail
          CLI=tools/micromodelo_mm01_contract.py
          SCHEMA=docs/sprints/micromodelos/MM01/micromodelo.schema.json
          VALID=tools/tests/fixtures/micromodelos_mm01/valido_validado.json

          python -B "$CLI" docs/sprints/micromodelos/MM01/micromodelo.template.yaml --schema "$SCHEMA"
          python -B "$CLI" "$VALID" --schema "$SCHEMA"

          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          valid = json.loads(Path('tools/tests/fixtures/micromodelos_mm01/valido_validado.json').read_text(encoding='utf-8'))

          negative = copy.deepcopy(valid)
          negative['evidencias'][0]['regra'] = '\u200b\u2060!!!€'
          Path('/tmp/mm01_round4_negative.json').write_text(json.dumps(negative, ensure_ascii=False), encoding='utf-8')

          positive = copy.deepcopy(valid)
          positive['evidencias'][0]['regra'] = '规则有效 ٤٢'
          positive['contra_evidencias'][0]['regra'] = 'नियम वैध ४२'
          positive['experimentos'][0]['hipotese'] = 'Δοκιμή δεδομένων'
          positive['experimentos'][0]['resultado'] = 'результат Jose\u0301'
          positive['validacao']['resultado']['resumo'] = '結果 válido ٤٢'
          positive['identidade']['estado']['condicao'] = 'SUSPENSO'
          positive['identidade']['estado']['motivo_condicao'] = 'تعليق تشغيلي ١'
          Path('/tmp/mm01_round4_positive.json').write_text(json.dumps(positive, ensure_ascii=False), encoding='utf-8')

          previous = copy.deepcopy(valid)
          previous['identidade']['estado']['fase_anterior'] = 'EM_VALIDACAO_GOVERNANCA'
          previous['identidade']['estado']['fase_atual'] = 'PUBLICADO'
          previous['publicacao']['status'] = 'PUBLICADO'
          previous['publicacao']['confirmacao_externa'] = {
              'autoridade': 'GOVERNANCA_EXTERNA',
              'referencia': 'PUB-001',
              'produto_dados_ref': 'PROD-001',
              'confirmado_em_utc': '2026-09-14T16:00:00Z'
          }
          previous['saida']['publicacao'] = {
              'estado': 'DEFINIDO',
              'campo_booleano': {'nome': 'possui_caracteristica', 'tipo': 'BOOLEAN'},
              'politica_indeterminado': {
                  'tratamento': 'CAMPO_COBERTURA_SEPARADO',
                  'indeterminado_vira_false': False,
                  'regra_ref': None,
                  'proveniencia': copy.deepcopy(valid['classificacao']['semantica']['proveniencia'])
              }
          }
          current = copy.deepcopy(valid)
          current['identidade']['estado']['fase_anterior'] = 'PUBLICADO'
          current['identidade']['estado']['fase_atual'] = 'VALIDADO'
          Path('/tmp/mm01_round4_previous.json').write_text(json.dumps(previous, ensure_ascii=False), encoding='utf-8')
          Path('/tmp/mm01_round4_current.json').write_text(json.dumps(current, ensure_ascii=False), encoding='utf-8')
          PY

          python -B "$CLI" /tmp/mm01_round4_positive.json --schema "$SCHEMA"
          if python -B "$CLI" /tmp/mm01_round4_negative.json --schema "$SCHEMA"; then
            echo 'ERRO: regra normativa materialmente vazia foi aceita' >&2
            exit 1
          fi
          if python -B "$CLI" /tmp/mm01_round4_current.json --schema "$SCHEMA" --previous /tmp/mm01_round4_previous.json; then
            echo 'ERRO: rewind de PUBLICADO foi aceito' >&2
            exit 1
          fi

      - name: Gate estrutural e métrica congelada
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/validate_assistant.py --root ambiente_fonte
          python -B tools/validate_assistant.py --root ambiente_fonte --conferir-readme

      - name: Invariantes históricos e escopo
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- CHANGELOG.md
          git diff --exit-code HEAD -- docs/auditoria/2026-09-14_micromodelos-mm01/03_resultado_a1.md
          git diff --exit-code HEAD -- docs/auditoria/2026-09-14_micromodelos-mm01/04_resultado_a1_reauditoria.md
          git diff --exit-code HEAD -- docs/auditoria/2026-09-14_micromodelos-mm01/05_resultado_a1_reauditoria_2.md
          test ! -e tools/mm01_apply_a1_round4_fixes.py
          test ! -e .github/workflows/mm01-a1-round4-fix-transient.yml
          ! grep -R "spec_fingerprint" -n tools/micromodelo_mm01_contract.py docs/sprints/micromodelos/MM01 tools/tests/test_micromodelo_mm01.py

      - name: Publicar correção validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sprints/micromodelos/MM01/micromodelo.schema.json \
                  tools/micromodelo_mm01_contract.py \
                  tools/tests/test_micromodelo_mm01.py
          git commit -m 'fix(mm01): materializar campos normativos equivalentes'
          git push origin HEAD:micromodelos/mm01-contrato-canonico
