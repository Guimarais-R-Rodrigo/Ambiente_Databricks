name: Freeze tecnico READMEs R11
on:
  push:
    branches: [codex/readmes-r11]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Materializar R11
        run: |
          set -euo pipefail
          BASE=7ba5d386c30374c429114572ff5bc8e889d3ea7b
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          python docs/sprints/readmes_objetos/evidencias_r11/aplicar_r11a.py
          python docs/sprints/readmes_objetos/evidencias_r11/aplicar_r11b.py
          python docs/sprints/readmes_objetos/evidencias_r11/finalizar_r11.py
          python tools/render_simulado.py --write
          rm .github/workflows/readmes-r11-build.yml
          git add -A
          git diff --cached --check
      - name: Instalar dependencias
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Validar snapshot e preservacao
        run: |
          set -euo pipefail
          python tools/validate_assistant.py | tee /tmp/r11-validator.txt
          python docs/sprints/readmes_objetos/evidencias_r11/finalizar_r11.py --snapshot /tmp/r11-validator.txt
          python tools/validate_assistant.py --conferir-readme
          python docs/sprints/readmes_objetos/evidencias_r11/verificar_r11.py
      - name: Gate permanente
        run: python tools/ci_local.py | tee /tmp/r11-ci.txt
      - name: Publicar candidata
        run: |
          set -euo pipefail
          E=docs/sprints/readmes_objetos/evidencias_r11/FREEZE_R11.txt
          { echo 'R11 — freeze tecnico'; echo 'base=7ba5d386c30374c429114572ff5bc8e889d3ea7b'; echo "workflow_source=${GITHUB_SHA}"; python --version; echo; echo '== validator =='; cat /tmp/r11-validator.txt; echo; echo '== ci_local =='; cat /tmp/r11-ci.txt; echo; echo 'Preservacao R11 aprovada por verificar_r11.py.'; } > "$E"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(r11): freeze tecnico e fechamento da migracao (ChatGPT)'
          git push origin HEAD:codex/readmes-r11
