name: MM01 changelog aditivo transitório

on:
  push:
    branches:
      - micromodelos/mm01-contrato-canonico
    paths:
      - .github/workflows/mm01-changelog-aditivo.yml

permissions:
  contents: write

jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da candidata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inserir entrada MM01 preservando todos os bytes históricos
        env:
          ENTRY_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('CHANGELOG.md')
          original = path.read_bytes()
          marker = '## 2026-09-14 — MM00: integração e fechamento documental do Framework de Micromodelos (ChatGPT)\n'.encode('utf-8')
          if original.count(marker) != 1:
              raise SystemExit(f'marcador MM00 inesperado: {original.count(marker)} ocorrência(s)')
          if b'## 2026-09-14 \xe2\x80\x94 MM01: candidata do contrato can\xc3\xb4nico' in original:
              raise SystemExit('entrada MM01 já existe; abortando para evitar duplicidade')
          entry = base64.b64decode(os.environ['ENTRY_B64'], validate=True)
          before, after = original.split(marker, 1)
          updated = before + entry + marker + after
          if updated.replace(entry, b'', 1) != original:
              raise SystemExit('prova de preservação byte a byte falhou')
          path.write_bytes(updated)
          PY

      - name: Provar adição pura no changelog
        run: |
          NUMSTAT="$(git diff --numstat -- CHANGELOG.md)"
          echo "${NUMSTAT}"
          ADDED="$(printf '%s' "${NUMSTAT}" | awk '{print $1}')"
          DELETED="$(printf '%s' "${NUMSTAT}" | awk '{print $2}')"
          test -n "${ADDED}"
          test "${DELETED}" = "0"

      - name: Remover workflow transitório e publicar registro
        run: |
          git rm .github/workflows/mm01-changelog-aditivo.yml
          git add CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(mm01): registrar candidata no changelog de forma aditiva"
          git push origin HEAD
