name: Corrigir contagem final V02
on:
  push:
    branches:
      - codex/v02-pos-merge-docs-final-20260912
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Atualizar somente a métrica reproduzível
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('README.md'); t=p.read_text(encoding='utf-8'); old='repo (links)       : 1028 links fora da raiz analisada'; new='repo (links)       : 1027 links fora da raiz analisada'; assert t.count(old)==1; p.write_text(t.replace(old,new),encoding='utf-8')"
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add README.md
          git commit -m "docs: reconciliar contagem final de links após V02"
          git push origin HEAD:codex/v02-pos-merge-docs-final-20260912
