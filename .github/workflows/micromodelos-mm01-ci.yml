name: Contrato de micromodelos MM01

on:
  pull_request:
  push:
    branches:
      - main
      - 'micromodelos/mm01-*'

permissions:
  contents: read

jobs:
  validar-mm01:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-dev.txt
            tools/requirements-temas-dev.txt

      - name: Instalar dependências de manutenção
        run: python -m pip install -r tools/requirements-dev.txt

      - name: Preparar derivado local do SHA
        run: |
          python -B tools/validate_assistant.py --conferir-readme
          python -B tools/render_simulado.py --write
          python -B tools/render_simulado.py --check
      - name: Executar contrato e mutantes MM01
        run: |
          python -B -m unittest discover -s tools/tests -p 'test_micromodelo*.py' -v
          python -B tools/tests/test_aceite_micromodelos_trabalho.py -v

      - name: Executar gate estrutural
        run: python -B tools/validate_assistant.py --root ambiente_databricks

      - name: Registrar fronteira do gate
        run: echo 'Os testes Micromodelos validam contratos e ensaio sintético do produto extraído; não acessam Databricks, Unity Catalog, MLflow, ACLs, dados reais ou publicação externa.'
