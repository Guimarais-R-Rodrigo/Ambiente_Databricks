    peso: 0.7
    proveniencia:
      status: PROPOSTO
      origem: heurística sintética E0
      referencia: null
      observado_em_utc: null
      aprovacao: null
      medicao: null
  - id: cobertura_confirmada
    descricao: 1 para cobertura completa; 0 caso contrario
    peso: 0.3
    proveniencia:
      status: PROPOSTO
      origem: heurística sintética E0
      referencia: null
      observado_em_utc: null
      aprovacao: null
      medicao: null
