schema_version: 1.0.0
identidade:
  nome: recencia-contato-sintetica
  titulo: Recencia de contato verificavel (exemplo sintetico)
  micromodel_version: 0.1.0
  estado:
    fase_atual: EM_ESTUDO
    fase_anterior: EM_DESCOBERTA
    condicao: ATIVO
    motivo_condicao: null
negocio:
  caracteristica: contato verificavel recente em entidade ficticia
  objetivo: demonstrar como classificar recencia de contato preservando incerteza
  definicao_operacional: TRUE se ha contato confirmado nos sete dias anteriores a
    2026-09-30, com cobertura completa e sem estorno; FALSE apenas diante de atestado
    explicito de ausencia; demais casos indeterminados
  uso_pretendido:
  - avaliacao didatica do contrato e da execucao sintetica
  nao_usar_para:
  - decisao real, atendimento, oferta ou publicacao corporativa
entidade:
  tipo: pessoa ficticia
  chave_logica: id_entidade
  granularidade: uma classificacao por entidade ficticia em 2026-09-30
  populacao_elegivel: sete entidades inteiramente sinteticas da fixture local
  referencia_temporal: 2026-09-30; janela inclusiva de sete dias completos para contato
    recente
fontes:
- id: fonte_001
  catalogo_ref: CATALOGO_PRODUTO
  schema: crm_sintetico
  objeto: cobertura_contato_sintetica
  tipo_objeto: VIEW
  campos:
  - cobertura_completa
  - id_entidade
  papel: ELEGIBILIDADE
  proveniencia:
    status: DESCOBERTO
    origem: metadados da fixture inteiramente sintetica
    referencia: dados_sinteticos.json
    observado_em_utc: null
    aprovacao: null
    medicao: null
- id: fonte_002
  catalogo_ref: CATALOGO_PRODUTO
  schema: crm_sintetico
  objeto: contatos_sinteticos
  tipo_objeto: TABLE
  campos:
  - data_evento
  - event_id
  - id_entidade
  - tipo_evento
  papel: EVIDENCIA
  proveniencia:
    status: DESCOBERTO
    origem: metadados da fixture inteiramente sintetica
    referencia: dados_sinteticos.json
    observado_em_utc: null
    aprovacao: null
    medicao: null
evidencias:
- id: contato_confirmado
  descricao: contato confirmado dentro da janela de sete dias
  fontes_ref:
  - fonte_002
  regra: CONFIRMADO entre 2026-09-23 e 2026-09-30 com cobertura completa e sem ESTORNADO
    para a entidade
  proveniencia:
    status: PROPOSTO
    origem: regra de laboratório E0
    referencia: null
    observado_em_utc: null
    aprovacao: null
    medicao: null
contra_evidencias:
- id: ausencia_atestada
  descricao: atestado explicito de nenhum contato recente
  fontes_ref:
  - fonte_002
  regra: NEGATIVO_VERIFICADO nos sete dias da janela e cobertura completa permitem
    FALSE; um ESTORNADO conflitante preserva INDETERMINADO
  proveniencia:
    status: PROPOSTO
    origem: regra de laboratório E0
    referencia: null
    observado_em_utc: null
    aprovacao: null
    medicao: null
classificacao:
  tipo: BOOLEANO_COM_INDETERMINADO
  semantica:
    quando_true: ha contato CONFIRMADO na janela de sete dias, cobertura completa
      e nenhum ESTORNADO conflitante
    quando_false: ha NEGATIVO_VERIFICADO explicito na janela de sete dias com cobertura
      completa e nenhum contato confirmado conflitante
    quando_indeterminado: cobertura parcial, so contato antigo, ausencia de eventos
      ou sinais conflitantes nao permitem concluir
    proveniencia:
      status: PROPOSTO
      origem: semântica de laboratório E0
      referencia: null
      observado_em_utc: null
      aprovacao: null
      medicao: null
  ausencia_evidencia:
    tratamento: INDETERMINADO
    resultado_sem_evidencia: INDETERMINADO
    regra_ref: null
    proveniencia:
      status: PROPOSTO
      origem: template MM01
      referencia: null
      observado_em_utc: null
      aprovacao: null
      medicao: null
  limiares:
  - id: janela_recencia_dias
    descricao: idade maxima inclusiva do contato recente
    operador: LTE
    valor: 7
    unidade: dias
    proveniencia:
      status: PROPOSTO
      origem: limiar sintético E0
      referencia: null
      observado_em_utc: null
      aprovacao: null
      medicao: null
score:
  habilitado: true
  tipo_semantica: FORCA_EVIDENCIA
  semantica_ref: null
  escala:
    min: 0
    max: 100
  normalizacao:
    metodo: SOMA_PONDERADA_0_100
    referencia: null
    proveniencia:
